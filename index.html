            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];

        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];

                                words = [...beforeWords, errorWord, ...afterWords];
                                errorWordIndex = beforeWords.length;

                                words = q.text.split(' ').filter(w => w.trim() !== '');
                            }

                                originalQuestion: q,
                                words: words,
                                errorWordIndex: errorWordIndex,
                                options: shuffleArray(finalOptions),
                                step: 1,
                                selectedWordIndex: null,
                                selectedOption: null,
                                showHint: false,
                                shakeWordIndex: null,
                                optionsAnimate: false 
                            };
                        });
                    }
                    else if (sec.type === 'mcq') {
                        this.state.progress[sec.id] = { answered: 0, total: sec.questions.length, score: 0 };
                        this.state.sectionData[sec.id] = sec.questions.map(q => {
                            let opts = q.options.map((opt, oIdx) => ({ text: opt, isCorrect: oIdx === q.correct }));
                            return { originalQuestion: q, options: shuffleArray(opts), answered: false, selectedOption: null, showHint: false };
                        });
                    } 
                    else if (sec.type === 'spotting') {
                        this.state.progress[sec.id] = { answered: 0, total: sec.questions.length, score: 0 };
                        this.state.sectionData[sec.id] = sec.questions.map(q => ({ originalQuestion: q, answered: false, selectedIndex: null, showHint: false }));
                    } 
                    else if (sec.type === 'classify') {
                        this.state.progress[sec.id] = { answered: 0, total: sec.questions.length, score: 0 };
                        let placedItems = {};
                        sec.categories.forEach(c => placedItems[c.id] = []);
                        this.state.sectionData[sec.id] = { questions: shuffleArray(sec.questions).map(q => ({ originalQuestion: q, showHint: false })), currentIndex: 0, status: 'idle', placedItems: placedItems, animatingOut: false };
                    }
                    else if (sec.type === 'sort') {
                        this.state.progress[sec.id] = { answered: 0, total: sec.questions.length, score: 0 };
                        this.state.sectionData[sec.id] = {
                            questions: sec.questions.map(q => {
                                let opts = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct }));
                                return { originalQuestion: q, options: shuffleArray(opts), showHint: false };
                            }),
                            currentIndex: 0, status: 'idle', animatingOut: false
                        };
                    }
                });
            },

            renderLayout() {
                // 🛑 [AI GUARD]: ممنوع تعديل الهيكل الأساسي أو الترويسة (Header) أو التذييل (Footer)

            updateUI() {
                this.updateTabs();
                APP_DATA.sections.forEach(sec => {
                    const el = document.getElementById(`section-${sec.id}`);
                    if (el) {
                        if (this.state.activeTab === sec.id) { el.className = 'block'; el.innerHTML = this.renderSection(sec); }

                    }
                });
                this.checkFinalEvaluation();
            },

            updateTabs() {
                const wrapper = document.getElementById('tabs-wrapper');
                let html = '';
                APP_DATA.sections.forEach(section => {
                    const isActive = this.state.activeTab === section.id;
                    const secProgress = this.state.progress[section.id];
                    const isDone = secProgress.total > 0 && secProgress.answered === secProgress.total;
                    let activeClass = isActive ? `bg-${section.theme}-600 text-white border-${section.theme}-600 shadow-md` : "bg-white text-slate-600 border-slate-200";
                    html += `<button id="tab-${section.id}" type="button" onclick="App.handleTabChange('${section.id}')" class="shrink-0 whitespace-nowrap px-6 py-2 rounded-full font-semibold text-lg md:text-xl border-2 transition-all flex items-center justify-center gap-2 active:scale-95 ${activeClass}">${section.title}${isDone && !isActive ? ICONS.checkCircle : ''}</button>`;
                });
                wrapper.innerHTML = html;
                const currentProgress = this.state.progress[this.state.activeTab];
                const progressPercent = currentProgress && currentProgress.total > 0 ? (currentProgress.answered / currentProgress.total) * 100 : 0;
                const progressBar = document.getElementById('progress-bar');
                const theme = APP_DATA.sections.find(s => s.id === this.state.activeTab).theme;
                progressBar.className = `h-full transition-all duration-500 ease-out bg-${theme}-500`;

            showSectionResult(sectionId, sectionDef, progress) {

                if (resultArea) {

                }

                if (footerArea) {
                    footerArea.innerHTML = `<div class="smooth-expand w-full">${this.renderSectionFooterControls(sectionId, true)}</div>`;
                }
            },

            renderSection(sectionData) {
                switch(sectionData.type) {
                    case 'intro': return this.renderIntro(sectionData);
                    case 'mcq': return this.renderStandardSection(sectionData);
                    case 'error_correction': return this.renderErrorCorrection(sectionData);
                    case 'spotting': return this.renderStandardSection(sectionData);
                    case 'classify': return this.renderClassify(sectionData);
                    case 'sort': return this.renderSort(sectionData);
                    default: return '';
                }
            },

            renderIntro(sectionData) {
                let headerHTML = '';
                if (sectionData.description) headerHTML += `<div class="text-center mb-10 fade-in"><p class="text-lg md:text-xl text-${sectionData.theme}-800 font-semibold bg-${sectionData.theme}-50 bg-opacity-60 p-4 md:p-5 rounded-2xl shadow-sm inline-block w-full">${sectionData.description}</p></div>`;
                let gridHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 w-full fade-in">';
                sectionData.content.forEach(block => {
                    gridHTML += `<div class="bg-white border-2 border-${block.theme}-200 rounded-[2rem] p-6 md:p-8 shadow-sm md:hover:-translate-y-2 md:hover:shadow-xl transition-all duration-300 flex flex-col items-center text-center group cursor-default"><div class="w-16 h-16 md:w-20 md:h-20 bg-${block.theme}-100 rounded-full flex items-center justify-center text-3xl md:text-4xl mb-8 md:group-hover:scale-110 md:group-hover:-rotate-3 transition-transform duration-300 shrink-0">${block.icon}</div><h3 class="text-2xl md:text-3xl font-bold text-${block.theme}-800 mb-4 leading-relaxed w-full">${block.title}</h3><p class="text-lg md:text-xl font-medium text-slate-600 leading-relaxed mb-6 flex-grow w-full">${block.desc}</p><div class="w-full bg-${block.theme}-50/80 rounded-2xl p-5 text-center space-y-3 mt-auto"><div class="text-lg md:text-xl font-bold text-${block.theme}-900 leading-relaxed">${block.examples}</div></div></div>`;

            renderErrorCorrection(sectionData) {
                const sectionId = sectionData.id;
                const progress = this.state.progress[sectionId];
                const isComplete = progress.total > 0 && progress.answered === progress.total;
                const questions = this.state.sectionData[sectionId];
                
                let html = '<div class="fade-in">';
                if (sectionData.description) { html += `<div class="text-center mb-8"><p class="text-lg md:text-xl text-${sectionData.theme}-800 font-semibold bg-${sectionData.theme}-50 bg-opacity-60 p-4 md:p-5 rounded-2xl shadow-sm inline-block w-full">${sectionData.description}</p></div>`; }
                
                questions.forEach((qState, idx) => { html += `<div id="${sectionId}-wrapper-${idx}">${this.renderErrorCard(qState, idx, sectionData.theme, sectionId)}</div>`; });
                
                html += `</div>`; 
                html += `<div id="section-result-area-${sectionId}">`;
                if (isComplete) { html += `<div class="mt-12 p-8 md:p-10 bg-white border-2 border-${sectionData.theme}-200 rounded-2xl shadow-sm text-center max-w-2xl mx-auto w-full smooth-expand"><h3 class="text-2xl md:text-3xl font-semibold text-slate-700 mb-6">نتيجتك في قسم (${sectionData.title})</h3><div class="text-4xl md:text-5xl font-bold text-${sectionData.theme}-600 flex items-center justify-center gap-3"><span>${toArabicNum(progress.score)}</span><span class="text-2xl md:text-3xl text-slate-400 font-medium mt-1">من</span><span>${toArabicNum(progress.total)}</span></div></div>`; }
                html += `</div>`;
                html += `<div id="section-footer-area-${sectionId}" class="w-full">`;
                html += this.renderSectionFooterControls(sectionId, isComplete); 
                html += `</div>`;
                return html;
            },

            renderErrorCard(qState, idx, theme, sectionId) {
                const { originalQuestion: q, words, errorWordIndex, step, selectedWordIndex, selectedOption, showHint, shakeWordIndex } = qState;
                const isStep3 = step === 3;
                const isSelectedCorrect = selectedOption && selectedOption.isCorrect;
                const answerFadeClass = qState.answerAnimate ? 'smooth-expand' : '';
                let ringClass = isStep3 ? (isSelectedCorrect ? 'ring-2 ring-emerald-400' : 'ring-2 ring-rose-400') : '';

                let wordsHTML = '';
                words.forEach((word, wIdx) => {
                    const isErrorWord = wIdx === errorWordIndex;
                    const isShaking = shakeWordIndex === wIdx;
                    let wordClass = "px-4 md:px-6 py-3 md:py-4 text-2xl md:text-3xl font-bold rounded-xl transition-all duration-500 select-none ";
                    let displayWord = word;

                    if (step === 1) {
                        wordClass += `bg-white border-2 border-slate-200 text-slate-700 md:hover:border-${theme}-300 md:hover:bg-${theme}-50 md:hover:-translate-y-1 md:hover:shadow-md active:scale-95 cursor-pointer `;
                        if (isShaking) wordClass += "bg-rose-100 border-rose-400 text-rose-700 shake ";
                    } else {
                        if (isErrorWord) {
                            if (isStep3) {
                                displayWord = selectedOption.text; 
                                if (isSelectedCorrect) {
                                    wordClass += "bg-emerald-500 text-white border-2 border-emerald-600 z-10 ";
                                } else {
                                    wordClass += "bg-rose-500 text-white border-2 border-rose-600 z-10 ";
                                }
                            } else {
                                wordClass += "bg-rose-500 text-white border-2 border-rose-600 ";
                            }
                        } else {
                            wordClass += "bg-white border-2 border-slate-200 text-slate-700 cursor-default ";
                        }
                    }
                    wordsHTML += `<button ${step !== 1 ? 'disabled' : ''} onclick="App.handleErrorWordClick('${sectionId}', ${idx}, ${wIdx})" class="${wordClass}">${displayWord}</button>`;
                });

                let actionButtonsHTML = '';
                if (step >= 2) {
                    const optionsAnimClass = qState.optionsAnimate ? 'smooth-expand' : '';
                    actionButtonsHTML += `<div class="w-full ${optionsAnimClass}">`;
                    actionButtonsHTML += `<div class="w-full overflow-hidden">`; 
                    actionButtonsHTML += `<div class="w-full mt-4 border-t-2 border-slate-100 pt-6 flex flex-col items-center">`;
                    actionButtonsHTML += `<span class="mb-4 text-slate-600 font-bold text-lg md:text-xl">اختر التصويب الصحيح:</span>`;
                    actionButtonsHTML += `<div class="flex flex-wrap justify-center gap-3 w-full">`;

                    qState.options.forEach((opt, optIdx) => {
                        let btnClass = `flex-1 min-w-[120px] max-w-[200px] flex items-center justify-center min-h-[4.5rem] md:min-h-[5rem] px-4 py-3 rounded-xl font-bold text-lg md:text-xl transition-all duration-300 border-2 text-center leading-snug `;

                        if (step === 2) {
                            btnClass += `bg-white border-slate-200 text-slate-700 md:hover:bg-slate-50 active:scale-95 cursor-pointer`;
                        } else {
                            if (opt.isCorrect) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm";
                            else if (selectedOption === opt) btnClass += "bg-rose-50 border-rose-500 text-rose-800 shadow-sm";
                            else btnClass += "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                            btnClass += " cursor-default";
                        }

                        actionButtonsHTML += `<button ${step === 3 ? 'disabled' : ''} onclick="App.handleErrorOptionClick('${sectionId}', ${idx}, ${optIdx})" class="${btnClass}">${opt.text}</button>`;
                    });
                    actionButtonsHTML += `</div></div></div></div>`;
                }

                return `
                    <div id="${sectionId}-q-${idx}" class="bg-white rounded-2xl p-5 md:p-6 shadow-sm border border-slate-200 mb-8 relative transition-colors duration-300 flex flex-col justify-start ${ringClass}">
                        <div class="bg-slate-50 p-4 md:p-6 rounded-xl border border-slate-100 mb-6 w-full mx-auto">
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-${theme}-600 font-bold text-lg md:text-xl">السؤال ${toArabicNum(idx + 1)}</span>
                                <button onclick="App.toggleHint('${sectionId}', ${idx})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-lg md:text-xl font-bold transition-all active:scale-95 text-amber-500 md:hover:bg-amber-50">💡 تلميح</button>
                            </div>
                            
                            ${q.context ? `
                            <div class="flex justify-center mb-6 mt-2">
                                <span class="inline-block bg-slate-100 border border-slate-200 text-slate-700 px-6 py-3 rounded-2xl text-lg md:text-xl font-extrabold text-center shadow-sm tracking-wide">(${q.context})</span>
                            </div>
                            ` : ''}
                            
                            <div id="hint-area-${sectionId}-${idx}" class="w-full">
                                <div class="${showHint ? `block w-full overflow-hidden ${qState.hintAnimate ? 'smooth-expand' : ''}` : 'hidden'}">
                                    <div class="mt-2 bg-amber-50 text-amber-900 p-4 rounded-xl text-xl font-medium border border-amber-200 flex gap-2 items-start text-right">
                                        <span class="text-amber-500 font-semibold mt-1 shrink-0">💡</span><span class="leading-relaxed">${q.hint}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="words-area-${sectionId}-${idx}" class="flex flex-wrap justify-center items-center gap-3 md:gap-4 leading-loose mx-auto w-full max-w-2xl mb-2">
                            ${wordsHTML}
                        </div>

                        <div id="options-area-${sectionId}-${idx}" class="w-full">
                            ${actionButtonsHTML}
                        </div>

                        <div id="answer-area-${sectionId}-${idx}" class="w-full">
                            <div class="${isStep3 ? `block w-full overflow-hidden ${answerFadeClass}` : 'hidden'} shrink-0">
                                <div class="mt-4 p-4 rounded-xl text-right border ${isSelectedCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'} shadow-sm">
                                     <div class="flex items-center justify-start gap-2 mb-3 font-bold text-xl md:text-2xl ${isSelectedCorrect ? 'text-emerald-700' : 'text-rose-700'}">
                                        ${isSelectedCorrect ? `<span class="text-emerald-700">${ICONS.checkCircleLarge}</span>` : `<span class="text-rose-700">${ICONS.xCircleLarge}</span>`}
                                        <span>${isSelectedCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}</span>
                                    </div>
                                    <div class="text-lg md:text-xl font-semibold leading-relaxed ${isSelectedCorrect ? 'text-emerald-800' : 'text-rose-800'}">${q.explanation}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            updateErrorCardPartial(sectionId, qIndex, qState, theme) {
                const newHTML = this.renderErrorCard(qState, qIndex, theme, sectionId);
                const mainCard = document.getElementById(`${sectionId}-q-${qIndex}`);
                
                if (!mainCard) {
                    document.getElementById(`${sectionId}-wrapper-${qIndex}`).innerHTML = newHTML;
                    return;
                }

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = newHTML;
                
                const areas = ['hint-area', 'words-area', 'options-area', 'answer-area'];
                areas.forEach(area => {
                    const oldEl = document.getElementById(`${area}-${sectionId}-${qIndex}`);
                    const newEl = tempDiv.querySelector(`#${area}-${sectionId}-${qIndex}`);
                    if (oldEl && newEl) {
                        oldEl.innerHTML = newEl.innerHTML;
                        oldEl.className = newEl.className;
                    }
                });
                
                mainCard.className = tempDiv.firstElementChild.className;
            },

            renderStandardSection(sectionData) {
                const sectionId = sectionData.id; const progress = this.state.progress[sectionId]; const isComplete = progress.total > 0 && progress.answered === progress.total; const questions = this.state.sectionData[sectionId];
                let html = '<div class="fade-in">';
                if (sectionData.description) { html += `<div class="text-center mb-8"><p class="text-lg md:text-xl text-${sectionData.theme}-800 font-semibold bg-${sectionData.theme}-50 bg-opacity-60 p-4 md:p-5 rounded-2xl shadow-sm inline-block w-full">${sectionData.description}</p></div>`; }
                questions.forEach((qState, idx) => { html += `<div id="${sectionId}-wrapper-${idx}">${sectionData.type === 'spotting' ? this.renderSpottingCard(qState, idx, sectionData.theme, sectionId) : this.renderQuestionCard(qState, idx, sectionId, sectionData.theme, sectionData.type)}</div>`; });
                html += `</div>`; 
                html += `<div id="section-result-area-${sectionId}">`;
                if (isComplete) { html += `<div class="mt-12 p-8 md:p-10 bg-white border-2 border-${sectionData.theme}-200 rounded-2xl shadow-sm text-center max-w-2xl mx-auto w-full smooth-expand"><h3 class="text-2xl md:text-3xl font-semibold text-slate-700 mb-6">نتيجتك في قسم (${sectionData.title})</h3><div class="text-4xl md:text-5xl font-bold text-${sectionData.theme}-600 flex items-center justify-center gap-3"><span>${toArabicNum(progress.score)}</span><span class="text-2xl md:text-3xl text-slate-400 font-medium mt-1">من</span><span>${toArabicNum(progress.total)}</span></div></div>`; }
                html += `</div>`;
                html += `<div id="section-footer-area-${sectionId}" class="w-full">`;
                html += this.renderSectionFooterControls(sectionId, isComplete); 
                html += `</div>`;
                return html;
            },

            renderQuestionCard(qState, idx, sectionId, theme, type) {
                const { originalQuestion: q, options, answered, selectedOption, showHint } = qState;
                const isSelectedCorrect = selectedOption && selectedOption.isCorrect;
                const hintFadeClass = qState.hintAnimate ? 'smooth-expand' : '';
                const answerFadeClass = qState.answerAnimate ? 'smooth-expand' : '';
                let ringClass = answered ? (isSelectedCorrect ? 'ring-2 ring-emerald-400' : 'ring-2 ring-rose-400') : '';
                let optionsHTML = '';
                options.forEach((opt, optIdx) => {
                    let btnClass = `w-full p-4 md:p-5 rounded-xl border-2 transition-all font-semibold text-xl md:text-2xl flex items-center gap-3 justify-start `;
                    if (!answered) { btnClass += `border-slate-200 bg-white text-slate-600 active:scale-95 md:hover:bg-slate-50 cursor-pointer`; } else {
                        if (opt.isCorrect) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm";
                        else if (selectedOption === opt) btnClass += "bg-rose-50 border-rose-500 text-rose-800 shadow-sm";
                        else btnClass += "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                        btnClass += " cursor-default";
                    }
                    let numClass = `w-8 h-8 md:w-10 md:h-10 flex items-center justify-center rounded-full text-xl md:text-2xl font-bold shrink-0 transition-all `;
                    if (answered) { numClass += opt.isCorrect ? 'bg-emerald-500 text-white shadow-sm' : (selectedOption === opt ? 'bg-rose-500 text-white shadow-sm' : 'bg-slate-100 text-slate-400 border border-slate-200'); } 
                    else { numClass += `bg-white text-${theme}-600 shadow-md border border-slate-100`; }
                    let numberingHTML = `<div class="${numClass}">${toArabicNum(optIdx + 1)}</div>`;
                    optionsHTML += `<button ${answered ? 'disabled' : ''} onclick="App.handleAnswer('${sectionId}', ${idx}, ${optIdx})" class="${btnClass}">${numberingHTML}<span class="relative z-10 flex-grow text-right">${opt.text}</span>${answered && opt.isCorrect ? ICONS.checkCircle : ''}${answered && selectedOption === opt && !opt.isCorrect ? ICONS.xCircle : ''}</button>`;
                });

                return `
                    <div id="${sectionId}-q-${idx}" class="bg-white rounded-2xl p-5 md:p-6 shadow-sm border border-slate-200 mb-8 relative transition-colors duration-300 flex flex-col justify-start ${ringClass}">
                        <div class="bg-slate-50 p-4 md:p-6 rounded-xl border border-slate-100 mb-6 w-full mx-auto">
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-${theme}-600 font-bold text-lg md:text-xl">السؤال ${toArabicNum(idx + 1)}</span>
                                <button onclick="App.toggleHint('${sectionId}', ${idx})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-lg md:text-xl font-bold transition-all active:scale-95 text-amber-500 md:hover:bg-amber-50">💡 تلميح</button>
                            </div>
                            <h3 class="text-2xl md:text-3xl font-semibold text-slate-800 leading-snug whitespace-pre-line text-right">${q.text}</h3>
                            <div id="hint-area-${sectionId}-${idx}" class="w-full">
                                <div class="${showHint ? `block w-full overflow-hidden ${hintFadeClass}` : 'hidden'}">
                                    <div class="mt-2 bg-amber-50 text-amber-900 p-4 rounded-xl text-xl font-medium border border-amber-200 flex gap-2 items-start text-right">
                                        <span class="text-amber-500 font-semibold mt-1 shrink-0">💡</span><span class="leading-relaxed">${q.hint}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

            renderSort(sectionData) {

            // ================= دوال التفاعل (Event Handlers) =================

            toggleHint(sectionId, idx) {
                const sectionDef = APP_DATA.sections.find(s => s.id === sectionId);
                if (sectionDef.id === 'intro') return;

                let qState;
                if (sectionDef.type === 'classify' || sectionDef.type === 'sort') {
                    qState = this.state.sectionData[sectionId].questions[idx]; 
                } else {
                    qState = this.state.sectionData[sectionId][idx]; 
                }

                qState.showHint = !qState.showHint; 
                qState.hintAnimate = qState.showHint; 

                if (sectionDef.type === 'classify' || sectionDef.type === 'sort') {
                    const hintArea = document.getElementById(`hint-area-${sectionId}-${idx}`);
                    if (hintArea) {
                        if (qState.showHint) {
                            hintArea.className = 'block w-full smooth-expand';
                        } else {
                            hintArea.className = 'hidden';
                        }
                    }
                } 
                else if (sectionDef.type === 'error_correction') {
                    this.updateErrorCardPartial(sectionId, idx, qState, sectionDef.theme);
                } 
                else {
                    this.updateStandardCardPartial(sectionId, idx, qState, sectionDef.theme, sectionDef.type);
                }
                
                qState.hintAnimate = false;
            },

            handleAnswer(sectionId, qIndex, optIndex) {
                const qState = this.state.sectionData[sectionId][qIndex]; if (qState.answered) return;
                const selectedOption = qState.options[optIndex]; qState.answered = true; qState.selectedOption = selectedOption; qState.answerAnimate = true; 
                this.recordProgress(sectionId, selectedOption.isCorrect);
                const progress = this.state.progress[sectionId];
                const sectionDef = APP_DATA.sections.find(s => s.id === sectionId);
                
                this.updateStandardCardPartial(sectionId, qIndex, qState, sectionDef.theme, sectionDef.type); 
                this.updateTabs(); 
                if (progress.answered === progress.total) { 
                    this.showSectionResult(sectionId, sectionDef, progress);
                } 
                this.checkFinalEvaluation(); 
                qState.answerAnimate = false; 
            },

            handleSpottingClick(sectionId, qIndex, wIndex) {
                const qState = this.state.sectionData[sectionId][qIndex]; if (qState.answered) return;
                qState.answered = true; qState.selectedIndex = wIndex; qState.answerAnimate = true; 
                const isCorrect = wIndex === qState.originalQuestion.correctIndex; this.recordProgress(sectionId, isCorrect);
                const progress = this.state.progress[sectionId];
                const sectionDef = APP_DATA.sections.find(s => s.id === sectionId);
                
                this.updateStandardCardPartial(sectionId, qIndex, qState, sectionDef.theme, sectionDef.type); 
                this.updateTabs(); 
                if (progress.answered === progress.total) { 
                    this.showSectionResult(sectionId, sectionDef, progress);
                } 
                this.checkFinalEvaluation(); 
                qState.answerAnimate = false; 
            },

            handleErrorWordClick(sectionId, qIndex, wIndex) {
                const qState = this.state.sectionData[sectionId][qIndex]; if (qState.step !== 1) return;
                const isCorrectError = wIndex === qState.errorWordIndex;
                const sectionDef = APP_DATA.sections.find(s => s.id === sectionId);
                
                if (isCorrectError) {
                    qState.selectedWordIndex = wIndex; qState.step = 2; qState.shakeWordIndex = null;
                    qState.optionsAnimate = true; 
                    this.updateErrorCardPartial(sectionId, qIndex, qState, sectionDef.theme);
                    qState.optionsAnimate = false; 
                } else {
                    qState.shakeWordIndex = wIndex;
                    this.updateErrorCardPartial(sectionId, qIndex, qState, sectionDef.theme);
                    
                    setTimeout(() => { 
                        if (this.state.sectionData[sectionId][qIndex]) { 
                            this.state.sectionData[sectionId][qIndex].shakeWordIndex = null; 
                            this.updateErrorCardPartial(sectionId, qIndex, qState, sectionDef.theme);
                        } 
                    }, 500);
                }
            },

            handleErrorOptionClick(sectionId, qIndex, optIndex) {
                const qState = this.state.sectionData[sectionId][qIndex]; if (qState.step !== 2) return;
                const selectedOption = qState.options[optIndex]; qState.step = 3; qState.selectedOption = selectedOption; qState.answerAnimate = true;
                this.recordProgress(sectionId, selectedOption.isCorrect);
                const progress = this.state.progress[sectionId];
                const sectionDef = APP_DATA.sections.find(s => s.id === sectionId);
                
                this.updateErrorCardPartial(sectionId, qIndex, qState, sectionDef.theme);
                this.updateTabs(); 
                if (progress.answered === progress.total) { 
                    this.showSectionResult(sectionId, sectionDef, progress);
                } 
                this.checkFinalEvaluation(); 
                
                qState.answerAnimate = false;
            },

            handleClassifyClick(sectionId, categoryId) {
                const state = this.state.sectionData[sectionId]; if (state.status === 'correct' || state.animatingOut) return;
                const currentQState = state.questions[state.currentIndex]; const currentQ = currentQState.originalQuestion; const isCorrect = categoryId === currentQ.categoryId;
                if (isCorrect) { 
                    const isFirstAttempt = state.status === 'idle'; this.state.progress[sectionId].answered++; if (isFirstAttempt) this.state.progress[sectionId].score++; 
                    state.status = 'correct'; state.animatingOut = true; this.updateUI(); 
                    setTimeout(() => { state.placedItems[categoryId].push(currentQ); state.currentIndex++; state.status = 'idle'; state.animatingOut = false; this.updateUI(); }, 400); 
                } else { state.status = 'incorrect'; this.updateUI(); }
            },

            handleDynamicSortClick(sectionId, optIndex) {
                const state = this.state.sectionData[sectionId]; if (state.status === 'correct' || state.animatingOut) return;
                const currentQState = state.questions[state.currentIndex]; const isCorrect = currentQState.options[optIndex].isCorrect;
                if (isCorrect) {
                    const isFirstAttempt = state.status === 'idle'; this.state.progress[sectionId].answered++; if (isFirstAttempt) { this.state.progress[sectionId].score++; }
                    state.status = 'correct'; state.animatingOut = true; this.updateUI();
                    setTimeout(() => { state.currentIndex++; state.status = 'idle'; state.animatingOut = false; this.updateUI(); }, 400); 
                } else { state.status = 'incorrect'; this.updateUI(); }
            },

            recordProgress(sectionId, isCorrect) {
                this.state.progress[sectionId].answered++; if (isCorrect) this.state.progress[sectionId].score++;
            },

            scrollToContent() {
                requestAnimationFrame(() => { setTimeout(() => { const target = document.getElementById('scroll-target'); if (target) { const stickyTabs = document.getElementById('sticky-tabs-container'); const headerOffset = stickyTabs ? stickyTabs.offsetHeight : 80; const elementPosition = target.getBoundingClientRect().top; const offsetPosition = elementPosition + window.pageYOffset - headerOffset; window.scrollTo({ top: offsetPosition, behavior: 'smooth' }); } }, 30); });
            },

            scrollTabIntoView(tabId) {
                requestAnimationFrame(() => { setTimeout(() => { const tabBtn = document.getElementById(`tab-${tabId}`); const container = document.getElementById('tabs-container'); if (tabBtn && container) { const containerRect = container.getBoundingClientRect(); const btnRect = tabBtn.getBoundingClientRect(); if (tabId === APP_DATA.sections[0].id) { const scrollDelta = (btnRect.right - containerRect.right) + 16; container.scrollBy({ left: scrollDelta, behavior: 'smooth' }); } else { const scrollDelta = (btnRect.left + btnRect.width / 2) - (containerRect.left + containerRect.width / 2); container.scrollBy({ left: scrollDelta, behavior: 'smooth' }); } } }, 30); });
            },

            handleTabChange(tabId) { this.state.activeTab = tabId; this.updateUI(); this.scrollToContent(); this.scrollTabIntoView(tabId); },
            handleNextSection() { const currentIndex = APP_DATA.sections.findIndex(s => s.id === this.state.activeTab); if (currentIndex < APP_DATA.sections.length - 1) { this.handleTabChange(APP_DATA.sections[currentIndex + 1].id); } },

            handleResetSection(sectionId) {
                const secDef = APP_DATA.sections.find(s => s.id === sectionId);
                this.state.progress[sectionId].answered = 0; this.state.progress[sectionId].score = 0;
                
                if (secDef.type === 'mcq' || secDef.type === 'true_false' || secDef.type === 'spotting') {
                    let newData = secDef.questions.map(q => {
                        let options = [];
                        if (secDef.type === 'mcq') {
                            options = q.options.map((opt, oIdx) => ({ text: opt, isCorrect: oIdx === q.correct }));
                            options = shuffleArray(options);
                        } else if (secDef.type === 'true_false') {
                            options = [ { text: "صواب", isCorrect: true === q.answer }, { text: "خطأ", isCorrect: false === q.answer } ];
                            options = shuffleArray(options);
                        }
                        return { originalQuestion: q, options, answered: false, selectedOption: null, selectedIndex: null, showHint: false };
                    });
                    this.state.sectionData[sectionId] = newData;
                } else if (secDef.type === 'error_correction' && secDef.id === 'fill') {
                    let newData = secDef.questions.map(q => {
                        let parts = q.text.split('*');
                        let words = [];
                        let errorWordIndex = -1;
                        if (parts.length >= 3) {
                            let beforeWords = parts[0].split(' ').filter(w => w.trim() !== '');
                            let errorWord = parts[1];
                            let afterWords = parts[2].split(' ').filter(w => w.trim() !== '');
                            words = [...beforeWords, errorWord, ...afterWords];
                            errorWordIndex = beforeWords.length;
                        } else {
                            words = q.text.split(' ').filter(w => w.trim() !== '');
                        }
                        
                        let rawText = q.text;
                        let contextText = '';
                        const match = rawText.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
                        if (match) {
                            contextText = `(${match[2]})`;
                        }

                        let finalOptions = [
                            { text: q.correctWord, isCorrect: true },
                            { text: q.wrongOptions[0], isCorrect: false },
                            { text: q.wrongOptions[1], isCorrect: false }
                        ];
                        return { originalQuestion: q, contextText: contextText, words: words, errorWordIndex: errorWordIndex, options: shuffleArray(finalOptions), step: 1, selectedWordIndex: null, selectedOption: null, showHint: false, shakeWordIndex: null, optionsAnimate: false };
                    });
                    this.state.sectionData[sectionId] = newData;
                } else if (secDef.type === 'classify') {
                    let placedItems = {}; secDef.categories.forEach(c => placedItems[c.id] = []);
                    this.state.sectionData[sectionId] = { questions: shuffleArray(secDef.questions).map(q => ({ originalQuestion: q, showHint: false })), currentIndex: 0, status: 'idle', placedItems: placedItems, animatingOut: false };
                } else if (secDef.type === 'sort') {
                    this.state.sectionData[sectionId] = { questions: secDef.questions.map(q => { let opts = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct })); return { originalQuestion: q, options: shuffleArray(opts), showHint: false }; }), currentIndex: 0, status: 'idle', animatingOut: false };
                }
                
                this.updateUI(); this.scrollToContent();
            },

            handleGlobalRestart() {
                this.initSectionData(); if (APP_DATA.sections.length > 0) this.state.activeTab = APP_DATA.sections[0].id;
                this.updateUI(); this.scrollTabIntoView(this.state.activeTab);
                requestAnimationFrame(() => { const header = document.getElementById('main-header'); const targetTop = header ? header.offsetHeight : 80; window.scrollTo({ top: targetTop, behavior: 'smooth' }); });
            },

            checkFinalEvaluation() {
                const scorableSections = APP_DATA.sections.filter(s => s.type !== 'intro');
                if (scorableSections.length === 0) return;

                const isAllComplete = scorableSections.every(s => { const p = this.state.progress[s.id]; return p && p.total > 0 && p.answered === p.total; });
                const container = document.getElementById('final-evaluation-container'); const activeSecDef = APP_DATA.sections.find(s => s.id === this.state.activeTab);
                
                if (isAllComplete && activeSecDef.type !== 'intro') {
                    let totalScore = 0, totalQuestions = 0;
                    scorableSections.forEach(s => { totalScore += this.state.progress[s.id].score; totalQuestions += this.state.progress[s.id].total; });

                    const percentage = Math.round((totalScore / totalQuestions) * 100);
                    let message = "", color = "";
                    if (percentage < 60) { message = "تحتاج إلى مزيد من التدريب، لا تيأس وحاول مرة أخرى!"; color = "text-rose-600"; }
                    else if (percentage < 85) { message = "أداء رائع! مستواك جيد جدًا."; color = "text-violet-600"; }
                    else { message = "أداء استثنائي! أنت بطل حقيقي وخبير في هذا الدرس."; color = "text-emerald-600"; }

                    container.innerHTML = `
                        <div id="final-eval-box" class="mt-12 bg-white p-8 md:p-12 rounded-3xl shadow-lg border-2 border-amber-200 text-center smooth-expand">
                            ${ICONS.medal}
                            <h2 class="text-3xl md:text-4xl font-bold text-slate-700 mb-6">التقييم النهائي</h2>
                            <div class="text-6xl md:text-7xl font-bold mb-8 text-slate-700 flex items-center justify-center gap-4">
                                <span class="${color}">${toArabicNum(totalScore)}</span>
                                <span class="text-slate-400 text-3xl md:text-4xl font-medium mt-2">من</span>
                                <span class="text-slate-500">${toArabicNum(totalQuestions)}</span>
                            </div>
                            <div class="inline-block bg-amber-100 text-amber-800 px-6 py-2 rounded-full font-semibold text-xl md:text-2xl mb-6">النسبة المئوية: ${toArabicNum(percentage)}%</div>
                            <p class="text-xl md:text-2xl font-semibold leading-relaxed ${color} mb-10">${message}</p>
                            <button onclick="App.handleGlobalRestart()" class="px-8 md:px-10 py-3 md:py-4 rounded-full font-semibold text-xl md:text-2xl text-white bg-slate-700 md:hover:bg-slate-800 shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-3 mx-auto">${ICONS.refresh} ابدأ من جديد</button>
                        </div>
                    `;
                } else { container.innerHTML = ''; }
            }
        };

        // تشغيل التطبيق فور تحميل المستند
        document.addEventListener('DOMContentLoaded', () => {
            try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; window.scrollTo(0, 0); } catch (error) { console.warn("تم تجاهل ضبط التمرير.", error); }
            App.init();
        });

    </script>
</body>
</html>
