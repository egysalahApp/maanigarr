<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العربية السهلة - معاني حروف الجر</title>
    <!-- Google Fonts: Readex Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Readex Pro"', 'sans-serif'] },
                    colors: {
                        pastel: {
                            bg: '#F8FAFC',
                            card: '#FFFFFF',
                            primary: '#E0F2FE',
                            primaryDark: '#0284C7',
                            success: '#D1FAE5',
                            successDark: '#059669',
                            danger: '#FEE2E2',
                            dangerDark: '#DC2626',
                            warning: '#FEF3C7',
                            warningDark: '#D97706',
                        }
                    },
                    animation: { 'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both' },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* إخفاء شريط التمرير بقوة إجبارية لجميع المتصفحات */
        .no-scrollbar::-webkit-scrollbar { 
            display: none !important; 
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }
        .no-scrollbar { 
            -ms-overflow-style: none !important; 
            scrollbar-width: none !important; 
        }

        .grid-expand { display: grid; transition: grid-template-rows 0.4s ease-out, opacity 0.4s ease-out; }
        .grid-0 { grid-template-rows: 0fr; opacity: 0; pointer-events: none; }
        .grid-1 { grid-template-rows: 1fr; opacity: 1; pointer-events: auto; }
        .overflow-hidden-inner { overflow: hidden; }
        main { scroll-margin-top: 5rem; }
    </style>
</head>
<body class="bg-pastel-bg text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-200">

    <!-- Header (غير مثبت) -->
    <header id="page-header" class="w-full bg-pastel-bg">
        <div class="max-w-3xl mx-auto pt-6 pb-4 text-center px-4">
            <h1 class="flex items-center justify-center">
                <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 hover:opacity-80 transition-opacity outline-none">
                    <span class="text-3xl font-bold text-slate-900">العربية السهلة</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#FF0000" class="w-8 h-8 flex-shrink-0">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </a>
            </h1>
            <p class="text-xl font-bold text-slate-500 mt-2">محمود صلاح</p>
        </div>
    </header>

    <!-- Tabs Container (Sticky) -->
    <div id="tabs-wrapper" class="sticky top-0 z-50 w-full bg-pastel-bg/95 backdrop-blur shadow-sm border-b border-slate-200">
        <div class="relative w-full max-w-3xl mx-auto pt-1">
            <div id="tabs-container" class="flex overflow-x-auto no-scrollbar mx-auto w-full px-2 py-1 gap-1.5 md:gap-2 items-center"></div>
            <!-- Progress Bar - يبدأ من اليمين -->
            <div class="absolute bottom-0 right-0 h-1.5 bg-pastel-primaryDark transition-all duration-500 ease-out w-0 origin-right" id="progress-bar"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="flex-grow w-full max-w-3xl mx-auto p-4 md:p-6 flex flex-col pb-8"></main>

    <!-- حاوية النتيجة النهائية -->
    <div class="w-full max-w-3xl mx-auto px-4 md:px-6 pb-12">
        <div id="global-res-wrapper" class="grid-expand grid-0 w-full max-w-lg mx-auto">
            <div class="overflow-hidden-inner">
                <div class="bg-gradient-to-br from-pastel-primaryDark to-blue-900 text-white p-8 rounded-2xl text-center shadow-xl mt-6">
                    <div class="text-7xl mb-4">🎓</div>
                    <h2 id="global-final-title" class="text-3xl md:text-4xl font-bold mb-4">أكملت جميع التحديات!</h2>
                    <p class="text-xl md:text-2xl text-blue-100 mb-8">حصيلتك الإجمالية: <span id="global-final-score" class="font-bold text-white text-3xl md:text-4xl">٠ / ٠</span></p>
                    <button onclick="startOver()" class="w-full bg-white text-blue-900 py-4 rounded-xl font-bold text-xl md:text-2xl hover:bg-slate-50 transition-colors shadow-md outline-none">ابدأ من جديدٍ</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-6 text-center border-t border-slate-200">
        <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" class="text-base text-slate-400 font-medium text-center block py-2 hover:text-slate-600 transition-colors outline-none">جميع الحقوق محفوظة لقناة العربية السهلة</a>
    </footer>

    <script>
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }

        const toArabicNum = (num) => String(num).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

        const appData = {
            sections: [
                { id: 'intro', title: 'مقدمة', type: 'info' },
                {
                    id: 'fill',
                    title: 'الكلمة المفقودة',
                    type: 'mcq',
                    description: 'اختر حرف الجر المناسب لملء الفراغِ ليعطي المعنى المطلوب بدقةٍ.',
                    questions: [
                        { id: 'f1', text: 'خاتمُ المعلمِ مصنوعٌ [ ... ] فضةٍ. <br><span class="text-lg md:text-xl text-slate-500">(بيان النوع)</span>', options: ['مِنْ', 'فِي', 'بـِ'], correct: 0, hint: 'نحتاج حرفًا يبين المادة الخام.', explanation: '(مِنْ) تستخدم لبيان النوع والمادة المصنوع منها الشيء.' },
                        { id: 'f2', text: 'السفرُ أحبُّ [ ... ] من البقاءِ. <br><span class="text-lg md:text-xl text-slate-500">(معنى عندي)</span>', options: ['إلَيَّ', 'عَلَيَّ', 'فِيَّ'], correct: 0, hint: 'نحتاج حرفًا يفيد معنى (عند) أو القرب النفسي.', explanation: '(إلَى) تستخدم أحيانًا بمعنى (عند).' },
                        { id: 'f3', text: 'أخذتُ هذا الخبر اليقين [ ... ] صديقي.', options: ['عَنْ', 'فِي', 'مِنْ'], correct: 0, hint: 'هذا الحرف يدل على الأصل والمصدر الذي صدر منه الخبر.', explanation: '(عَنْ) تُستخدم لتدل على مصدر الشيء وأصله.' },
                        { id: 'f4', text: 'فاق صالحٌ أقرانه بالدراسة [ ... ] صغر سنه.', options: ['عَلَى', 'مِنْ', 'البَاء'], correct: 0, hint: 'نحتاج حرفًا يفيد تجاوز العائق (بالرغم من).', explanation: '(عَلَى) تأتي أحيانًا لتفيد معنى (الرغم).' },
                        { id: 'f5', text: 'غادرت بعثتنا الرياضية المدينة [ ... ] مهمةٍ وطنيةٍ.', options: ['فِي', 'لِـ', 'إلَى'], correct: 0, hint: 'الحرف هنا يدل على الهدف الذي تم من أجله السفر.', explanation: '(فِي) تأتي للدلالة على الغرض الذي تم من أجله الفعل.' },
                        { id: 'f6', text: 'استمعتُ لشرح الأستاذ [ ... ] انتباهٍ شديدٍ.', options: ['بـِ', 'فِي', 'كـَ'], correct: 0, hint: 'نحتاج حرفًا يصف هيئة المستمع (أي: استمعتُ مُنتبَهًا).', explanation: '(الباء) هنا دخلت لتفيد وصف الحال.' },
                        { id: 'f7', text: 'أحب الفواكه الصيفية [ ... ] العنب والبطيخ.', options: ['كـَ', 'لِـ', 'بـِ'], correct: 0, hint: 'نحتاج حرفًا نستخدمه لتقديم أمثلةٍ توضيحيةٍ.', explanation: '(الكاف) تُستخدم لضرب الأمثلة والتفصيل.' },
                        { id: 'f8', text: 'أنفقتُ [ ... ] مالي في مساعدة الفقراءِ.', options: ['مِنْ', 'فِي', 'البَاء'], correct: 0, hint: 'المال المنفق هو (جزءٌ) فقط من إجمالي المال.', explanation: '(مِنْ) تُستخدم للدلالة على التبعيض.' },
                        { id: 'f9', text: 'تحدثنا طويلًا [ ... ] أهمية الوقتِ.', options: ['عَنْ', 'فِي', 'مِنْ'], correct: 0, hint: 'هذا الحرف يدل على المحور الذي دار حوله النقاش.', explanation: '(عَنْ) تُستخدم لتدل على موضوع الحديث.' },
                        { id: 'f10', text: 'ينقسم الاسم [ ... ] نكرة ومعرفة.', options: ['إلَى', 'اللَّام', 'فِي'], correct: 0, hint: 'نحتاج حرفًا يجزئ الشيء لمكوناته.', explanation: '(إلَى) تستخدم للتفصيل والتقسيم.' }
                    ]
                },
                {
                    id: 'sort',
                    title: 'فرز البطاقات',
                    type: 'sort',
                    description: 'اسحب البطاقة أو انقر على الصندوق المناسب للمعنى الذي يؤديه الحرف الملون.',
                    items: [
                        { id: 'srt1', text: 'شرعت في العمل <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">من</span> الأسبوع الماضي', options: ['زمان الابتداء', 'التبعيض', 'بيان النوع'], correct: 0, hint: 'الحرف يحدد متى بدأ زمن الفعل.', explanation: '(مِنْ) هنا حددت نقطة انطلاق الزمن.' },
                        { id: 'srt2', text: 'وصلت <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">إلى</span> المدرسة باكرًا', options: ['النهاية في المكان', 'النهاية في الزمان', 'معنى القرب'], correct: 0, hint: 'المدرسة هي محطة (الوصول) الأخيرة للحركة.', explanation: '(إلى) تفيد النهاية في المكان، التركيز هنا على النهاية والوصول.' },
                        { id: 'srt3', text: 'شرّبت الأم ولدها الدواء <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">على</span> أنه ماء', options: ['الاستعلاء المكان', 'معنى الوهم', 'الشرط'], correct: 1, hint: 'الأم صورت الدواء بشيءٍ غير حقيقيٍ لتشجع ابنها.', explanation: '(عَلَى) هنا صورت شيئًا متوهمًا غير حقيقيٍ.' },
                        { id: 'srt12', text: '<span class="text-pastel-primaryDark font-black">بـ</span>سم الله الرحمن الرحيم', options: ['السبب والعلة', 'الوسيلة (الاستعانة)', 'القسم واليمين'], correct: 1, hint: 'الباء هنا للطلب والاستعانة باسم الله لإنجاز العمل.', explanation: 'الباء هنا معنوية وتفيد الاستعانة أو الوسيلة.' },
                        { id: 'srt13', text: 'فرح محمد <span class="text-pastel-primaryDark font-black">بـ</span>قدوم أخيه', options: ['الوسيلة', 'التعويض والثمن', 'السبب والعلة'], correct: 2, hint: 'القدوم هو الدافع والعلة وراء شعور الفرح.', explanation: 'الباء هنا سببية، أي (بسبب) قدوم أخيه.' },
                        { id: 'srt6', text: 'اشتريت هذا الكتاب القيم <span class="text-pastel-primaryDark font-black">بـ</span>دينارٍ', options: ['التعويض والثمن', 'الوسيلة (معنوي)', 'الآلة (مادي)'], correct: 0, hint: 'تمت مبادلة الكتاب بمبلغٍ ماديٍ.', explanation: 'الباء تدخل على الثمن لتفيد التعويض.' },
                        { id: 'srt4', text: 'جلسنا <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">على</span> المائدة لنتناول الطعام', options: ['الاستعلاء المكان', 'القرب من الشيء', 'الشرط'], correct: 1, hint: 'نحن نجلس بجوار المائدة وقربها لا فوقها.', explanation: '(على) تأتي أحيانًا بمعنى (عند) أو القرب.' }
                    ]
                },
                {
                    id: 'mcq2',
                    title: 'أسرار المعاني',
                    type: 'mcq',
                    description: 'تحديات لغوية دقيقة تختبر فهمك العميق لأسرار حروف الجر.',
                    questions: [
                        { id: 'm1', text: 'ما معنى اللام في: "اللهمَّ اغفر لـنا ولوالدينا"؟', options: ['الدعاء بالخير', 'الملكية', 'التعليل'], correct: 0, hint: 'طلب الخير لشخصٍ ما.', explanation: 'اللام تستخدم للدعاء بالخير.' },
                        { id: 'm2', text: 'ما معنى (على) في: "دعا المظلومُ على مَن ظلمَهُ"؟', options: ['الدعاء بالشر', 'الاستعلاء', 'الرغم'], correct: 0, hint: 'طلب السوء لشخصٍ ما.', explanation: '(على) تستخدم للدعاء بالشر.' },
                        { id: 'm3', text: 'ماذا تفيد الباء في: "ليسَ النجاحُ بـمستحيلٍ"؟', options: ['تأكيد النفي', 'الوسيلة', 'السببية'], correct: 0, hint: 'جاءت لتقوية معنى النفي بـ (ليس).', explanation: 'الباء الزائدة تفيد تأكيد النفي.' },
                        { id: 'm4', text: 'ما دلالة (من) في: "ما جاءنا من بشيرٍ"؟', options: ['تأكيد النفي', 'التبعيض', 'بيان النوع'], correct: 0, hint: 'جاءت في جملةٍ منفيةٍ للتوكيد.', explanation: '(من) الزائدة تفيد تأكيد النفي.' },
                        { id: 'm5', text: 'ما معنى (في) في: "خرجَ القائدُ في جُندِهِ"؟', options: ['المعية (المصاحبة)', 'المكان', 'السبب'], correct: 0, hint: 'أي: خرج مع جنده.', explanation: '(فِي) تفيد المعية والمصاحبة.' },
                        { id: 'm6', text: 'ما معنى (عن) في: "لا تجزي نفسٌ عن نفسٍ شيئًا"؟', options: ['البدلية (العِوض)', 'البعد', 'الموضوع'], correct: 0, hint: 'أي: لا تقوم مقامها أو بدلًا منها.', explanation: '(عَنْ) تأتي بمعنى البدل.' },
                        { id: 'm7', text: 'ما معنى اللام في: "للأطفالِ أن يلعبوا في الساحةِ"؟', options: ['الإباحة (السماح)', 'الملكية', 'السببية'], correct: 0, hint: 'تعطي إذنًا بالقيام بالفعل.', explanation: 'اللام تفيد الإباحة والسماح.' },
                        { id: 'm8', text: 'ما معنى (على) في: "على المديونِ مائةُ دينارٍ"؟', options: ['الشيء المكروه (الدَّين)', 'الوجوب', 'الاستعلاء'], correct: 0, hint: 'تستخدم مع الديون والأعباء.', explanation: '(على) تفيد التحمل أو الدَّين.' }
                    ]
                },
                {
                    id: 'search',
                    title: 'البحث الدقيق',
                    type: 'mcq',
                    noShuffle: true,
                    description: 'التحدي الختامي: المقارنة بين المحسوس والمعنوي لترسيخ الفروق الدقيقة.',
                    questions: [
                        { id: 'p1a', text: 'هذه السيارةُ <span class="text-pastel-primaryDark font-black">لـ</span>جاري. اللام هنا تفيد:', options: ['الملكية المادية', 'الملكية المعنوية', 'التعليل'], correct: 0, hint: 'السيارة شيءٌ ماديٌّ ملموسٌ.', explanation: 'اللام للملكية المادية.' },
                        { id: 'p1b', text: '<span class="text-pastel-primaryDark font-black">لـ</span>لحريةِ ثمنٌ غالٍ. ماذا تفيد اللام هنا؟', options: ['الملكية المادية', 'الملكية المعنوية (الاختصاص)', 'السبب'], correct: 1, hint: 'ثمن الحرية قيمةٌ معنويةٌ.', explanation: 'اللام للملكية المعنوية أو الاختصاص.' },
                        { id: 'p2a', text: 'نظرتُ <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">إلى</span> البحرِ. "إلى" تفيد:', options: ['الاتجاه حسًّا', 'الاتجاه معنًى', 'الزمان'], correct: 0, hint: 'اتجاه النظر نحو البحر، وليس بالضرورة "انتهاء" شيء عند البحر.', explanation: '(إلى) تفيد الاتجاه (حسًّا)، وهو التوجّه نحو شيء ملموس دون التأكيد على الوصول.' },
                        { id: 'p2b', text: 'هدتني نصيحةُ المعلمِ <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">إلى</span> الصوابِ والنجاحِ. "إلى" تفيد:', options: ['الاتجاه حسًّا', 'الاتجاه معنًى', 'الزمان'], correct: 1, hint: 'الصواب طريقٌ فكريٌ وليس مكانيًّا.', explanation: '(إلى) تفيد الاتجاه معنًى (نحو شيء غير ملموس).' },
                        { id: 'p3a', text: 'رميتُ الكرةَ <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">عن</span> المنضدةِ. (عن) تفيد:', options: ['البعد حسًّا', 'البعد معنًى', 'الموضوع'], correct: 0, hint: 'الكرة والمنضدة أشياء مادية.', explanation: '(عن) تفيد البعد والفصل الحسي.' },
                        { id: 'p3b', text: 'ابتعدتُ <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">عن</span> الغيبةِ والنميمةِ. (عن) تفيد:', options: ['البعد حسًّا', 'البعد معنًى', 'المصدر'], correct: 1, hint: 'الغيبة والنميمة سلوكياتٌ معنويةٌ.', explanation: '(عن) تفيد البعد والفصل المعنوي.' },
                        { id: 'p4a', text: 'الكتابُ <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">على</span> المكتبِ. (على) تفيد:', options: ['الاستعلاء الحقيقي', 'القرب', 'الوجوب'], correct: 0, hint: 'الكتاب فوق المكتب ماديًّا.', explanation: '(على) تفيد الاستعلاء الحقيقي.' },
                        { id: 'p4b', text: 'جلستُ <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">على</span> النهرِ. (على) تفيد:', options: ['الاستعلاء الحقيقي', 'القرب', 'الوجوب'], correct: 1, hint: 'هل جلست فوق الماء أم بجوار النهر؟', explanation: '(على) هنا تفيد القرب (بمعنى عند).' }
                    ]
                }
            ]
        };

        let state = {
            mcq: { answers: {}, hints: {}, shuffled: {} },
            sort: { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false }
        };

        function scrollToTabs() {
            requestAnimationFrame(() => {
                const header = document.getElementById('page-header');
                const targetY = header ? header.offsetHeight : 0;
                window.scrollTo({ top: targetY, behavior: 'smooth' });
            });
        }

        function scrollToTop() {
            requestAnimationFrame(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function centerTabHorizontal(tabEl) {
            if (!tabEl) return;
            const container = document.getElementById('tabs-container');
            requestAnimationFrame(() => {
                const tabRect = tabEl.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                const diff = (tabRect.left + tabRect.width / 2) - (containerRect.left + containerRect.width / 2);
                container.scrollBy({ left: diff, behavior: 'smooth' });
            });
        }

        function initSectionShuffle(sectionId) {
            const section = appData.sections.find(s => s.id === sectionId);
            if (!section || section.type === 'info') return;
            if (section.type === 'mcq' && !state.mcq.shuffled[sectionId]) {
                state.mcq.shuffled[sectionId] = {};
                section.questions.forEach(q => {
                    const opts = q.options.map((text, i) => ({ text, originalIndex: i }));
                    state.mcq.shuffled[sectionId][q.id] = (section.noShuffle) ? opts : shuffleArray(opts);
                });
            }
            if (section.type === 'sort') {
                if (!state.sort.shuffledItems) state.sort.shuffledItems = shuffleArray(section.items);
                if (!state.sort.shuffledOptions) {
                    state.sort.shuffledOptions = {};
                    section.items.forEach(item => {
                        const opts = item.options.map((text, i) => ({ text, originalIndex: i }));
                        state.sort.shuffledOptions[item.id] = shuffleArray(opts);
                    });
                }
            }
        }

        function renderTabs(shouldCenter = false) {
            const container = document.getElementById('tabs-container');
            if (container.children.length === 0) {
                appData.sections.forEach((sec, idx) => {
                    const btn = document.createElement('button');
                    btn.id = `tab-btn-${sec.id}`;
                    btn.onclick = () => switchSection(idx, true);
                    // تصغير الخط قليلا والهوامش لتتسع جميع التبويبات بسهولة
                    btn.innerHTML = `<span class="whitespace-nowrap font-bold text-base md:text-lg">${sec.title}</span>` + 
                        (sec.type !== 'info' ? `<svg id="tab-check-${sec.id}" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-pastel-successDark transition-opacity duration-300 opacity-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>` : '');
                    container.appendChild(btn);
                });
            }
            appData.sections.forEach((sec, idx) => {
                const btn = document.getElementById(`tab-btn-${sec.id}`);
                const isActive = activeSectionIndex === idx;
                // هوامش أضيق قليلًا لضمان استيعاب كافة الأقسام
                btn.className = `flex-shrink-0 flex items-center gap-1.5 px-3 py-3 md:px-5 md:py-4 rounded-t-xl transition-colors font-bold relative outline-none ${isActive ? 'text-pastel-primaryDark bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]' : 'text-slate-500 hover:text-slate-700'}`;
                if (sec.type !== 'info') {
                    const isComp = checkSectionComplete(sec.id);
                    const check = document.getElementById(`tab-check-${sec.id}`);
                    if (check) { check.classList.toggle('opacity-100', isComp); check.classList.toggle('opacity-0', !isComp); }
                }
                if (isActive && shouldCenter) centerTabHorizontal(btn);
            });
            updateProgressBar();
        }

        function updateProgressBar() {
            const bar = document.getElementById('progress-bar');
            const sec = appData.sections[activeSectionIndex];
            let percent = (sec.type === 'info') ? 100 : (sec.type === 'mcq' ? (sec.questions.filter(q => state.mcq.answers[q.id] !== undefined).length / sec.questions.length) * 100 : (state.sort.currentItemIdx / sec.items.length) * 100);
            bar.style.width = `${percent}%`;
        }

        function switchSection(idx, shouldScroll = false) {
            activeSectionIndex = idx;
            initSectionShuffle(appData.sections[idx].id);
            
            // بناء الواجهة بدون توسيط فوري لتجنب حسابات خاطئة أثناء الـ Reflow
            renderTabs(false); 
            renderContent(); 
            updateFinalResultVisibility();
            
            // التوسيط الأفقي والتمرير العمودي بعد استقرار أبعاد الصفحة
            requestAnimationFrame(() => {
                setTimeout(() => {
                    if (shouldScroll) scrollToTabs();
                    const activeTab = document.getElementById(`tab-btn-${appData.sections[idx].id}`);
                    centerTabHorizontal(activeTab);
                }, 50);
            });
        }

        function checkSectionComplete(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if (!sec || sec.type === 'info') return false;
            return (sec.type === 'mcq') ? sec.questions.every(q => state.mcq.answers[q.id] !== undefined) : state.sort.currentItemIdx === sec.items.length;
        }

        function isAllComplete() { return appData.sections.filter(s => s.type !== 'info').every(s => checkSectionComplete(s.id)); }

        function calculateScore(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if (sec.type === 'mcq') return sec.questions.filter(q => state.mcq.answers[q.id] === q.correct).length;
            return sec.items.length;
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            const sec = appData.sections[activeSectionIndex];
            let html = `<div class="text-center mb-6 pt-4"><h2 class="text-4xl md:text-5xl font-bold text-slate-800 mb-2">معاني حروف الجر</h2>${sec.description ? `<p class="text-xl text-slate-600 leading-snug max-w-2xl mx-auto px-2">${sec.description}</p>` : ''}</div>`;
            
            if (sec.type === 'info') html += renderInfoSection();
            else if (sec.type === 'sort') html += renderSortGame(sec);
            else html += renderMCQGame(sec);
            
            if (sec.type !== 'info') {
                const isComplete = checkSectionComplete(sec.id);
                const score = calculateScore(sec.id);
                const total = sec.type === 'mcq' ? sec.questions.length : sec.items.length;
                const ratio = score / total;
                const titleMsg = ratio >= 0.8 ? 'ممتاز!' : (ratio >= 0.5 ? 'جيد جدًّا!' : 'أنهيت القسم!');
                const descMsg = ratio >= 0.8 ? 'لقد اجتزت التحدي بتفوقٍ وتألقٍ.' : (ratio >= 0.5 ? 'أداءٌ جيدٌ، ولكن يمكنك تحقيق الأفضل.' : 'تحتاج إلى مراجعة بعض المعاني والمحاولة مجددًا.');

                html += `<div id="sec-res-wrapper-${sec.id}" class="grid-expand ${isComplete ? 'grid-1' : 'grid-0'} w-full max-w-lg mx-auto"><div class="overflow-hidden-inner"><div class="bg-slate-800 text-white p-6 rounded-2xl text-center shadow-lg mt-8"><div class="text-6xl mb-4">🏆</div><h3 class="text-3xl font-bold mb-2 px-2">${titleMsg} النتيجة: ${toArabicNum(score)} / ${toArabicNum(total)}</h3><p class="text-2xl text-slate-300 mt-4 px-2">${descMsg}</p></div></div></div>${renderSectionEndButtons(sec.id)}`;
            }
            main.innerHTML = html;
        }

        function renderSortGame(sec) {
            const isComplete = checkSectionComplete(sec.id);
            const currentItem = isComplete ? null : state.sort.shuffledItems[state.sort.currentItemIdx];
            let categoriesHtml = '';
            if (currentItem) {
                const shuffledOpts = state.sort.shuffledOptions[currentItem.id];
                const colors = ['bg-emerald-100 border-emerald-300', 'bg-purple-100 border-purple-300', 'bg-amber-100 border-amber-300'];
                categoriesHtml = shuffledOpts.map((opt, idx) => `<button onclick="handleSortClick(${opt.originalIndex})" class="flex-1 py-4 px-2 rounded-xl font-bold text-lg md:text-xl border-2 ${colors[idx]} transition-transform active:scale-95 min-h-[5rem]">${opt.text}</button>`).join('');
            }
            return `<div class="w-full max-w-2xl mx-auto flex flex-col gap-4 px-2"><div class="flex gap-2 w-full justify-between">${categoriesHtml}</div><div class="relative min-h-[12rem] bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center p-4 text-right">${currentItem ? `<div class="absolute top-3 left-3"><button onclick="toggleSortHint()" class="w-8 h-8 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center shadow-sm">💡</button></div><div id="sort-card" class="w-full bg-white rounded-xl shadow-md border border-slate-200 p-6 text-center text-xl md:text-2xl font-bold text-slate-800 transition-all transform leading-snug"><div>${currentItem.text}</div><div class="grid-expand ${state.sort.hintActive ? 'grid-1' : 'grid-0'} w-full mt-2"><div class="overflow-hidden-inner"><div class="p-2 bg-amber-50 border border-amber-200 rounded-lg text-lg font-normal text-amber-800"><span class="font-bold">تلميح:</span> ${currentItem.hint}</div></div></div></div>` : `<div class="text-3xl font-bold text-emerald-500">تم الفرز بنجاحٍ!</div>`}</div><div class="grid-expand ${state.sort.feedbackActive ? 'grid-1' : 'grid-0'} w-full"><div class="overflow-hidden-inner"><div class="p-3 bg-red-50 border border-red-200 rounded-xl text-center text-red-700 text-lg font-bold">⚠️ ${currentItem ? currentItem.explanation : ''}</div></div></div>${!isComplete ? `<div class="text-center text-xl font-bold text-slate-500">البطاقة ${toArabicNum(state.sort.currentItemIdx + 1)} من ${toArabicNum(sec.items.length)}</div>` : ''}</div>`;
        }

        function toggleSortHint() { state.sort.hintActive = !state.sort.hintActive; renderContent(); }

        function handleSortClick(selectedOriginalIndex) {
            const currentItem = state.sort.shuffledItems[state.sort.currentItemIdx];
            if (selectedOriginalIndex === currentItem.correct) {
                state.sort.currentItemIdx++; state.sort.hintActive = false; state.sort.feedbackActive = false;
                const cardEl = document.getElementById('sort-card');
                if(cardEl) { cardEl.style.transform = 'translateY(-30px) scale(0.9)'; cardEl.style.opacity = '0'; }
                setTimeout(() => { renderTabs(); renderContent(); }, 300);
            } else {
                state.sort.feedbackActive = true;
                const cardEl = document.getElementById('sort-card');
                if(cardEl) { cardEl.classList.remove('animate-shake'); void cardEl.offsetWidth; cardEl.classList.add('animate-shake'); }
                renderContent();
            }
        }

        function renderMCQGame(sec) {
            return sec.questions.map((q, i) => {
                const isAnswered = state.mcq.answers[q.id] !== undefined;
                const isCorrect = state.mcq.answers[q.id] === q.correct;
                const optionsHtml = state.mcq.shuffled[sec.id][q.id].map((opt, idx) => {
                    const isSelected = state.mcq.answers[q.id] === opt.originalIndex;
                    let cls = 'bg-white border-slate-200 text-slate-700 hover:border-blue-400', numCls = 'bg-slate-100 text-slate-600';
                    if (isAnswered) {
                        if (isSelected) { cls = isCorrect ? 'bg-pastel-success border-pastel-successDark text-pastel-successDark shadow-inner' : 'bg-pastel-danger border-pastel-dangerDark text-pastel-dangerDark shadow-inner'; numCls = isCorrect ? 'bg-pastel-successDark text-white' : 'bg-pastel-dangerDark text-white'; }
                        else if (opt.originalIndex === q.correct) { cls = 'bg-white border-pastel-successDark text-pastel-successDark border-dashed'; numCls = 'bg-pastel-success text-pastel-successDark'; }
                        else { cls = 'bg-slate-50 border-slate-200 text-slate-400 opacity-50 cursor-not-allowed'; numCls = 'bg-slate-200 text-slate-400'; }
                    }
                    return `<button onclick="handleMCQClick('${sec.id}', '${q.id}', ${opt.originalIndex})" class="w-full p-4 rounded-xl border-2 transition-colors text-xl font-medium mb-2 flex items-center gap-3 text-right outline-none ${cls}"><div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg font-bold text-xl ${numCls}">${toArabicNum(idx+1)}</div><span class="leading-snug">${opt.text}</span></button>`;
                }).join('');
                return `<div class="w-full max-w-2xl mx-auto py-2 px-2"><div class="flex justify-between items-center mb-1 px-2"><span class="text-slate-500 font-bold text-xl">السؤال ${toArabicNum(i+1)}</span><button onclick="toggleMCQHint('${q.id}')" class="flex items-center gap-2 text-amber-500 font-bold px-3 py-1 bg-amber-50 rounded-lg outline-none text-lg"><span>💡</span><span>تلميح</span></button></div><h3 class="text-2xl font-bold text-slate-800 leading-snug px-2 text-right">${q.text}</h3><div class="grid-expand ${state.mcq.hints[q.id] ? 'grid-1' : 'grid-0'} w-full mt-2"><div class="overflow-hidden-inner"><div class="bg-amber-50 border border-amber-300 p-3 rounded-xl text-lg leading-snug text-right mb-2 text-amber-900"><span class="font-bold text-amber-700">💡 تلميح: </span>${q.hint}</div></div></div><div class="w-full flex flex-col mt-3">${optionsHtml}</div><div class="grid-expand ${isAnswered ? 'grid-1' : 'grid-0'} w-full mt-2"><div class="overflow-hidden-inner"><div class="p-4 rounded-xl border flex items-start gap-3 ${isCorrect ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-red-700 bg-red-50 border-red-200'}"><div class="text-2xl">${isCorrect ? '✅' : '❌'}</div><div><h4 class="font-bold text-xl mb-1">${isCorrect ? 'إجابة صحيحة!' : 'إجابة خاطئة!'}</h4><p class="text-lg leading-snug opacity-90">${q.explanation}</p></div></div></div></div></div><div class="w-full max-w-2xl mx-auto h-px bg-slate-200 my-4 border-0"></div>`;
            }).join('');
        }

        function toggleMCQHint(qId) { state.mcq.hints[qId] = !state.mcq.hints[qId]; renderContent(); }

        function handleMCQClick(secId, qId, val) {
            if (state.mcq.answers[qId] !== undefined) return;
            state.mcq.answers[qId] = val; updateProgressBar();
            if (checkSectionComplete(secId)) renderTabs(); renderContent(); updateFinalResultVisibility();
        }

        function renderInfoSection() {
            return `<div class="w-full max-w-2xl mx-auto bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col gap-6 px-4"><p class="text-xl text-slate-700 leading-relaxed text-right">تتنوع معاني حروف الجر في لغتنا الجميلة حسب السياق. دعنا نتعرف على أبرزها بأسلوبٍ ممتعٍ:</p><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2"><div class="bg-blue-50 rounded-2xl p-5 flex flex-col items-center text-center gap-3 border border-blue-100"><div class="text-4xl">🧭</div><h3 class="font-bold text-blue-900 text-xl">المكان والاتجاه</h3><p class="text-slate-600 text-lg">مِن (البداية)، إلَى (النهاية)، فِي (الظرفية)، عَلَى (الاستعلاء).</p></div><div class="bg-emerald-50 rounded-2xl p-5 flex flex-col items-center text-center gap-3 border border-emerald-100"><div class="text-4xl">⏱️</div><h3 class="font-bold text-emerald-900 text-2xl">الزمان</h3><p class="text-slate-600 text-lg">مِن، وإلَى، وفِي تُستخدم أيضًا للدلالة على الأوقات.</p></div><div class="bg-amber-50 rounded-2xl p-5 flex flex-col items-center text-center gap-3 border border-amber-100"><div class="text-4xl">⚙️</div><h3 class="font-bold text-amber-900 text-xl">الآلة والوسيلة</h3><p class="text-slate-600 text-lg">الباء تفيد <b>الآلة</b> (ماديًّا)، أو <b>الوسيلة</b> (معنويًّا كالعلم).</p></div><div class="bg-purple-50 rounded-2xl p-5 flex flex-col items-center text-center gap-3 border border-purple-100"><div class="text-4xl">🔍</div><h3 class="font-bold text-purple-900 text-xl">التشبيه والتفصيل</h3><p class="text-slate-600 text-lg">الكاف تُستخدم للتشبيه وتأتي لضرب الأمثلة (التفصيل).</p></div></div><button onclick="switchSection(1, true)" class="w-full bg-pastel-primaryDark text-white py-4 rounded-2xl font-bold text-2xl hover:bg-blue-700 transition-colors shadow-md mt-2 outline-none">ابدأ التحديات الآن!</button></div>`;
        }

        function renderSectionEndButtons(secId) {
            const isLast = activeSectionIndex === appData.sections.length - 1;
            return `<div class="flex gap-3 w-full max-w-lg mx-auto mt-6 px-4"><button onclick="resetSection('${secId}')" class="flex-1 bg-white border-2 border-slate-300 text-slate-700 py-3 rounded-xl font-bold text-xl hover:bg-slate-50 outline-none">إعادة المحاولة</button>${!isLast ? `<button onclick="switchSection(${activeSectionIndex + 1}, true)" class="flex-1 bg-pastel-primaryDark text-white py-3 rounded-xl font-bold text-xl hover:bg-blue-700 outline-none shadow-sm">القسم التالي</button>` : ''}</div>`;
        }

        function updateFinalResultVisibility() {
            const wrapper = document.getElementById('global-res-wrapper');
            if (!wrapper) return;
            if (isAllComplete()) {
                let s = 0, q = 0;
                appData.sections.filter(x => x.type !== 'info').forEach(x => { s += calculateScore(x.id); q += (x.questions?x.questions.length:x.items.length); });
                
                let ratio = s / q;
                let globalTitle = ratio >= 0.8 ? 'أكملت التحديات بتفوقٍ ونجاحٍ!' : (ratio >= 0.5 ? 'أكملت التحديات بنجاحٍ!' : 'أنهيت التدريبات، لكن راجع أخطاءك!');
                
                document.getElementById('global-final-title').textContent = globalTitle;
                document.getElementById('global-final-score').textContent = `${toArabicNum(s)} / ${toArabicNum(q)}`;
                wrapper.classList.replace('grid-0', 'grid-1');
            } else {
                wrapper.classList.replace('grid-1', 'grid-0');
            }
        }

        function resetSection(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if(sectionId === 'sort') state.sort = { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false };
            else { 
                sec.questions.forEach(q => { delete state.mcq.answers[q.id]; delete state.mcq.hints[q.id]; });
                state.mcq.shuffled[sectionId] = null;
            }
            initSectionShuffle(sectionId); 
            
            renderTabs(false); 
            renderContent(); 
            updateFinalResultVisibility(); 
            
            requestAnimationFrame(() => {
                setTimeout(() => {
                    scrollToTabs();
                    const activeTab = document.getElementById(`tab-btn-${sectionId}`);
                    centerTabHorizontal(activeTab);
                }, 50);
            });
        }

        function startOver() {
            // إخفاء النتيجة فورًا لمنع القفزات
            const wrapper = document.getElementById('global-res-wrapper');
            if(wrapper) {
                wrapper.style.transition = 'none';
                wrapper.classList.replace('grid-1', 'grid-0');
                void wrapper.offsetWidth; // إجبار المتصفح على تطبيق التحديث الفوري
                wrapper.style.transition = '';
            }

            // تصفير البيانات
            state.mcq = { answers: {}, hints: {}, shuffled: {} };
            state.sort = { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false };
            
            activeSectionIndex = 0;
            initSectionShuffle(appData.sections[0].id);
            
            renderTabs(false);
            renderContent();
            updateFinalResultVisibility();

            // تمرير لحظي حاسم لمستوى التبويبات وتوسيط أفقي دقيق بعد الـ Reflow
            requestAnimationFrame(() => {
                setTimeout(() => {
                    scrollToTabs(); 
                    const activeTab = document.getElementById(`tab-btn-${appData.sections[0].id}`);
                    centerTabHorizontal(activeTab);
                }, 50);
            });
        }

        function shuffleArray(a) { let n = [...a]; for (let i = n.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [n[i], n[j]] = [n[j], n[i]]; } return n; }

        window.onload = () => switchSection(0, false);
    </script>
</body>
</html>
