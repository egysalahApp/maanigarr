<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العربية السهلة - معاني حروف الجر</title>
    <!-- Google Fonts: Readex Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Readex Pro"', 'sans-serif'] },
                    colors: {
                        pastel: {
                            bg: '#F8FAFC',
                            card: '#FFFFFF',
                            primary: '#E0F2FE',
                            primaryDark: '#0284C7',
                            success: '#D1FAE5',
                            successDark: '#059669',
                            danger: '#FEE2E2',
                            dangerDark: '#DC2626',
                            warning: '#FEF3C7',
                            warningDark: '#D97706',
                        }
                    },
                    animation: { 'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both' },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .grid-expand { display: grid; transition: grid-template-rows 0.4s ease-out, opacity 0.4s ease-out; }
        .grid-0 { grid-template-rows: 0fr; opacity: 0; pointer-events: none; }
        .grid-1 { grid-template-rows: 1fr; opacity: 1; pointer-events: auto; }
        .overflow-hidden-inner { overflow: hidden; }
        main { scroll-margin-top: 5rem; }
    </style>
</head>
<body class="bg-pastel-bg text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-200">

    <!-- Header (غير مثبت) -->
    <header id="page-header" class="w-full bg-pastel-bg">
        <div class="max-w-3xl mx-auto pt-6 pb-4 text-center">
            <h1 class="flex items-center justify-center">
                <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 hover:opacity-80 transition-opacity outline-none">
                    <span class="text-3xl font-bold text-slate-900">العربية السهلة</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#FF0000" class="w-8 h-8 flex-shrink-0">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </a>
            </h1>
            <p class="text-xl font-bold text-slate-500 mt-2">محمود صلاح</p>
        </div>
    </header>

    <!-- Tabs Container (Sticky) -->
    <div id="tabs-wrapper" class="sticky top-0 z-50 w-full bg-pastel-bg/95 backdrop-blur shadow-sm border-b border-slate-200">
        <div class="relative w-full max-w-3xl mx-auto pt-1">
            <div id="tabs-container" class="flex overflow-x-auto no-scrollbar mx-auto w-max max-w-full px-4 py-1 gap-2 items-center"></div>
            <div class="absolute bottom-0 right-0 h-1.5 bg-pastel-primaryDark transition-all duration-500 ease-out w-0 origin-right" id="progress-bar"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="flex-grow w-full max-w-3xl mx-auto p-4 md:p-6 flex flex-col pb-8"></main>

    <!-- حاوية النتيجة النهائية -->
    <div class="w-full max-w-3xl mx-auto px-4 md:px-6 pb-12">
        <div id="global-res-wrapper" class="grid-expand grid-0 w-full max-w-lg mx-auto">
            <div class="overflow-hidden-inner">
                <div class="bg-gradient-to-br from-pastel-primaryDark to-blue-900 text-white p-8 rounded-2xl text-center shadow-xl mt-6">
                    <div class="text-7xl mb-4">🎓</div>
                    <h2 class="text-4xl font-bold mb-4">أكملت جميع التحديات بنجاحٍ!</h2>
                    <p class="text-2xl text-blue-100 mb-8">حصيلتك الإجمالية: <span id="global-final-score" class="font-bold text-white text-4xl">٠ / ٠</span></p>
                    <button onclick="startOver()" class="w-full bg-white text-blue-900 py-4 rounded-xl font-bold text-2xl hover:bg-slate-50 transition-colors shadow-md outline-none">ابدأ من جديدٍ</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-6 text-center border-t border-slate-200">
        <a href="https://www.youtube.com/egysalah" target="_blank" rel="noopener noreferrer" class="text-base text-slate-400 font-medium text-center block py-2 hover:text-slate-600 transition-colors outline-none">جميع الحقوق محفوظة لقناة العربية السهلة</a>
    </footer>

    <script>
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }

        const toArabicNum = (num) => String(num).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

        const appData = {
            sections: [
                { id: 'intro', title: 'مقدمة', type: 'info' },
                {
                    id: 'fill',
                    title: 'الكلمة المفقودة',
                    type: 'mcq',
                    description: 'اختر حرف الجر المناسب لملء الفراغِ ليعطي المعنى المطلوب بدقةٍ.',
                    questions: [
                        { id: 'f1', text: 'خاتمُ المعلمِ مصنوعٌ [ ... ] فضةٍ. (بيان النوع)', options: ['مِنْ', 'فِي', 'بـِ'], correct: 0, hint: 'نحتاج حرفًا يبين المادة الخام.', explanation: '(مِنْ) تستخدم لبيان النوع والمادة.' },
                        { id: 'f2', text: 'السفرُ أحبُّ [ ... ] من البقاءِ. (معنى العِندية)', options: ['إلَيَّ', 'عَلَيَّ', 'فِيَّ'], correct: 0, hint: 'الحرف هنا يفيد معنى (عند).', explanation: '(إلَى) تستخدم بمعنى (عند) أحيانًا.' },
                        { id: 'f3', text: 'فاقَ المجتهدُ أقرانَهُ [ ... ] صغرِ سنِّهِ. (معنى الرَّغم)', options: ['عَلَى', 'مِنْ', 'البَاء'], correct: 0, hint: 'أي: بالرغم من صغر سنه.', explanation: '(عَلَى) تفيد معنى (الرغم).' },
                        { id: 'f4', text: 'أخذتُ العلمَ [ ... ] أفواهِ العلماءِ. (مصدر الشيء)', options: ['عَنْ', 'فِي', 'إلَى'], correct: 0, hint: 'الحرف يدل على الأصل والمصدر.', explanation: '(عَنْ) تدل على مصدر الشيء وأصله.' },
                        { id: 'f5', text: 'استمعتُ للدرسِ [ ... ] انتباهٍ. (الحال)', options: ['بـِ', 'فِي', 'كـَ'], correct: 0, hint: 'أي: استمعتُ مُنتبهًا.', explanation: 'الباء تدخل لتفيد وصف الحال.' },
                        { id: 'f6', text: 'أنفقتُ [ ... ] مالي في الخيرِ. (التبعيض)', options: ['مِنْ', 'إلَى', 'عَلَى'], correct: 0, hint: 'أي: أنفقت جزءًا من مالي.', explanation: '(مِنْ) تدل على التبعيض.' },
                        { id: 'f7', text: 'ينقسمُ الكلمُ [ ... ] ثلاثةِ أقسامٍ. (التقسيم)', options: ['إلَى', 'فِي', 'عَنْ'], correct: 0, hint: 'تجزئة الشيء لمكوناته.', explanation: '(إلَى) تفيد التقسيم والتفصيل.' },
                        { id: 'f8', text: 'خرجتُ [ ... ] البيتِ صباحًا. (ابتداء المكان)', options: ['مِنْ', 'عَنْ', 'فِي'], correct: 0, hint: 'نقطة الانطلاق المكانية.', explanation: '(مِنْ) تفيد ابتداء الغاية المكانية.' },
                        { id: 'f9', text: 'الفواكهُ صيفيةٌ [ ... ] العنبِ والبطيخِ. (التفصيل)', options: ['كـَ', 'لـِ', 'بـِ'], correct: 0, hint: 'لضرب الأمثلة التوضيحية.', explanation: 'الكاف تفيد التمثيل والتفصيل.' },
                        { id: 'f10', text: 'دخلت امرأةٌ النارَ [ ... ] هرّةٍ. (السببية)', options: ['فِي', 'عَلَى', 'عَنْ'], correct: 0, hint: 'أي: بسبب هرّةٍ.', explanation: '(فِي) تأتي أحيانًا لتفيد السببية.' },
                        { id: 'f11', text: 'أحبُّ العلمَ [ ... ] أهميتِهِ. (السببية)', options: ['لـِ', 'بـِ', 'فِي'], correct: 0, hint: 'لماذا تحب العلم؟', explanation: 'اللام تفيد التعليل والسببية.' },
                        { id: 'f12', text: 'تحدثنا طويلاً [ ... ] فضلِ الأمِ. (موضوع الكلام)', options: ['عَنْ', 'مِنْ', 'إلَى'], correct: 0, hint: 'عن ماذا كان الحديث؟', explanation: '(عَنْ) تدل على موضوع الحديث.' }
                    ]
                },
                {
                    id: 'sort',
                    title: 'فرز البطاقات',
                    type: 'sort',
                    description: 'اسحب البطاقة أو انقر على الصندوق المناسب للمعنى الذي يؤديه الحرف الملون.',
                    items: [
                        { id: 'srt1', text: 'شرّبت الأمُ ولدها الدواء <span class="text-pastel-primaryDark font-black">على</span> أنه ماء', options: ['معنى الوهم', 'الاستعلاء', 'الشرط'], correct: 0, hint: 'تصوير شيءٍ غير حقيقيٍ.', explanation: '(عَلَى) تفيد هنا التوهم.' },
                        { id: 'srt2', text: '<span class="text-pastel-primaryDark font-black">بـ</span>سم الله الرحمن الرحيم', options: ['الوسيلة (الاستعانة)', 'القسم', 'السبب'], correct: 0, hint: 'طلب العون لعمل شيءٍ.', explanation: 'الباء هنا للاستعانة والوسيلة.' },
                        { id: 'srt3', text: 'فرحَ الطفلُ <span class="text-pastel-primaryDark font-black">بـ</span>قدومِ العيدِ', options: ['السبب والعلة', 'الآلة', 'الثمن'], correct: 0, hint: 'ما الدافع وراء الفرح؟', explanation: 'الباء هنا تفيد السببية.' },
                        { id: 'srt4', text: 'هذا البستانُ <span class="text-pastel-primaryDark font-black">لـ</span>أخي المجتهدِ', options: ['الملكية المادية', 'الملكية المعنوية', 'التعليل'], correct: 0, hint: 'امتلاك شيءٍ ماديٍ.', explanation: 'اللام هنا للملكية المادية.' },
                        { id: 'srt5', text: 'الوفاءُ <span class="text-pastel-primaryDark font-black">لـ</span>ـه أثرٌ طيبٌ', options: ['الملكية المعنوية', 'الملكية المادية', 'الإباحة'], correct: 0, hint: 'اختصاص صفةٍ بشيءٍ.', explanation: 'اللام هنا للملكية المعنوية.' },
                        { id: 'srt6', text: 'اشتريتُ القلمَ <span class="text-pastel-primaryDark font-black">بـ</span>درهمٍ', options: ['التعويض والثمن', 'الآلة', 'الوسيلة'], correct: 0, hint: 'مبادلة مالٍ بسلعةٍ.', explanation: 'الباء تدخل على الأثمان.' },
                        { id: 'srt7', text: 'سرتُ <span class="text-pastel-primaryDark font-black">إلى</span> مطلعِ الفجرِ', options: ['انتهاء الزمان', 'انتهاء المكان', 'الاتجاه'], correct: 0, hint: 'نهاية وقت الفعل.', explanation: '(إلَى) تفيد انتهاء الزمان.' },
                        { id: 'srt8', text: 'ابتعدتُ <span class="text-pastel-primaryDark font-black">عن</span> رفقاءِ السوءِ', options: ['البعد والفصل حسًّا', 'البعد معنًى', 'موضوع الكلام'], correct: 0, hint: 'تغيير المكان والابتعاد.', explanation: '(عَنْ) تفيد المجاوزة والبعد.' },
                        { id: 'srt9', text: 'لعبنا <span class="text-pastel-primaryDark font-black">في</span> الحديقةِ', options: ['الظرفية المكانية', 'الظرفية الزمانية', 'السببية'], correct: 0, hint: 'أين حدث الفعل؟', explanation: '(فِي) تفيد المكان.' },
                        { id: 'srt10', text: 'النجومُ <span class="text-pastel-primaryDark font-black">كـ</span>المصابيحِ ضياءً', options: ['التشبيه', 'التفصيل', 'التعليل'], correct: 0, hint: 'مماثلة بين شيئين.', explanation: 'الكاف تفيد التشبيه.' }
                    ]
                },
                {
                    id: 'mcq2',
                    title: 'أسرار المعاني',
                    type: 'mcq',
                    description: 'تحديات لغوية دقيقة تختبر فهمك العميق لأسرار حروف الجر.',
                    questions: [
                        { id: 'm1', text: 'ما معنى اللام في: "اللهمَّ اغفر لـنا ولوالدينا"؟', options: ['الدعاء بالخير', 'الملكية', 'التعليل'], correct: 0, hint: 'طلب الخير لشخصٍ ما.', explanation: 'اللام تستخدم للدعاء بالخير (عكس على).' },
                        { id: 'm2', text: 'ما معنى (على) في: "دعا المظلومُ على مَن ظلمَهُ"؟', options: ['الدعاء بالشر', 'الاستعلاء', 'الرغم'], correct: 0, hint: 'طلب السوء لشخصٍ ما.', explanation: '(على) تستخدم للدعاء بالشر.' },
                        { id: 'm3', text: 'ماذا تفيد الباء في: "ليسَ النجاحُ بـمستحيلٍ"؟', options: ['تأكيد النفي', 'الوسيلة', 'السببية'], correct: 0, hint: 'جاءت لتقوية معنى النفي بـ (ليس).', explanation: 'الباء الزائدة تفيد تأكيد النفي.' },
                        { id: 'm4', text: 'ما دلالة (من) في: "ما جاءنا من بشيرٍ"؟', options: ['تأكيد النفي', 'التبعيض', 'بيان النوع'], correct: 0, hint: 'جاءت في جملةٍ منفيةٍ للتوكيد.', explanation: '(من) الزائدة تفيد تأكيد النفي.' },
                        { id: 'm5', text: 'ما معنى (في) في: "خرجَ القائدُ في جُندِهِ"؟', options: ['المعية (المصاحبة)', 'المكان', 'السبب'], correct: 0, hint: 'أي: خرج مع جنده.', explanation: '(فِي) تفيد المعية والمصاحبة أحيانًا.' },
                        { id: 'm6', text: 'ما معنى (عن) في: "لا تجزي نفسٌ عن نفسٍ شيئًا"؟', options: ['البدلية (العِوض)', 'البعد', 'الموضوع'], correct: 0, hint: 'أي: لا تقوم مقامها أو بدلاً منها.', explanation: '(عَنْ) تأتي بمعنى البدل.' },
                        { id: 'm7', text: 'ما معنى اللام في: "للأطفالِ أن يلعبوا في الساحةِ"؟', options: ['الإباحة (السماح)', 'الملكية', 'السببية'], correct: 0, hint: 'تعطي إذنًا بالقيام بالفعل.', explanation: 'اللام تفيد الإباحة والسماح.' },
                        { id: 'm8', text: 'ما معنى (على) في: "على المديونِ مائةُ دينارٍ"؟', options: ['الشيء المكروه (الدَّين)', 'الوجوب', 'الاستعلاء'], correct: 0, hint: 'تستخدم مع الديون والأعباء.', explanation: '(على) تفيد التحمل أو الدَّين.' }
                    ]
                },
                {
                    id: 'search',
                    title: 'البحث الدقيق',
                    type: 'mcq',
                    noShuffle: true,
                    description: 'التحدي الختامي: المقارنة بين المحسوس والمعنوي لترسيخ الفروق الدقيقة.',
                    questions: [
                        { id: 'p1a', text: 'هذه السيارةُ <span class="text-pastel-primaryDark font-black">لـ</span>جاري. اللام هنا تفيد:', options: ['الملكية المادية', 'الملكية المعنوية', 'التعليل'], correct: 0, hint: 'السيارة شيءٌ ماديٌ ملموسٌ.', explanation: 'اللام للملكية المادية.' },
                        { id: 'p1b', text: '<span class="text-pastel-primaryDark font-black">لـ</span>لحريةِ ثمنٌ غالٍ. ماذا تفيد اللام هنا؟', options: ['الملكية المادية', 'الملكية المعنوية (الاختصاص)', 'السبب'], correct: 1, hint: 'الحرية قيمةٌ معنويةٌ وليست مادةً.', explanation: 'اللام للملكية المعنوية أو الاختصاص.' },
                        { id: 'p2a', text: 'وصلتُ <span class="text-pastel-primaryDark font-black">إلى</span> الحديقةِ. (إلى) تفيد:', options: ['الاتجاه حسًّا', 'الاتجاه معنًى', 'الزمان'], correct: 0, hint: 'الحديقة مكانٌ نصل إليه فعليًا.', explanation: '(إلى) تفيد انتهاء الغاية المكانية (حسًّا).' },
                        { id: 'p2b', text: 'وصلتُ <span class="text-pastel-primaryDark font-black">إلى</span> الحلِّ الصحيحِ. (إلى) تفيد:', options: ['الاتجاه حسًّا', 'الاتجاه معنًى', 'الزمان'], correct: 1, hint: 'الحل وصولٌ فكريٌ وليس مكانيًا.', explanation: '(إلى) تفيد انتهاء الغاية معنويًا.' },
                        { id: 'p3a', text: 'رميتُ الكرةَ <span class="text-pastel-primaryDark font-black">عن</span> المنضدةِ. (عن) تفيد:', options: ['البعد حسًّا', 'البعد معنًى', 'الموضوع'], correct: 0, hint: 'الكرة والمنضدة أشياء مادية.', explanation: '(عن) تفيد البعد والفصل الحسي.' },
                        { id: 'p3b', text: 'ابتعدتُ <span class="text-pastel-primaryDark font-black">عن</span> الغيبةِ والنميمةِ. (عن) تفيد:', options: ['البعد حسًّا', 'البعد معنًى', 'المصدر'], correct: 1, hint: 'الغيبة والنميمة سلوكياتٌ معنويةٌ.', explanation: '(عن) تفيد البعد والفصل المعنوي.' },
                        { id: 'p4a', text: 'الكتابُ <span class="text-pastel-primaryDark font-black">على</span> المكتبِ. (على) تفيد:', options: ['الاستعلاء الحقيقي', 'القرب والندنية', 'الوجوب'], correct: 0, hint: 'الكتاب فوق المكتب ماديًا.', explanation: '(على) تفيد الاستعلاء الحقيقي.' },
                        { id: 'p4b', text: 'جلستُ <span class="text-pastel-primaryDark font-black">على</span> النهرِ. (على) تفيد:', options: ['الاستعلاء الحقيقي', 'القرب والندنية', 'الوجوب'], correct: 1, hint: 'هل جلست فوق الماء أم بجوار النهر؟', explanation: '(على) هنا تفيد القرب (بمعنى عند).' }
                    ]
                }
            ]
        };

        let state = {
            mcq: { answers: {}, hints: {}, shuffled: {} },
            sort: { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false }
        };

        function scrollToTabs() {
            requestAnimationFrame(() => {
                const header = document.getElementById('page-header');
                const targetY = header ? header.offsetHeight : 0;
                window.scrollTo({ top: targetY, behavior: 'smooth' });
            });
        }

        function centerTabHorizontal(tabEl) {
            if (!tabEl) return;
            const container = document.getElementById('tabs-container');
            requestAnimationFrame(() => {
                const tabRect = tabEl.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                const diff = (tabRect.left + tabRect.width / 2) - (containerRect.left + containerRect.width / 2);
                container.scrollBy({ left: diff, behavior: 'smooth' });
            });
        }

        function initSectionShuffle(sectionId) {
            const section = appData.sections.find(s => s.id === sectionId);
            if (!section || section.type === 'info') return;
            if (section.type === 'mcq' && !state.mcq.shuffled[sectionId]) {
                state.mcq.shuffled[sectionId] = {};
                section.questions.forEach(q => {
                    const opts = q.options.map((text, i) => ({ text, originalIndex: i }));
                    state.mcq.shuffled[sectionId][q.id] = (section.noShuffle) ? opts : shuffleArray(opts);
                });
            }
            if (section.type === 'sort') {
                if (!state.sort.shuffledItems) state.sort.shuffledItems = shuffleArray(section.items);
                if (!state.sort.shuffledOptions) {
                    state.sort.shuffledOptions = {};
                    section.items.forEach(item => {
                        const opts = item.options.map((text, i) => ({ text, originalIndex: i }));
                        state.sort.shuffledOptions[item.id] = shuffleArray(opts);
                    });
                }
            }
        }

        function renderTabs(shouldCenter = false) {
            const container = document.getElementById('tabs-container');
            if (container.children.length === 0) {
                appData.sections.forEach((sec, idx) => {
                    const btn = document.createElement('button');
                    btn.id = `tab-btn-${sec.id}`;
                    btn.onclick = () => switchSection(idx, true);
                    btn.innerHTML = `<span class="whitespace-nowrap font-bold">${sec.title}</span>` + 
                        (sec.type !== 'info' ? `<svg id="tab-check-${sec.id}" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-pastel-successDark transition-opacity duration-300 opacity-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>` : '');
                    container.appendChild(btn);
                });
            }
            appData.sections.forEach((sec, idx) => {
                const btn = document.getElementById(`tab-btn-${sec.id}`);
                const isActive = activeSectionIndex === idx;
                btn.className = `flex-shrink-0 flex items-center gap-2 px-5 py-4 rounded-t-xl transition-colors font-bold text-xl relative outline-none ${isActive ? 'text-pastel-primaryDark bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]' : 'text-slate-500 hover:text-slate-700'}`;
                if (sec.type !== 'info') {
                    const check = document.getElementById(`tab-check-${sec.id}`);
                    if (check) { check.classList.toggle('opacity-100', checkSectionComplete(sec.id)); check.classList.toggle('opacity-0', !checkSectionComplete(sec.id)); }
                }
                if (isActive && shouldCenter) centerTabHorizontal(btn);
            });
            updateProgressBar();
        }

        function updateProgressBar() {
            const bar = document.getElementById('progress-bar');
            const sec = appData.sections[activeSectionIndex];
            let percent = (sec.type === 'info') ? 100 : (sec.type === 'mcq' ? (sec.questions.filter(q => state.mcq.answers[q.id] !== undefined).length / sec.questions.length) * 100 : (state.sort.currentItemIdx / sec.items.length) * 100);
            bar.style.width = `${percent}%`;
        }

        function switchSection(idx, shouldScroll = false) {
            activeSectionIndex = idx;
            initSectionShuffle(appData.sections[idx].id);
            renderTabs(true); renderContent(); updateFinalResultVisibility();
            if (shouldScroll) setTimeout(scrollToTabs, 50);
        }

        function checkSectionComplete(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if (!sec || sec.type === 'info') return false;
            return (sec.type === 'mcq') ? sec.questions.every(q => state.mcq.answers[q.id] !== undefined) : state.sort.currentItemIdx === sec.items.length;
        }

        function isAllComplete() { return appData.sections.filter(s => s.type !== 'info').every(s => checkSectionComplete(s.id)); }

        function calculateScore(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if (sec.type === 'mcq') return sec.questions.filter(q => state.mcq.answers[q.id] === q.correct).length;
            return sec.items.length;
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            const sec = appData.sections[activeSectionIndex];
            let html = `<div class="text-center mb-8 pt-6"><h2 class="text-4xl md:text-5xl font-bold text-slate-800 mb-4">معاني حروف الجر</h2>${sec.description ? `<p class="text-2xl text-slate-600 mt-6 leading-snug max-w-2xl mx-auto">${sec.description}</p>` : ''}</div>`;
            if (sec.type === 'info') html += renderInfoSection();
            else if (sec.type === 'sort') html += renderSortGame(sec);
            else html += renderMCQGame(sec);
            if (sec.type !== 'info') {
                const isComplete = checkSectionComplete(sec.id);
                html += `<div id="sec-res-wrapper-${sec.id}" class="grid-expand ${isComplete ? 'grid-1' : 'grid-0'} w-full max-w-lg mx-auto"><div class="overflow-hidden-inner"><div class="bg-slate-800 text-white p-8 rounded-2xl text-center shadow-lg mt-8"><div class="text-6xl mb-4">🏆</div><h3 class="text-3xl font-bold mb-2">أحسنت! النتيجة: ${toArabicNum(calculateScore(sec.id))} / ${toArabicNum(sec.type==='mcq'?sec.questions.length:sec.items.length)}</h3><p class="text-2xl text-slate-300 mt-4">لقد أنهيت التحدي بنجاحٍ.</p></div></div></div>${renderSectionEndButtons(sec.id)}`;
            }
            main.innerHTML = html;
        }

        function renderSortGame(sec) {
            const isComplete = checkSectionComplete(sec.id);
            const currentItem = isComplete ? null : state.sort.shuffledItems[state.sort.currentItemIdx];
            let categoriesHtml = '';
            if (currentItem) {
                const shuffledOpts = state.sort.shuffledOptions[currentItem.id];
                const colors = ['bg-emerald-100 border-emerald-300', 'bg-purple-100 border-purple-300', 'bg-amber-100 border-amber-300'];
                categoriesHtml = shuffledOpts.map((opt, idx) => `<button onclick="handleSortClick(${opt.originalIndex})" class="flex-1 py-4 px-2 rounded-xl font-bold text-lg md:text-xl border-2 ${colors[idx]} hover:scale-105 transition-transform active:scale-95 min-h-[5rem]">${opt.text}</button>`).join('');
            }
            return `<div class="w-full max-w-2xl mx-auto flex flex-col gap-6"><div class="flex gap-3 w-full justify-between">${categoriesHtml}</div><div class="relative min-h-[14rem] bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center p-6">${currentItem ? `<div class="absolute top-4 left-4"><button onclick="toggleSortHint()" class="w-10 h-10 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center shadow-sm">💡</button></div><div id="sort-card" class="w-full bg-white rounded-xl shadow-md border border-slate-200 p-8 text-center text-2xl md:text-3xl font-bold text-slate-800 transition-all transform leading-snug"><div>${currentItem.text}</div><div class="grid-expand ${state.sort.hintActive ? 'grid-1' : 'grid-0'} w-full mt-4"><div class="overflow-hidden-inner"><div class="p-3 bg-amber-50 border border-amber-200 rounded-lg text-lg font-normal text-amber-800"><span class="font-bold">تلميح:</span> ${currentItem.hint}</div></div></div></div>` : `<div class="text-3xl font-bold text-emerald-500">تم الفرز بنجاحٍ!</div>`}</div><div class="grid-expand ${state.sort.feedbackActive ? 'grid-1' : 'grid-0'} w-full"><div class="overflow-hidden-inner"><div class="p-4 bg-red-50 border border-red-200 rounded-xl text-center text-red-700 text-xl font-bold">⚠️ ${currentItem ? currentItem.explanation : ''}</div></div></div>${!isComplete ? `<div class="text-center text-2xl font-bold text-slate-500">البطاقة ${toArabicNum(state.sort.currentItemIdx + 1)} من ${toArabicNum(sec.items.length)}</div>` : ''}</div>`;
        }

        function toggleSortHint() { state.sort.hintActive = !state.sort.hintActive; renderContent(); }

        function handleSortClick(selectedOriginalIndex) {
            const currentItem = state.sort.shuffledItems[state.sort.currentItemIdx];
            if (selectedOriginalIndex === currentItem.correct) {
                state.sort.currentItemIdx++; state.sort.hintActive = false; state.sort.feedbackActive = false;
                const cardEl = document.getElementById('sort-card');
                if(cardEl) { cardEl.style.transform = 'translateY(-50px) scale(0.9)'; cardEl.style.opacity = '0'; }
                setTimeout(() => { renderTabs(); renderContent(); }, 300);
            } else {
                state.sort.feedbackActive = true;
                const cardEl = document.getElementById('sort-card');
                if(cardEl) { cardEl.classList.remove('animate-shake'); void cardEl.offsetWidth; cardEl.classList.add('animate-shake'); }
                renderContent();
            }
        }

        function renderMCQGame(sec) {
            return sec.questions.map((q, i) => {
                const isAnswered = state.mcq.answers[q.id] !== undefined;
                const isCorrect = state.mcq.answers[q.id] === q.correct;
                const optionsHtml = state.mcq.shuffled[sec.id][q.id].map((opt, idx) => {
                    const isSelected = state.mcq.answers[q.id] === opt.originalIndex;
                    let cls = 'bg-white border-slate-200 text-slate-700 hover:border-blue-400', numCls = 'bg-slate-100 text-slate-600';
                    if (isAnswered) {
                        if (isSelected) { cls = isCorrect ? 'bg-pastel-success border-pastel-successDark text-pastel-successDark shadow-inner' : 'bg-pastel-danger border-pastel-dangerDark text-pastel-dangerDark shadow-inner'; numCls = isCorrect ? 'bg-pastel-successDark text-white' : 'bg-pastel-dangerDark text-white'; }
                        else if (opt.originalIndex === q.correct) { cls = 'bg-white border-pastel-successDark text-pastel-successDark border-dashed'; numCls = 'bg-pastel-success text-pastel-successDark'; }
                        else { cls = 'bg-slate-50 border-slate-200 text-slate-400 opacity-50 cursor-not-allowed'; numCls = 'bg-slate-200 text-slate-400'; }
                    }
                    return `<button onclick="handleMCQClick('${sec.id}', '${q.id}', ${opt.originalIndex})" class="w-full p-5 rounded-xl border-2 transition-colors text-2xl font-medium mb-4 flex items-center gap-4 text-right outline-none ${cls}"><div class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-lg font-bold text-2xl ${numCls}">${toArabicNum(idx+1)}</div><span class="leading-snug">${opt.text}</span></button>`;
                }).join('');
                return `<div class="w-full max-w-2xl mx-auto py-4"><div class="flex justify-between items-center mb-2 px-2"><span class="text-slate-500 font-bold text-2xl">السؤال ${toArabicNum(i+1)}</span><button onclick="toggleMCQHint('${q.id}')" class="flex items-center gap-2 text-amber-500 font-bold px-4 py-2 bg-amber-50 rounded-xl outline-none"><span>💡</span><span>تلميح</span></button></div><h3 class="text-3xl font-bold text-slate-800 leading-snug px-2 text-right">${q.text}</h3><div class="grid-expand ${state.mcq.hints[q.id] ? 'grid-1' : 'grid-0'} w-full mt-3"><div class="overflow-hidden-inner"><div class="bg-amber-50 border border-amber-300 p-5 rounded-xl text-xl leading-snug text-right mb-2 text-amber-900"><span class="font-bold text-amber-700">💡 تلميح: </span>${q.hint}</div></div></div><div class="w-full flex flex-col gap-4 mt-6">${optionsHtml}</div><div class="grid-expand ${isAnswered ? 'grid-1' : 'grid-0'} w-full mt-4"><div class="overflow-hidden-inner"><div class="p-6 rounded-xl border flex items-start gap-4 ${isCorrect ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-red-700 bg-red-50 border-red-200'}"><div class="text-3xl">${isCorrect ? '✅' : '❌'}</div><div><h4 class="font-bold text-2xl mb-2">${isCorrect ? 'إجابة صحيحة!' : 'إجابة خاطئة!'}</h4><p class="text-xl leading-snug opacity-90">${q.explanation}</p></div></div></div></div></div><div class="w-full max-w-2xl mx-auto h-px bg-slate-200 my-6 border-0"></div>`;
            }).join('');
        }

        function toggleMCQHint(qId) { state.mcq.hints[qId] = !state.mcq.hints[qId]; renderContent(); }

        function handleMCQClick(secId, qId, val) {
            if (state.mcq.answers[qId] !== undefined) return;
            state.mcq.answers[qId] = val; updateProgressBar();
            if (checkSectionComplete(secId)) renderTabs(); renderContent(); updateFinalResultVisibility();
        }

        function renderInfoSection() {
            return `<div class="w-full max-w-2xl mx-auto bg-white rounded-3xl p-8 shadow-sm border border-slate-100 flex flex-col gap-8"><p class="text-2xl text-slate-700 leading-relaxed text-right">تتنوع معاني حروف الجر في لغتنا الجميلة حسب السياق. دعنا نتعرف على أبرزها بأسلوبٍ ممتعٍ:</p><div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-2"><div class="bg-blue-50 rounded-2xl p-6 flex flex-col items-center text-center gap-4 border border-blue-100"><div class="text-5xl">🧭</div><h3 class="font-bold text-blue-900 text-2xl">المكان والاتجاه</h3><p class="text-slate-600 text-xl mt-2">مِن (البداية)، إلَى (النهاية)، فِي (الظرفية)، عَلَى (الاستعلاء).</p></div><div class="bg-emerald-50 rounded-2xl p-6 flex flex-col items-center text-center gap-4 border border-emerald-100"><div class="text-5xl">⏱️</div><h3 class="font-bold text-emerald-900 text-2xl">الزمان</h3><p class="text-slate-600 text-xl mt-2">مِن، وإلَى، وفِي تُستخدم أيضًا للدلالة على الأوقات.</p></div><div class="bg-amber-50 rounded-2xl p-6 flex flex-col items-center text-center gap-4 border border-amber-100"><div class="text-5xl">⚙️</div><h3 class="font-bold text-amber-900 text-2xl">الآلة والوسيلة</h3><p class="text-slate-600 text-xl mt-2">الباء تفيد <b>الآلة</b> (مادي)، أو <b>الوسيلة</b> (معنوي كالعلم).</p></div><div class="bg-purple-50 rounded-2xl p-6 flex flex-col items-center text-center gap-4 border border-purple-100"><div class="text-5xl">🔍</div><h3 class="font-bold text-purple-900 text-2xl">التشبيه والتفصيل</h3><p class="text-slate-600 text-xl mt-2">الكاف تُستخدم للتشبيه وتأتي لضرب الأمثلة (التفصيل).</p></div></div><button onclick="switchSection(1, true)" class="w-full bg-pastel-primaryDark text-white py-5 rounded-2xl font-bold text-3xl hover:bg-blue-700 transition-colors shadow-md mt-4 outline-none">ابدأ التحديات الآن!</button></div>`;
        }

        function renderSectionEndButtons(secId) {
            const isLast = activeSectionIndex === appData.sections.length - 1;
            return `<div class="flex gap-4 w-full max-w-lg mx-auto mt-8"><button onclick="resetSection('${secId}')" class="flex-1 bg-white border-2 border-slate-300 text-slate-700 py-4 rounded-xl font-bold text-2xl hover:bg-slate-50 outline-none">إعادة المحاولة</button>${!isLast ? `<button onclick="switchSection(${activeSectionIndex + 1}, true)" class="flex-1 bg-pastel-primaryDark text-white py-4 rounded-xl font-bold text-2xl hover:bg-blue-700 outline-none shadow-sm">القسم التالي</button>` : ''}</div>`;
        }

        function updateFinalResultVisibility() {
            const wrapper = document.getElementById('global-res-wrapper');
            if (!wrapper) return;
            if (isAllComplete()) {
                let s = 0, q = 0;
                appData.sections.filter(x => x.type !== 'info').forEach(x => { s += calculateScore(x.id); q += (x.questions?x.questions.length:x.items.length); });
                document.getElementById('global-final-score').textContent = `${toArabicNum(s)} / ${toArabicNum(q)}`;
                wrapper.classList.replace('grid-0', 'grid-1');
            } else wrapper.classList.replace('grid-1', 'grid-0');
        }

        function resetSection(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if(sectionId === 'sort') state.sort = { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false };
            else { 
                sec.questions.forEach(q => { delete state.mcq.answers[q.id]; delete state.mcq.hints[q.id]; });
                state.mcq.shuffled[sectionId] = null;
            }
            initSectionShuffle(sectionId); renderTabs(); renderContent(); updateFinalResultVisibility(); setTimeout(scrollToTabs, 50);
        }

        function startOver() {
            state.mcq = { answers: {}, hints: {}, shuffled: {} };
            state.sort = { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false };
            switchSection(0, true);
        }

        function shuffleArray(a) { let n = [...a]; for (let i = n.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [n[i], n[j]] = [n[j], n[i]]; } return n; }

        window.onload = () => switchSection(0, false);
    </script>
</body>
</html>
