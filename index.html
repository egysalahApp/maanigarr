        }

        /* حركات الظهور والسقوط للصناديق */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fly-out { animation: flyOut 0.4s ease-in forwards; }
        @keyframes flyOut {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(120px) scale(0.5); opacity: 0; }
        }

        /* حركة التمدد السلس للمعالجة البصرية بدون أي اهتزاز */
        .smooth-expand { animation: smoothExpand 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; overflow: hidden; }

            0% { max-height: 0; opacity: 0; }
            100% { max-height: 250px; opacity: 1; }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {

            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        // ================= الأداة اللغوية =================
        const toArabicNum = (num) => {
            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(num).split('').map(c => arabicNumbers[c] || c).join('');
        };

        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        // ================= كائن التطبيق الرئيسي =================
        const App = {
            state: {
                activeTab: '',
                progress: {},
                sectionData: {} 
            },

            init() {
                // ضبط عنوان الصفحة من البيانات
                document.title = APP_DATA.pageTitle;
                
                // تهيئة البيانات والتبويب الافتراضي
                if (APP_DATA.sections.length > 0) {
                    this.state.activeTab = APP_DATA.sections[0].id;
                }
                
                this.initSectionData();
                this.renderLayout();
                this.updateUI();
            },

            // تهيئة بيانات الحالة الديناميكية بناءً على APP_DATA
            initSectionData() {
                this.state.progress = {};
                this.state.sectionData = {};

                APP_DATA.sections.forEach(sec => {
                    if (sec.type === 'intro') {
                        this.state.progress[sec.id] = { answered: 0, total: 0, score: 0 };
                    } 
                    else if (sec.type === 'mcq') {
                        this.state.progress[sec.id] = { answered: 0, total: sec.questions.length, score: 0 };
                        // الأسئلة ثابتة، الخيارات متغيرة
                        this.state.sectionData[sec.id] = sec.questions.map(q => {
                            let opts = q.options.map((opt, oIdx) => ({ text: opt, isCorrect: oIdx === q.correct }));
                            return {
                                originalQuestion: q,
                                options: shuffleArray(opts),
                                answered: false, selectedOption: null, showHint: false
                            };
                        });
                    } 
                    else if (sec.type === 'true_false') {
                        this.state.progress[sec.id] = { answered: 0, total: sec.questions.length, score: 0 };
                        this.state.sectionData[sec.id] = sec.questions.map(q => {
                            let opts = [
                                { text: "صواب", isCorrect: true === q.answer },
                                { text: "خطأ", isCorrect: false === q.answer }
                            ];
                            return {
                                originalQuestion: q,
                                options: shuffleArray(opts),
                                answered: false, selectedOption: null, showHint: false
                            };
                        });
                    } 
                    else if (sec.type === 'spotting') {
                        this.state.progress[sec.id] = { answered: 0, total: sec.questions.length, score: 0 };
                        // الأسئلة ثابتة
                        this.state.sectionData[sec.id] = sec.questions.map(q => ({
                            originalQuestion: q, answered: false, selectedIndex: null, showHint: false
                        }));
                    } 
                    else if (sec.type === 'classify') {
                        this.state.progress[sec.id] = { answered: 0, total: sec.questions.length, score: 0 };
                        let placedItems = {};
                        sec.categories.forEach(c => placedItems[c.id] = []);
                        
                        // القسم الوحيد الذي تتغير فيه الأسئلة عشوائياً
                        this.state.sectionData[sec.id] = {
                            questions: shuffleArray(sec.questions).map(q => ({ originalQuestion: q, showHint: false })),
                            currentIndex: 0, 
                            status: 'idle', 
                            placedItems: placedItems, 
                            animatingOut: false
                        };
                    }
                    else if (sec.type === 'sort') {
                        this.state.progress[sec.id] = { answered: 0, total: sec.questions.length, score: 0 };
                        // الأسئلة ثابتة، الخيارات متغيرة
                        this.state.sectionData[sec.id] = {
                            questions: sec.questions.map(q => {
                                let opts = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct }));
                                return { originalQuestion: q, options: shuffleArray(opts), showHint: false };
                            }),
                            currentIndex: 0, status: 'idle', animatingOut: false
                        };
                    }
                });
            },

                        <div id="scroll-target"></div>
                        <h1 class="text-center text-2xl md:text-3xl font-semibold text-slate-700 pt-6 mb-6 bg-transparent">
                            ${APP_DATA.pageTitle.split('|')[0]}
                        </h1>

                        ${sectionsContainers}
                        <div id="final-evaluation-container"></div>
                    </main>

                    <footer class="mt-auto py-8 bg-white border-t border-slate-200 text-center">
                        <a href="${APP_DATA.youtubeLink}" target="_blank" rel="noopener noreferrer" class="text-slate-400 text-sm font-medium block w-full">
                            ${APP_DATA.copyright}
                        </a>
                    </footer>
                `;
            },

            updateUI() {
                this.updateTabs();
                
                // إظهار القسم النشط وتحديث محتواه
                APP_DATA.sections.forEach(sec => {
                    const el = document.getElementById(`section-${sec.id}`);
                    if (el) {
                        if (this.state.activeTab === sec.id) {
                            el.className = 'block';
                            el.innerHTML = this.renderSection(sec);
                        } else {
                            el.className = 'hidden';
                        }
                    }
                });

                this.checkFinalEvaluation();
            },

            updateTabs() {
                const wrapper = document.getElementById('tabs-wrapper');
                let html = '';
                
                APP_DATA.sections.forEach(section => {
                    const isActive = this.state.activeTab === section.id;
                    const secProgress = this.state.progress[section.id];
                    const isDone = secProgress.total > 0 && secProgress.answered === secProgress.total;
                    
                    let activeClass = isActive ? `bg-${section.theme}-600 text-white border-${section.theme}-600 shadow-md` : "bg-white text-slate-600 border-slate-200";

                    html += `
                        <button id="tab-${section.id}" type="button" onclick="App.handleTabChange('${section.id}')" 
                                class="shrink-0 whitespace-nowrap px-6 py-2 rounded-full font-semibold text-lg md:text-xl border-2 transition-all flex items-center justify-center gap-2 md:hover:bg-slate-50 ${activeClass}">
                            ${section.title}
                            ${isDone && !isActive ? ICONS.checkCircle : ''}
                        </button>
                    `;
                });
                
                wrapper.innerHTML = html;

                const currentProgress = this.state.progress[this.state.activeTab];
                const progressPercent = currentProgress && currentProgress.total > 0 ? (currentProgress.answered / currentProgress.total) * 100 : 0;
                const progressBar = document.getElementById('progress-bar');
                const theme = APP_DATA.sections.find(s => s.id === this.state.activeTab).theme;
                
                progressBar.className = `h-full transition-all duration-500 ease-out bg-${theme}-500`;
                progressBar.style.width = `${progressPercent}%`;
            },

            // ================= دوال التوليد (Rendering) =================
            
            // الدالة الموزعة للأنشطة بناء على النوع
            renderSection(sectionData) {
                switch(sectionData.type) {
                    case 'intro': return this.renderIntro(sectionData);
                    case 'mcq': 
                    case 'true_false': return this.renderStandardSection(sectionData);
                    case 'spotting': return this.renderStandardSection(sectionData);
                    case 'classify': return this.renderClassify(sectionData);
                    case 'sort': return this.renderSort(sectionData);
                    default: return '';
                }
            },

            renderIntro(sectionData) {
                let headerHTML = '';
                
                if (sectionData.description) {
                    headerHTML += `
                        <div class="text-center mb-8 fade-in">
                            <p class="text-lg md:text-xl text-${sectionData.theme}-800 font-semibold bg-${sectionData.theme}-50 bg-opacity-60 p-4 md:p-5 rounded-2xl shadow-sm inline-block w-full">
                                ${sectionData.description}
                            </p>
                        </div>
                    `;
                }

                let gridHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full fade-in">';
                sectionData.content.forEach(block => {
                    gridHTML += `
                        <div class="bg-white border-2 border-${block.theme}-200 rounded-[2rem] p-6 md:p-8 flex flex-col items-center text-center md:hover:-translate-y-2 md:hover:shadow-xl transition-all duration-300 group shadow-sm">
                            
                            <!-- أيقونة الصندوق (بدون حدود) -->
                            <div class="bg-${block.theme}-100 w-16 h-16 md:w-20 md:h-20 flex items-center justify-center rounded-2xl mb-6 shadow-sm md:group-hover:scale-110 md:group-hover:-rotate-3 transition-transform duration-300">
                                <span class="text-3xl md:text-4xl drop-shadow-sm">${block.icon}</span>
                            </div>
                            
                            <!-- العنوان والشرح -->
                            <h3 class="text-2xl md:text-3xl font-bold text-slate-800 mb-4">${block.title}</h3>
                            <p class="text-lg md:text-xl text-slate-600 leading-relaxed mb-8 flex-grow">${block.desc}</p>
                            
                            <!-- صندوق المثال السفلي (بطاقة ناعمة بدون حدود) -->
                            <div class="w-full bg-${block.theme}-50/80 p-5 rounded-2xl flex flex-col justify-center">
                                <span class="text-sm font-bold text-${block.theme}-600 mb-2 block">أمثلة وتوضيح:</span>
                                <p class="text-lg md:text-xl font-bold text-${block.theme}-900 leading-relaxed">${block.examples}</p>
                            </div>
                            
                        </div>
                    `;
                });
                gridHTML += '</div>';

                return `
                    <div class="max-w-4xl mx-auto space-y-6">
                        ${headerHTML}
                        ${gridHTML}
                        <div class="flex justify-center mt-12 pt-4 fade-in">
                            <button onclick="App.handleNextSection()" class="bg-${sectionData.theme}-600 md:hover:bg-${sectionData.theme}-700 text-white font-semibold text-xl md:text-2xl py-4 px-12 rounded-full shadow-lg flex items-center gap-3 active:scale-95 transition-all duration-300">
                                هيا نبدأ التدريبات ${ICONS.arrowLeft}
                            </button>
                        </div>
                    </div>
                `;
            },

            // تدير قسم الخيارات المتعددة، الصح والخطأ، وصياد الكلمات
            renderStandardSection(sectionData) {
                const sectionId = sectionData.id;
                const progress = this.state.progress[sectionId];
                const isComplete = progress.total > 0 && progress.answered === progress.total;
                const questions = this.state.sectionData[sectionId];
                
                let html = '<div class="fade-in">';

                if (sectionData.description) {
                    html += `
                        <div class="text-center mb-8">
                            <p class="text-lg md:text-xl text-${sectionData.theme}-800 font-semibold bg-${sectionData.theme}-50 bg-opacity-60 p-4 md:p-5 rounded-2xl shadow-sm inline-block w-full">
                                ${sectionData.description}
                            </p>
                        </div>
                    `;
                }
                
                questions.forEach((qState, idx) => {
                    html += `<div id="${sectionId}-wrapper-${idx}">`;
                    if (sectionData.type === 'spotting') {
                        html += this.renderSpottingCard(qState, idx, sectionData.theme, sectionId);
                    } else {
                        html += this.renderQuestionCard(qState, idx, sectionId, sectionData.theme, sectionData.type);
                    }
                    html += `</div>`;
                });

                if (isComplete) {
                    html += `
                        <div class="mt-12 p-8 md:p-10 bg-white border-2 border-${sectionData.theme}-200 rounded-2xl shadow-sm text-center max-w-2xl mx-auto w-full">
                            <h3 class="text-2xl md:text-3xl font-semibold text-slate-700 mb-6">نتيجتك في قسم (${sectionData.title})</h3>
                            <div class="text-4xl md:text-5xl font-bold text-${sectionData.theme}-600 flex items-center justify-center gap-3">
                                <span>${toArabicNum(progress.score)}</span>
                                <span class="text-2xl md:text-3xl text-slate-400 font-medium mt-1">من</span>
                                <span>${toArabicNum(progress.total)}</span>
                            </div>
                        </div>
                    `;
                }
                
                html += '</div>'; 
                html += this.renderSectionFooterControls(sectionId, isComplete);
                return html;
            },

            renderQuestionCard(qState, idx, sectionId, theme, type) {
                const { originalQuestion: q, options, answered, selectedOption, showHint } = qState;
                const isSelectedCorrect = selectedOption && selectedOption.isCorrect;
                
                const hintFadeClass = qState.hintAnimate ? 'smooth-expand' : '';
                const answerFadeClass = qState.answerAnimate ? 'smooth-expand' : '';
                
                let ringClass = answered ? (isSelectedCorrect ? 'ring-2 ring-emerald-400' : 'ring-2 ring-rose-400') : '';

                let optionsHTML = '';
                options.forEach((opt, optIdx) => {
                    let btnClass = `w-full p-4 md:p-5 rounded-xl border-2 transition-all font-semibold text-xl md:text-2xl flex items-center gap-3 ${type === 'mcq' ? 'justify-start' : 'justify-center'} `;
                    
                    if (!answered) {
                        btnClass += `border-slate-200 bg-white text-slate-600 md:hover:bg-slate-50 cursor-pointer active:scale-95`;
                    } else {
                        if (opt.isCorrect) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm";
                        else if (selectedOption === opt) btnClass += "bg-rose-50 border-rose-500 text-rose-800 shadow-sm";
                        else btnClass += "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                        btnClass += " cursor-default";
                    }

                    let numberingHTML = '';
                    if (type === 'mcq') {
                        let numClass = `w-8 h-8 md:w-10 md:h-10 flex items-center justify-center rounded-full text-xl md:text-2xl font-bold shrink-0 transition-all `;
                        
                        if (!answered) {
                            numClass += `bg-white text-${theme}-600 shadow-md border border-slate-100`;
                        } else {
                            if (opt.isCorrect) numClass += `bg-emerald-500 text-white shadow-sm`;
                            else if (selectedOption === opt) numClass += `bg-rose-500 text-white shadow-sm`;
                            else numClass += `bg-slate-100 text-slate-400 border border-slate-200`;
                        }
                        numberingHTML = `<div class="${numClass}">${toArabicNum(optIdx + 1)}</div>`;
                    }

                    optionsHTML += `
                        <button ${answered ? 'disabled' : ''} onclick="App.handleAnswer('${sectionId}', ${idx}, ${optIdx})" class="${btnClass}">
                            ${numberingHTML}
                            <span class="relative z-10 flex-grow text-right">${opt.text}</span>
                            ${answered && opt.isCorrect ? ICONS.checkCircle : ''}
                            ${answered && selectedOption === opt && !opt.isCorrect ? ICONS.xCircle : ''}
                        </button>
                    `;
                });

                return `
                    <div id="${sectionId}-q-${idx}" class="bg-white rounded-2xl p-5 md:p-6 shadow-sm border border-slate-200 mb-8 relative transition-colors duration-300 flex flex-col justify-start ${ringClass}">
                        <div class="bg-slate-50 p-4 md:p-6 rounded-xl border border-slate-100 mb-6 w-full mx-auto">
                            <div class="flex items-center justify-between mb-2 md:mb-3">
                                <span class="text-${theme}-600 font-bold text-lg md:text-xl">
                                    السؤال ${toArabicNum(idx + 1)}
                                </span>
                                <button onclick="App.toggleHint('${sectionId}', ${idx})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-lg md:text-xl font-bold transition-all active:scale-95 md:hover:bg-amber-50 text-amber-500">
                                    💡 تلميح
                                </button>
                            </div>
                            <h3 class="text-2xl md:text-3xl font-semibold text-slate-800 leading-snug whitespace-pre-line text-right">${q.text}</h3>

                            <div class="${showHint ? `block w-full ${hintFadeClass}` : 'hidden'}">
                                <div class="mt-4 bg-amber-50 text-amber-900 p-4 rounded-xl text-xl font-medium border border-amber-200 flex gap-2 items-start text-right">
                                    <span class="text-amber-500 font-semibold mt-1 shrink-0">💡</span>
                                    <span class="leading-relaxed">${q.hint}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="grid gap-3 mx-auto w-full max-w-md flex-grow grid-cols-1 content-start">
                            ${optionsHTML}
                        </div>
                        
                        <div class="${answered ? `block w-full ${answerFadeClass}` : 'hidden'}">
                            <div class="mt-6 p-5 rounded-xl border text-right ${isSelectedCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
                                <div class="flex items-center justify-start gap-2 mb-3 font-bold text-xl md:text-2xl ${isSelectedCorrect ? 'text-emerald-700' : 'text-rose-700'}">
                                    ${isSelectedCorrect ? ICONS.checkCircleLarge : ICONS.xCircleLarge}
                                    <span>${isSelectedCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}</span>
                                </div>
                                <div class="text-xl md:text-2xl font-semibold leading-relaxed ${isSelectedCorrect ? 'text-emerald-800' : 'text-rose-800'} pr-1">
                                    ${q.explanation}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderSpottingCard(qState, idx, theme, sectionId) {
                const { originalQuestion: q, answered, selectedIndex, showHint } = qState;
                const isCorrectAnswer = selectedIndex === q.correctIndex;
                const hintFadeClass = qState.hintAnimate ? 'smooth-expand' : '';
                const answerFadeClass = qState.answerAnimate ? 'smooth-expand' : '';
                let ringClass = answered ? (isCorrectAnswer ? 'ring-2 ring-emerald-400' : 'ring-2 ring-rose-400') : '';

                let wordsHTML = '';
                q.words.forEach((word, wIdx) => {
                    const isSelected = selectedIndex === wIdx;
                    const isCorrect = wIdx === q.correctIndex;
                    let wordClass = "px-4 md:px-6 py-3 md:py-4 text-2xl md:text-3xl font-bold rounded-xl transition-all duration-300 select-none ";
                    
                    if (!answered) {
                        wordClass += `bg-white border-2 border-slate-200 text-slate-700 md:hover:border-${theme}-300 md:hover:bg-${theme}-50 md:hover:-translate-y-1 md:hover:shadow-md cursor-pointer active:scale-95`;
                    } else {
                        if (isSelected && isCorrect) wordClass += "bg-emerald-500 text-white border-2 border-emerald-600 shadow-md scale-105";
                        else if (isSelected && !isCorrect) wordClass += "bg-rose-500 text-white border-2 border-rose-600 shadow-md scale-105";
                        else if (!isSelected && isCorrect) wordClass += "bg-emerald-50 text-emerald-700 border-2 border-emerald-300 ring-2 ring-emerald-200";
                        else wordClass += "bg-slate-50 border-2 border-slate-100 text-slate-400 opacity-50 cursor-default";
                    }

                    wordsHTML += `<span onclick="App.handleSpottingClick('${sectionId}', ${idx}, ${wIdx})" class="${wordClass}">${word}</span>`;
                });

                return `
                    <div id="${sectionId}-q-${idx}" class="bg-white rounded-2xl p-5 md:p-6 shadow-sm border border-slate-200 mb-8 relative transition-colors duration-300 flex flex-col justify-start ${ringClass}">
                        <div class="bg-slate-50 p-4 md:p-6 rounded-xl border border-slate-100 mb-6 w-full mx-auto">
                            <div class="flex items-center justify-between mb-2 md:mb-3">
                                <span class="text-${theme}-600 font-bold text-lg md:text-xl">
                                    السؤال ${toArabicNum(idx + 1)}
                                </span>
                                <button onclick="App.toggleHint('${sectionId}', ${idx})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-lg md:text-xl font-bold transition-all active:scale-95 md:hover:bg-amber-50 text-amber-500">
                                    💡 تلميح
                                </button>
                            </div>
                            <p class="text-right text-slate-700 font-semibold text-xl md:text-2xl leading-snug">انقر على الكلمة الصحيحة في الجملة الآتية:</p>
                            <div class="${showHint ? `block w-full ${hintFadeClass}` : 'hidden'}">
                                <div class="mt-4 bg-amber-50 text-amber-900 p-4 rounded-xl text-xl font-medium border border-amber-200 flex gap-2 items-start text-right">
                                    <span class="text-amber-500 font-semibold mt-1 shrink-0">💡</span>
                                    <span class="leading-relaxed">${q.hint}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-wrap justify-center items-center gap-3 md:gap-4 leading-loose mx-auto w-full max-w-lg">
                            ${wordsHTML}
                        </div>
                        <div class="${answered ? `block w-full ${answerFadeClass}` : 'hidden'}">
                            <div class="mt-6 p-5 rounded-xl border text-right ${isCorrectAnswer ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
                                <div class="flex items-center justify-start gap-2 mb-3 font-bold text-xl md:text-2xl ${isCorrectAnswer ? 'text-emerald-700' : 'text-rose-700'}">
                                    ${isCorrectAnswer ? ICONS.checkCircleLarge : ICONS.xCircleLarge}
                                    <span>${isCorrectAnswer ? 'إجابة صحيحة' : 'إجابة خاطئة'}</span>
                                </div>
                                <div class="text-xl md:text-2xl font-semibold leading-relaxed ${isCorrectAnswer ? 'text-emerald-800' : 'text-rose-800'} pr-1">
                                    ${q.explanation}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            // --- قسم صناديق المعاني بالهندسة الجديدة المدمجة (Unified Card + Top Pinning) ---
            renderClassify(sectionData) {
                const sectionId = sectionData.id; 
                const theme = sectionData.theme; 
                const state = this.state.sectionData[sectionId]; 
                const { questions, currentIndex, status, placedItems, animatingOut } = state; 
                const isComplete = currentIndex >= questions.length;
                
                const isInitialState = currentIndex === 0 && status === 'idle' && !animatingOut;
                const sectionFadeClass = isInitialState ? 'fade-in' : '';

                let html = ''; 
                const currentQState = isComplete ? null : questions[currentIndex]; 
                const currentQuestion = isComplete ? null : currentQState.originalQuestion; 
                const showHint = isComplete ? false : currentQState.showHint; 
                const hintFadeClass = (currentQState && currentQState.hintAnimate) ? 'smooth-expand' : ''; 
                const shakeClass = status === 'incorrect' ? 'shake' : '';
                
                let boxesHTML = ''; 
                sectionData.categories.forEach(cat => {
                    const boxTheme = cat.theme || 'sky'; 
                    
                    const placedHtml = placedItems[cat.id].map(item => `
                        <div class="mt-3 p-3 md:p-4 rounded-xl text-xl md:text-2xl font-bold bg-white border-r-4 border-${boxTheme}-400 shadow-md leading-snug text-center text-slate-800 relative z-10">
                            ${item.text}
                        </div>
                    `).join('');
                    
                    let boxClass = `flex flex-col w-full pt-6 pb-5 px-5 md:px-6 rounded-[2.5rem] bg-white/50 backdrop-blur-sm border-2 border-slate-300 shadow-[inset_0_2px_8px_rgba(0,0,0,0.03)] min-h-[14rem] relative overflow-hidden opacity-95 `;

                    const headerIcon = ICONS.tray.replace('w-8 h-8 md:w-12 md:h-12 mb-2 opacity-80', `w-6 h-6 md:w-8 md:h-8 text-${boxTheme}-600`);
                    const watermarkIcon = ICONS.tray.replace('w-8 h-8 md:w-12 md:h-12 mb-2 opacity-80', 'w-full h-full');
                    
                    boxesHTML += `<div class="${boxClass}">
                        <div class="absolute top-0 left-0 w-full h-2 bg-${boxTheme}-400 opacity-60 z-10"></div>
                        <div class="absolute -bottom-10 -left-10 w-40 h-40 text-${boxTheme}-200 opacity-10 transform -rotate-12 scale-150 pointer-events-none z-0 flex items-center justify-center">
                            ${watermarkIcon}
                        </div>
                        <div class="flex flex-col items-center justify-center w-full relative z-10 mb-1">
                            <div class="flex items-center justify-center gap-3">
                                <div class="bg-white shadow-sm rounded-full p-2 border border-slate-100 flex items-center justify-center">
                                    ${headerIcon}
                                </div>
                                <h3 class="font-bold text-2xl md:text-3xl text-slate-900">${cat.label}</h3>
                            </div>
                        </div>
                        <div class="h-px bg-slate-300 w-2/3 mx-auto my-3 relative z-10"></div>
                        <div class="flex flex-col gap-2 flex-grow relative z-10">
                            ${placedHtml}
                        </div>
                    </div>`;
                });

                // 🌟 بناء أزرار الخيارات المدمجة (داخل البطاقة) 🌟
                let actionButtonsHTML = '';
                if (!isComplete) {
                    let buttons = '';
                    sectionData.categories.forEach(cat => {
                        const btnTheme = cat.theme || 'sky';
                        let btnClass = `flex-1 flex flex-col items-center justify-center p-3 md:p-4 border-2 border-${btnTheme}-200 text-${btnTheme}-700 bg-${btnTheme}-50 rounded-xl transition-all duration-300 min-h-[4.5rem] md:min-h-[5rem] `;
                        
                        if (!animatingOut && status !== 'correct') { // الزر قابل للنقر
                            btnClass += `md:hover:border-${btnTheme}-400 md:hover:bg-${btnTheme}-100 md:hover:-translate-y-1 cursor-pointer shadow-sm md:hover:shadow-md active:scale-95`;
                        } else {
                            btnClass += `opacity-60 cursor-default grayscale-[30%]`;
                        }
                        
                        buttons += `
                            <button ${(!animatingOut && status !== 'correct') ? `onclick="App.handleClassifyClick('${sectionId}', '${cat.id}')"` : 'disabled'} class="${btnClass} min-w-[120px]">
                                <span class="font-bold text-base md:text-lg text-center leading-snug">${cat.label}</span>
                            </button>
                        `;
                    });
                    // الأزرار مدمجة بفاصل علوي - محمية بـ pointer-events-none أثناء الحركة
                    actionButtonsHTML = `<div class="flex flex-row w-full gap-2 md:gap-4 relative z-0 flex-wrap justify-center border-t-2 border-slate-100 pt-6 mt-6 ${animatingOut ? 'pointer-events-none' : ''}">${buttons}</div>`;
                }

                html += `<div class="flex flex-col items-center w-full gap-6 ${sectionFadeClass}">`;
                if (sectionData.description) { html += `<div class="text-center w-full"><p class="text-lg md:text-xl text-${theme}-800 font-semibold bg-${theme}-50 bg-opacity-60 p-4 md:p-5 rounded-2xl shadow-sm">${sectionData.description}</p></div>`; }
                
                // 🚀 الحاوية الخارجية: Top Pinning (justify-start py-8 md:py-12) مع مساحة كافية لمنع القفز
                html += `<div class="relative w-full min-h-[38rem] md:min-h-[40rem] bg-slate-50 rounded-3xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-start py-8 md:py-12 px-4 md:px-6">`;
                
                if (currentQuestion) {
                    html += `
                        <!-- 🚀 البطاقة البيضاء المدمجة (تحمل كلاسات الحركة بأكملها) -->
                        <div id="classify-card" class="w-full max-w-3xl bg-white p-5 md:p-8 rounded-3xl shadow-xl border-2 border-slate-200 transform leading-snug flex flex-col justify-start z-10 ${animatingOut ? 'fly-out' : 'fade-in'} ${shakeClass}">
                            
                            <!-- الرأس -->
                            <div class="flex items-center justify-between mb-4 shrink-0">
                                <span class="text-${theme}-600 font-bold text-lg md:text-xl">البطاقة ${toArabicNum(currentIndex + 1)}</span>
                                <button onclick="App.toggleHint('${sectionId}', ${currentIndex})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-lg md:text-xl font-bold transition-all active:scale-95 md:hover:bg-amber-50 text-amber-500">💡 تلميح</button>
                            </div>
                            
                            <span class="block mb-2 text-slate-500 text-sm md:text-base font-medium text-center shrink-0">إلى أي صندوق تنتمي هذه البطاقة؟</span>
                            
                            <!-- 🚀 منطقة السؤال ذات الارتفاع الثابت (تتوسط عمودياً بداخلها) -->
                            <div class="w-full flex items-center justify-center min-h-[8rem] md:min-h-[10rem] my-2">
                                <h3 class="text-3xl md:text-4xl font-bold leading-relaxed text-slate-800 text-center px-2">«${currentQuestion.text}»</h3>
                            </div>
                            
                            <!-- 🚀 هندسة التمدد (Smooth Expand) للتلميحات -->
                            <div class="${showHint ? `block w-full smooth-expand` : 'hidden'} shrink-0 mt-2">
                                <div class="bg-amber-50 text-amber-900 p-4 rounded-xl text-xl font-medium border border-amber-200 flex gap-2 items-start text-right">
                                    <span class="text-amber-500 font-semibold mt-1 shrink-0">💡</span><span class="leading-relaxed">${currentQuestion.hint}</span>
                                </div>
                            </div>
                            
                            <!-- 🚀 هندسة التمدد (Smooth Expand) لرسائل الخطأ -->
                            <div class="${status === 'incorrect' ? 'block w-full smooth-expand' : 'hidden'} shrink-0 mt-4">
                                <div class="p-4 bg-rose-50 border border-rose-200 rounded-xl text-center text-rose-700 text-lg md:text-xl font-bold shadow-sm">⚠️ ${currentQuestion.explanation}</div>
                            </div>

                            <!-- 🚀 أزرار التفاعل المدمجة وتوحيد الحجم -->
                            ${actionButtonsHTML}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex-grow flex items-center justify-center w-full h-[22rem] md:h-[24rem]">
                            <div class="text-3xl md:text-4xl font-bold text-emerald-500 flex flex-col items-center gap-4 fade-in py-6">
                                <span class="text-6xl">🎉</span><span>اكتملت الصناديق بنجاح!</span>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;

                html += `<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 mt-6 mb-10 md:mb-12">${boxesHTML}</div></div>`;
                
                if (isComplete) { const progress = this.state.progress[sectionId]; html += `<div class="mt-12 p-8 md:p-10 bg-white border-2 border-${theme}-200 rounded-2xl shadow-sm text-center fade-in max-w-2xl mx-auto w-full"><h3 class="text-2xl md:text-3xl font-semibold text-slate-700 mb-6">نتيجتك في قسم (${sectionData.title})</h3><div class="text-4xl md:text-5xl font-bold text-${theme}-600 flex items-center justify-center gap-3"><span>${toArabicNum(progress.score)}</span><span class="text-2xl md:text-3xl text-slate-400 font-medium mt-1">من</span><span>${toArabicNum(progress.total)}</span></div></div>`; }
                html += this.renderSectionFooterControls(sectionId, isComplete); return html;
            },

            // --- قسم فرز البطاقات بالهندسة الجديدة المدمجة (Unified Card + Top Pinning) ---
            renderSort(sectionData) {
                const sectionId = sectionData.id;
                const theme = sectionData.theme;
                const state = this.state.sectionData[sectionId];
                const { questions, currentIndex, status, animatingOut } = state;
                const isComplete = currentIndex >= questions.length;
                
                const isInitialState = currentIndex === 0 && status === 'idle' && !animatingOut;

                let html = `<div class="flex flex-col items-center w-full gap-6 ${isInitialState ? 'fade-in' : ''}">`;
                
                const currentQState = isComplete ? null : questions[currentIndex];
                const currentQuestion = isComplete ? null : currentQState.originalQuestion;
                const showHint = isComplete ? false : currentQState.showHint;
                const hintFadeClass = (currentQState && currentQState.hintAnimate) ? 'smooth-expand' : '';
                const shakeClass = status === 'incorrect' ? 'shake' : '';

                if (sectionData.description) {
                    html += `
                        <div class="text-center w-full">
                            <p class="text-lg md:text-xl text-${theme}-800 font-semibold bg-${theme}-50 bg-opacity-60 p-4 md:p-5 rounded-2xl shadow-sm w-full">
                                ${sectionData.description}
                            </p>
                        </div>
                    `;
                }

                // 🌟 بناء أزرار الخيارات المدمجة (داخل البطاقة) 🌟
                let optionsButtonsHTML = '';
                if (!isComplete) {
                    const colors = ['emerald', 'violet', 'cyan', 'teal', 'indigo'];
                    let buttons = '';
                    currentQState.options.forEach((opt, idx) => {
                        const boxTheme = colors[idx % colors.length];
                        let btnClass = `flex-1 flex flex-col items-center justify-center p-3 md:p-4 border-2 rounded-xl transition-all duration-300 border-${boxTheme}-200 text-${boxTheme}-700 bg-${boxTheme}-50 min-h-[4.5rem] md:min-h-[5rem] `;
                        
                        if (!animatingOut && status !== 'correct') { // قابل للنقر
                            btnClass += `md:hover:border-${boxTheme}-400 md:hover:bg-${boxTheme}-100 md:hover:-translate-y-1 cursor-pointer shadow-sm md:hover:shadow-md active:scale-95`;
                        } else {
                            btnClass += `opacity-60 cursor-default grayscale-[30%]`;
                        }
                        
                        buttons += `
                            <button ${(!animatingOut && status !== 'correct') ? `onclick="App.handleDynamicSortClick('${sectionId}', ${idx})"` : 'disabled'} class="${btnClass} min-w-[120px]">
                                <span class="font-bold text-lg md:text-xl text-center leading-snug">${opt.text}</span>
                            </button>
                        `;
                    });
                    // الأزرار مدمجة بفاصل علوي - محمية بـ pointer-events-none أثناء الحركة
                    optionsButtonsHTML = `<div class="flex flex-row w-full gap-2 md:gap-4 relative z-0 flex-wrap justify-center border-t-2 border-slate-100 pt-6 mt-6 ${animatingOut ? 'pointer-events-none' : ''}">${buttons}</div>`;
                }

                // 🚀 الحاوية الخارجية: Top Pinning (justify-start py-8 md:py-12) مع مساحة كافية لمنع القفز
                html += `<div class="relative w-full min-h-[38rem] md:min-h-[40rem] bg-slate-50 rounded-3xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-start py-8 md:py-12 px-4 md:px-6">`;
                        
                if (currentQuestion) {
                    html += `
                        <!-- 🚀 البطاقة البيضاء المدمجة (تحمل كلاسات الحركة بأكملها) -->
                        <div class="w-full max-w-3xl bg-white p-5 md:p-8 rounded-3xl shadow-xl border-2 border-slate-200 transform leading-snug flex flex-col justify-start z-10 ${animatingOut ? 'fly-out' : 'fade-in'} ${shakeClass}">
                            
                            <!-- الرأس -->
                            <div class="flex items-center justify-between mb-4 shrink-0">
                                <span class="text-${theme}-600 font-bold text-lg md:text-xl">
                                    البطاقة ${toArabicNum(currentIndex + 1)}
                                </span>
                                <button onclick="App.toggleHint('${sectionId}', ${currentIndex})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-lg md:text-xl font-bold transition-all active:scale-95 md:hover:bg-amber-50 text-amber-500">
                                    💡 تلميح
                                </button>
                            </div>
                            
                            <!-- 🚀 منطقة السؤال ذات الارتفاع الثابت (تتوسط عمودياً بداخلها) -->
                            <div class="w-full flex items-center justify-center min-h-[8rem] md:min-h-[10rem] my-2">
                                <h3 class="text-3xl md:text-4xl font-bold leading-relaxed text-slate-800 text-center px-2">«${currentQuestion.text}»</h3>
                            </div>
                            
                            <!-- 🚀 هندسة التمدد (Smooth Expand) للتلميحات -->
                            <div class="${showHint ? `block w-full smooth-expand` : 'hidden'} shrink-0 mt-2">
                                <div class="bg-amber-50 text-amber-900 p-4 rounded-xl text-xl font-medium border border-amber-200 flex gap-2 items-start text-right">
                                    <span class="text-amber-500 font-semibold mt-1 shrink-0">💡</span>
                                    <span class="leading-relaxed">${currentQuestion.hint}</span>
                                </div>
                            </div>

                            <!-- 🚀 هندسة التمدد (Smooth Expand) لرسائل الخطأ -->
                            <div class="${status === 'incorrect' ? 'block w-full smooth-expand' : 'hidden'} shrink-0 mt-4">
                                <div class="p-4 bg-rose-50 border border-rose-200 rounded-xl text-center text-rose-700 text-lg md:text-xl font-bold shadow-sm">
                                    ⚠️ إجابة خاطئة! ${currentQuestion.explanation}
                                </div>
                            </div>

                            <!-- 🚀 أزرار التفاعل المدمجة وتوحيد الحجم -->
                            ${optionsButtonsHTML}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex-grow flex items-center justify-center w-full h-[22rem] md:h-[24rem]">
                            <div class="text-3xl md:text-4xl font-bold text-emerald-500 flex flex-col items-center gap-4 fade-in py-6">
                                <span class="text-6xl">🎉</span>
                                <span>اكتمل فرز البطاقات!</span>
                            </div>
                        </div>
                    `;
                }
                
                html += `</div></div>`;

                if (isComplete) {
                    const progress = this.state.progress[sectionId];
                    html += `
                        <div class="mt-12 p-8 md:p-10 bg-white border-2 border-${theme}-200 rounded-2xl shadow-sm text-center fade-in max-w-2xl mx-auto w-full">
                            <h3 class="text-2xl md:text-3xl font-semibold text-slate-700 mb-6">نتيجتك في قسم (${sectionData.title})</h3>
                            <div class="text-4xl md:text-5xl font-bold text-${theme}-600 flex items-center justify-center gap-3">
                                <span>${toArabicNum(progress.score)}</span>
                                <span class="text-2xl md:text-3xl text-slate-400 font-medium mt-1">من</span>
                                <span>${toArabicNum(progress.total)}</span>
                            </div>
                        </div>
                    `;
                }

                html += this.renderSectionFooterControls(sectionId, isComplete);
                return html;
            },

            renderSectionFooterControls(sectionId, isComplete) {
                const sectionData = APP_DATA.sections.find(s => s.id === sectionId);
                const isLast = sectionId === APP_DATA.sections[APP_DATA.sections.length - 1].id;
                
                return `
                    <div class="mt-8 flex flex-col md:flex-row justify-center items-center gap-4 mx-auto w-full">
                        <button onclick="App.handleResetSection('${sectionId}')" class="w-full md:w-auto px-8 py-3 md:py-4 rounded-full font-semibold text-xl md:text-2xl text-slate-600 bg-slate-100 md:hover:bg-slate-200 active:scale-95 transition-transform flex items-center justify-center gap-3">
                            ${ICONS.refresh} إعادة المحاولة
                        </button>

                        ${!isLast ? `
                            <button onclick="App.handleNextSection()" class="w-full md:w-auto px-8 md:px-10 py-3 md:py-4 rounded-full font-semibold text-xl md:text-2xl text-white shadow-md transition-transform flex items-center justify-center gap-3 active:scale-95 md:hover:bg-${sectionData.theme}-700 bg-${sectionData.theme}-600">
                                القسم التالي ${ICONS.arrowLeft}
                            </button>
                        ` : ''}
                    </div>
                `;
            },

            // ================= دوال التفاعل (Event Handlers) =================

            toggleHint(sectionId, idx) {
                const sectionDef = APP_DATA.sections.find(s => s.id === sectionId);
                
                if (sectionDef.type === 'classify' || sectionDef.type === 'sort') {
                    const q = this.state.sectionData[sectionId].questions[idx];
                    q.showHint = !q.showHint;
                    q.hintAnimate = q.showHint; 
                    this.updateUI();
                    q.hintAnimate = false; 
                } else {
                    const qState = this.state.sectionData[sectionId][idx];
                    qState.showHint = !qState.showHint;
                    qState.hintAnimate = qState.showHint; 
                    
                    const cardHtml = sectionDef.type === 'spotting' ? 
                        this.renderSpottingCard(qState, idx, sectionDef.theme, sectionId) :
                        this.renderQuestionCard(qState, idx, sectionId, sectionDef.theme, sectionDef.type);
                        
                    document.getElementById(`${sectionId}-wrapper-${idx}`).innerHTML = cardHtml;
                    qState.hintAnimate = false; 
                }
            },

            handleAnswer(sectionId, qIndex, optIndex) {
                const qState = this.state.sectionData[sectionId][qIndex];
                if (qState.answered) return;
                
                const selectedOption = qState.options[optIndex];
                qState.answered = true;
                qState.selectedOption = selectedOption;
                qState.answerAnimate = true; 
                
                this.recordProgress(sectionId, selectedOption.isCorrect);
                
                const progress = this.state.progress[sectionId];
                if (progress.answered === progress.total) {
                    this.updateUI();
                } else {
                    const sectionDef = APP_DATA.sections.find(s => s.id === sectionId);
                    document.getElementById(`${sectionId}-wrapper-${qIndex}`).innerHTML = this.renderQuestionCard(qState, qIndex, sectionId, sectionDef.theme, sectionDef.type);
                    this.updateTabs();
                    this.checkFinalEvaluation();
                }
                qState.answerAnimate = false; 
            },

            handleSpottingClick(sectionId, qIndex, wIndex) {
                const qState = this.state.sectionData[sectionId][qIndex];
                if (qState.answered) return;
                
                qState.answered = true;
                qState.selectedIndex = wIndex;
                qState.answerAnimate = true; 
                
                const isCorrect = wIndex === qState.originalQuestion.correctIndex;
                this.recordProgress(sectionId, isCorrect);
                
                const progress = this.state.progress[sectionId];
                if (progress.answered === progress.total) {
                    this.updateUI();
                } else {
                    const sectionDef = APP_DATA.sections.find(s => s.id === sectionId);
                    document.getElementById(`${sectionId}-wrapper-${qIndex}`).innerHTML = this.renderSpottingCard(qState, qIndex, sectionDef.theme, sectionId);
                    this.updateTabs();
                    this.checkFinalEvaluation();
                }
                qState.answerAnimate = false; 
            },

            handleClassifyClick(sectionId, categoryId) {
                const state = this.state.sectionData[sectionId]; 
                if (state.status === 'correct' || state.animatingOut) return;
                
                const currentQState = state.questions[state.currentIndex]; 
                const currentQ = currentQState.originalQuestion; 
                const isCorrect = categoryId === currentQ.categoryId;
                
                if (isCorrect) { 
                    const isFirstAttempt = state.status === 'idle'; 
                    this.state.progress[sectionId].answered++; 
                    if (isFirstAttempt) this.state.progress[sectionId].score++; 
                    
                    state.status = 'correct'; 
                    state.animatingOut = true; 
                    this.updateUI(); 
                    
                    setTimeout(() => { 
                        state.placedItems[categoryId].push(currentQ); 
                        state.currentIndex++; 
                        state.status = 'idle'; 
                        state.animatingOut = false; 
                        this.updateUI(); 
                    }, 400); 
                } else { 
                    state.status = 'incorrect'; 
                    this.updateUI(); 
                }
            },

            handleDynamicSortClick(sectionId, optIndex) {
                const state = this.state.sectionData[sectionId];
                if (state.status === 'correct' || state.animatingOut) return;

                const currentQState = state.questions[state.currentIndex];
                const isCorrect = currentQState.options[optIndex].isCorrect;
                
                if (isCorrect) {
                    const isFirstAttempt = state.status === 'idle';
                    
                    this.state.progress[sectionId].answered++;
                    if (isFirstAttempt) {
                        this.state.progress[sectionId].score++;
                    }

                    state.status = 'correct';
                    state.animatingOut = true;
                    this.updateUI();
                    
                    setTimeout(() => {
                        state.currentIndex++;
                        state.status = 'idle';
                        state.animatingOut = false;
                        this.updateUI();
                    }, 400); 
                } else {
                    state.status = 'incorrect';
                    this.updateUI();
                }
            },

            recordProgress(sectionId, isCorrect) {
                this.state.progress[sectionId].answered++;
                if (isCorrect) this.state.progress[sectionId].score++;
            },

            // ================= دوال التصفح وإعادة الضبط =================

            scrollToContent() {
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        const target = document.getElementById('scroll-target');
                        if (target) {
                            const stickyTabs = document.getElementById('sticky-tabs-container');
                            const headerOffset = stickyTabs ? stickyTabs.offsetHeight : 80;
                            const elementPosition = target.getBoundingClientRect().top;
                            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                            window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                        }
                    }, 30); 
                });
            },

            scrollTabIntoView(tabId) {
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        const tabBtn = document.getElementById(`tab-${tabId}`);
                        const container = document.getElementById('tabs-container');
                        if (tabBtn && container) {
                            const containerRect = container.getBoundingClientRect();
                            const btnRect = tabBtn.getBoundingClientRect();
                            if (tabId === APP_DATA.sections[0].id) {
                                const scrollDelta = (btnRect.right - containerRect.right) + 16;
                                container.scrollBy({ left: scrollDelta, behavior: 'smooth' });
                            } else {
                                const scrollDelta = (btnRect.left + btnRect.width / 2) - (containerRect.left + containerRect.width / 2);
                                container.scrollBy({ left: scrollDelta, behavior: 'smooth' });
                            }
                        }
                    }, 30);
                });
            },

            handleTabChange(tabId) {
                this.state.activeTab = tabId;
                this.updateUI();
                this.scrollToContent();
                this.scrollTabIntoView(tabId);
            },

            handleNextSection() {
                const currentIndex = APP_DATA.sections.findIndex(s => s.id === this.state.activeTab);
                if (currentIndex < APP_DATA.sections.length - 1) {
                    this.handleTabChange(APP_DATA.sections[currentIndex + 1].id);
                }
            },

            handleResetSection(sectionId) {
                const secDef = APP_DATA.sections.find(s => s.id === sectionId);
                this.state.progress[sectionId].answered = 0;
                this.state.progress[sectionId].score = 0;
                
                if (secDef.type === 'mcq' || secDef.type === 'true_false' || secDef.type === 'spotting') {
                    // الأسئلة ثابتة، الخيارات متغيرة
                    let newData = secDef.questions.map(q => {
                        let options = [];
                        if (secDef.type === 'mcq') {
                            options = q.options.map((opt, oIdx) => ({ text: opt, isCorrect: oIdx === q.correct }));
                            options = shuffleArray(options);
                        } else if (secDef.type === 'true_false') {
                            options = [
                                { text: "صواب", isCorrect: true === q.answer },
                                { text: "خطأ", isCorrect: false === q.answer }
                            ];
                            options = shuffleArray(options);
                        }
                        return { originalQuestion: q, options, answered: false, selectedOption: null, selectedIndex: null, showHint: false };
                    });
                    this.state.sectionData[sectionId] = newData;
                } else if (secDef.type === 'classify') {
                    let placedItems = {};
                    secDef.categories.forEach(c => placedItems[c.id] = []);
                    // القسم الوحيد الذي تتغير فيه الأسئلة عشوائياً
                    this.state.sectionData[sectionId] = {
                        questions: shuffleArray(secDef.questions).map(q => ({ originalQuestion: q, showHint: false })),
                        currentIndex: 0, 
                        status: 'idle', 
                        placedItems: placedItems, 
                        animatingOut: false
                    };
                } else if (secDef.type === 'sort') {
                    // الأسئلة ثابتة، الخيارات متغيرة
                    this.state.sectionData[sectionId] = {
                        questions: secDef.questions.map(q => {
                            let opts = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct }));
                            return { originalQuestion: q, options: shuffleArray(opts), showHint: false };
                        }),
                        currentIndex: 0, status: 'idle', animatingOut: false
                    };
                }
                
                this.updateUI();
                this.scrollToContent();
            },

            handleGlobalRestart() {
                this.initSectionData();
                if (APP_DATA.sections.length > 0) this.state.activeTab = APP_DATA.sections[0].id;
                this.updateUI();
                this.scrollTabIntoView(this.state.activeTab);
                requestAnimationFrame(() => {
                    const header = document.getElementById('main-header');
                    const targetTop = header ? header.offsetHeight : 80;
                    window.scrollTo({ top: targetTop, behavior: 'smooth' });
                });
            },

            checkFinalEvaluation() {
                const scorableSections = APP_DATA.sections.filter(s => s.type !== 'intro');
                if (scorableSections.length === 0) return;

                const isAllComplete = scorableSections.every(s => {
                    const p = this.state.progress[s.id];
                    return p && p.total > 0 && p.answered === p.total;
                });

                const container = document.getElementById('final-evaluation-container');
                const activeSecDef = APP_DATA.sections.find(s => s.id === this.state.activeTab);
                
                if (isAllComplete && activeSecDef.type !== 'intro') {
                    let totalScore = 0, totalQuestions = 0;
                    scorableSections.forEach(s => {
                        totalScore += this.state.progress[s.id].score;
                        totalQuestions += this.state.progress[s.id].total;
                    });

                    const percentage = Math.round((totalScore / totalQuestions) * 100);
                    
                    let message = "", color = "";
                    if (percentage < 60) { message = "تحتاج إلى مزيد من التدريب، لا تيأس وحاول مرة أخرى!"; color = "text-rose-600"; }
                    else if (percentage < 85) { message = "أداء رائع! مستواك جيد جدًا."; color = "text-violet-600"; }
                    else { message = "أداء استثنائي! أنت بطل حقيقي وخبير في هذا الدرس."; color = "text-emerald-600"; }

                    container.innerHTML = `
                        <div id="final-eval-box" class="mt-12 bg-white p-8 md:p-12 rounded-3xl shadow-lg border-2 border-amber-200 text-center fade-in">
                            ${ICONS.medal}
                            <h2 class="text-3xl md:text-4xl font-bold text-slate-700 mb-6">التقييم النهائي</h2>
                            <div class="text-6xl md:text-7xl font-bold mb-8 text-slate-700 flex items-center justify-center gap-4">
                                <span class="${color}">${toArabicNum(totalScore)}</span>
                                <span class="text-slate-400 text-3xl md:text-4xl font-medium mt-2">من</span>
                                <span class="text-slate-500">${toArabicNum(totalQuestions)}</span>
                            </div>
                            <div class="inline-block bg-amber-100 text-amber-800 px-6 py-2 rounded-full font-semibold text-xl md:text-2xl mb-6">
                                النسبة المئوية: ${toArabicNum(percentage)}%
                            </div>
                            <p class="text-xl md:text-2xl font-semibold leading-relaxed ${color} mb-10">${message}</p>
                            <button onclick="App.handleGlobalRestart()" class="px-8 md:px-10 py-3 md:py-4 rounded-full font-semibold text-xl md:text-2xl text-white bg-slate-700 md:hover:bg-slate-800 shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-3 mx-auto">
                                ${ICONS.refresh} ابدأ من جديد
                            </button>
                        </div>
                    `;
                } else {
                    container.innerHTML = '';
                }
            }
        };

        // تشغيل التطبيق فور تحميل المستند
        document.addEventListener('DOMContentLoaded', () => {
            try {
                if ('scrollRestoration' in history) {
                    history.scrollRestoration = 'manual';
                }
                window.scrollTo(0, 0);
            } catch (error) {
                console.warn("تم تجاهل ضبط التمرير.", error);
            }

            App.init();
        });

    </script>
</body>
</html>
