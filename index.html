        let state = {
            mcq: { answers: {}, hints: {}, shuffled: {} },
            sort: { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false },
            boxes: { currentItemIdx: 0, shuffledItems: null, feedbackActive: false, placedItems: [[], [], [], []] }
        };

        function scrollToTabs() {
            requestAnimationFrame(() => {
                const header = document.getElementById('page-header');
                const targetY = header ? header.getBoundingClientRect().height : 0;
                window.scrollTo({ top: targetY, behavior: 'smooth' });
            });
        }

        function centerTabHorizontal(tabEl, isFirst = false) {
            if (!tabEl) return;
            const container = document.getElementById('tabs-container');
            requestAnimationFrame(() => {
                const tabRect = tabEl.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                
                if (isFirst) {
                    const diff = tabRect.right - containerRect.right;
                    container.scrollBy({ left: diff, behavior: 'smooth' });
                } else {
                    const diff = (tabRect.left + tabRect.width / 2) - (containerRect.left + containerRect.width / 2);
                    container.scrollBy({ left: diff, behavior: 'smooth' });
                }
            });
        }

        function initSectionShuffle(sectionId) {
            const section = appData.sections.find(s => s.id === sectionId);
            if (!section || section.type === 'info') return;
            if (section.type === 'mcq' && !state.mcq.shuffled[sectionId]) {
                state.mcq.shuffled[sectionId] = {};
                section.questions.forEach(q => {
                    const opts = q.options.map((text, i) => ({ text, originalIndex: i }));
                    state.mcq.shuffled[sectionId][q.id] = (section.noShuffle) ? opts : shuffleArray(opts);
                });
            }
            if (section.type === 'sort') {
                if (!state.sort.shuffledItems) state.sort.shuffledItems = shuffleArray(section.items);
                if (!state.sort.shuffledOptions) {
                    state.sort.shuffledOptions = {};
                    section.items.forEach(item => {
                        const opts = item.options.map((text, i) => ({ text, originalIndex: i }));
                        state.sort.shuffledOptions[item.id] = shuffleArray(opts);
                    });
                }
            }
            if (section.type === 'boxes') {
                if (!state.boxes.shuffledItems) state.boxes.shuffledItems = shuffleArray(section.items);
            }
        }

        function renderTabs(shouldCenter = false) {
            const container = document.getElementById('tabs-container');
            if (container.children.length === 0) {
                appData.sections.forEach((sec, idx) => {
                    const btn = document.createElement('button');
                    btn.id = `tab-btn-${sec.id}`;
                    btn.onclick = () => switchSection(idx, true);
                    btn.innerHTML = `<span class="whitespace-nowrap font-bold text-base md:text-lg">${sec.title}</span>` + 
                        (sec.type !== 'info' ? `<svg id="tab-check-${sec.id}" xmlns="http://www.w3.org/2000/svg" class="h-5 w-0 opacity-0 overflow-hidden transition-all duration-300 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>` : '');
                    container.appendChild(btn);
                });
            }
            appData.sections.forEach((sec, idx) => {
                const btn = document.getElementById(`tab-btn-${sec.id}`);
                const isActive = activeSectionIndex === idx;
                
                let baseClasses = "flex-shrink-0 flex items-center justify-center px-4 py-2 md:px-5 md:py-2.5 rounded-full font-bold relative outline-none transition-all duration-300";
                
                if (isActive) {
                    btn.className = `${baseClasses} ${sec.theme} text-white shadow-md transform scale-105`;
                } else {
                    btn.className = `${baseClasses} bg-white border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-slate-700`;
                }
                
                if (sec.type !== 'info') {
                    const isComp = checkSectionComplete(sec.id);
                    const check = document.getElementById(`tab-check-${sec.id}`);
                    if (check) { 
                        if (isComp) {
                            check.classList.remove('w-0', 'opacity-0');
                            check.classList.add('w-5', 'opacity-100', 'mr-1.5');
                        } else {
                            check.classList.add('w-0', 'opacity-0');
                            check.classList.remove('w-5', 'opacity-100', 'mr-1.5');
                        }

                        check.classList.remove('text-emerald-500', 'text-white');
                        check.classList.add(isActive ? 'text-white' : 'text-emerald-500');
                    }
                }
                if (isActive && shouldCenter) centerTabHorizontal(btn, idx === 0);
            });
            updateProgressBar();
        }

        function updateProgressBar() {
            const bar = document.getElementById('progress-bar');
            const sec = appData.sections[activeSectionIndex];
            
            bar.className = `absolute bottom-0 right-0 h-1.5 transition-all duration-500 ease-out origin-right ${sec.theme}`;
            
            if (sec.type === 'info') {
                bar.style.width = '0%';
                bar.style.opacity = '0';
            } else {
                let percent = 0;
                if (sec.type === 'mcq') percent = (sec.questions.filter(q => state.mcq.answers[q.id] !== undefined).length / sec.questions.length) * 100;
                else if (sec.type === 'sort') percent = (state.sort.currentItemIdx / sec.items.length) * 100;
                else if (sec.type === 'boxes') percent = (state.boxes.currentItemIdx / sec.items.length) * 100;
                
                bar.style.width = `${percent}%`;
                bar.style.opacity = '1';
            }
        }

        function switchSection(idx, shouldScroll = false) {
            activeSectionIndex = idx;
            initSectionShuffle(appData.sections[idx].id);
            renderTabs(false); renderContent(); updateFinalResultVisibility();
            
            requestAnimationFrame(() => {
                setTimeout(() => {
                    if (shouldScroll) scrollToTabs();
                    const activeTab = document.getElementById(`tab-btn-${appData.sections[idx].id}`);
                    centerTabHorizontal(activeTab, idx === 0);
                }, 50);
            });
        }

        function checkSectionComplete(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if (!sec || sec.type === 'info') return false;
            if (sec.type === 'mcq') return sec.questions.every(q => state.mcq.answers[q.id] !== undefined);
            if (sec.type === 'sort') return state.sort.currentItemIdx === sec.items.length;
            if (sec.type === 'boxes') return state.boxes.currentItemIdx === sec.items.length;
            return false;
        }

        function isAllComplete() { return appData.sections.filter(s => s.type !== 'info').every(s => checkSectionComplete(s.id)); }

        function calculateScore(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if (sec.type === 'mcq') return sec.questions.filter(q => state.mcq.answers[q.id] === q.correct).length;
            return sec.items.length; // For both 'sort' and 'boxes', they only progress on correct answers
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            const sec = appData.sections[activeSectionIndex];
            let html = `<div class="text-center mb-6 pt-4"><h2 class="text-3xl md:text-4xl font-bold text-slate-800 mb-2">معاني حروف الجر</h2>${sec.description ? `<p class="text-lg md:text-xl text-slate-600 leading-snug max-w-2xl mx-auto px-2">${sec.description}</p>` : ''}</div>`;
            
            if (sec.type === 'info') html += renderInfoSection();
            else if (sec.type === 'sort') html += renderSortGame(sec);
            else if (sec.type === 'boxes') html += renderBoxesGame(sec);
            else html += renderMCQGame(sec);
            
            if (sec.type !== 'info') {
                const isComplete = checkSectionComplete(sec.id);
                const score = calculateScore(sec.id);
                const total = sec.type === 'mcq' ? sec.questions.length : sec.items.length;
                const ratio = score / total;
                const titleMsg = ratio >= 0.8 ? 'ممتاز!' : (ratio >= 0.5 ? 'جيد جدًّا!' : 'أنهيت القسم!');
                const descMsg = ratio >= 0.8 ? 'لقد اجتزت التحدي بتفوقٍ وتألقٍ.' : (ratio >= 0.5 ? 'أداءٌ جيدٌ، ولكن يمكنك تحقيق الأفضل.' : 'تحتاج إلى مراجعة بعض المعاني والمحاولة مجددًا.');

                html += `<div id="sec-res-wrapper-${sec.id}" class="grid-expand ${isComplete ? 'grid-1' : 'grid-0'} w-full max-w-2xl mx-auto mt-6"><div class="overflow-hidden-inner"><div class="bg-emerald-50 border border-emerald-200 p-4 md:p-5 rounded-2xl flex flex-col md:flex-row items-center gap-4 shadow-sm"><div class="text-5xl hidden md:block flex-shrink-0">🏆</div><div class="flex-grow text-center md:text-right"><h3 class="text-xl md:text-2xl font-bold text-emerald-800 mb-1">${titleMsg}</h3><p class="text-base text-emerald-700 leading-snug">${descMsg}</p></div><div class="text-center flex-shrink-0 bg-white px-5 py-2 rounded-xl border border-emerald-100 shadow-sm"><span class="block text-sm text-emerald-500 font-bold mb-1">النتيجة</span><span class="text-2xl md:text-3xl font-black text-emerald-700">${toArabicNum(score)} / ${toArabicNum(total)}</span></div></div></div></div>${renderSectionEndButtons(sec.id)}`;
            }
            main.innerHTML = html;
        }

        function renderSortGame(sec) {
            const isComplete = checkSectionComplete(sec.id);
            const currentItem = isComplete ? null : state.sort.shuffledItems[state.sort.currentItemIdx];
            let categoriesHtml = '';
            if (currentItem) {
                const shuffledOpts = state.sort.shuffledOptions[currentItem.id];
                const colors = ['bg-emerald-100 border-emerald-300', 'bg-purple-100 border-purple-300', 'bg-amber-100 border-amber-300'];
                categoriesHtml = shuffledOpts.map((opt, idx) => `<button onclick="handleSortClick(${opt.originalIndex})" class="flex-1 py-4 px-2 rounded-xl font-bold text-lg md:text-xl border-2 ${colors[idx]} transition-transform active:scale-95 min-h-[5rem] shadow-sm">${opt.text}</button>`).join('');
            }
            return `<div class="w-full max-w-2xl mx-auto flex flex-col gap-4 px-2">
                <div class="flex gap-2 w-full justify-between">${categoriesHtml}</div>
                <div class="relative min-h-[14rem] bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center p-4 md:p-6 text-right">
                    ${currentItem ? `
                        <div id="sort-card" class="relative w-full max-w-md mx-auto bg-white rounded-xl shadow-lg border border-slate-200 p-6 text-center text-xl md:text-2xl font-bold text-slate-800 transition-all transform leading-snug">
                            <button onclick="toggleSortHint()" class="absolute top-3 left-3 w-9 h-9 bg-amber-50 hover:bg-amber-100 text-amber-500 rounded-full flex items-center justify-center shadow-sm border border-amber-100 transition-colors outline-none" title="تلميح">💡</button>
                            <div class="mt-4 mb-2">${currentItem.text}</div>
                            <div id="sort-hint" class="grid-expand ${state.sort.hintActive ? 'grid-1' : 'grid-0'} w-full mt-4">
                                <div class="overflow-hidden-inner">
                                    <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg text-lg font-normal text-amber-800 text-right">
                                        <span class="font-bold">تلميح:</span> ${currentItem.hint}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ` : `<div class="text-3xl font-bold text-emerald-500">تم الفرز بنجاحٍ!</div>`}
                </div>
                <div id="sort-feedback" class="grid-expand ${state.sort.feedbackActive ? 'grid-1' : 'grid-0'} w-full">
                    <div class="overflow-hidden-inner">
                        <div class="p-4 bg-red-50 border border-red-200 rounded-xl text-center text-red-700 text-lg md:text-xl font-bold shadow-sm">
                            ⚠️ ${currentItem ? currentItem.explanation : ''}
                        </div>
                    </div>
                </div>
                ${!isComplete ? `<div class="text-center text-xl font-bold text-slate-500 mt-2">البطاقة ${toArabicNum(state.sort.currentItemIdx + 1)} من ${toArabicNum(sec.items.length)}</div>` : ''}
            </div>`;
        }

        function renderBoxesGame(sec) {
            const isComplete = checkSectionComplete(sec.id);
            const currentItem = isComplete ? null : state.boxes.shuffledItems[state.boxes.currentItemIdx];
            
            const colors = [
                { bg: 'bg-blue-50', border: 'border-blue-300', text: 'text-blue-900', itemBg: 'bg-white', itemBorder: 'border-blue-100' },
                { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', itemBg: 'bg-white', itemBorder: 'border-emerald-100' },
                { bg: 'bg-purple-50', border: 'border-purple-300', text: 'text-purple-900', itemBg: 'bg-white', itemBorder: 'border-purple-100' },
                { bg: 'bg-amber-50', border: 'border-amber-300', text: 'text-amber-900', itemBg: 'bg-white', itemBorder: 'border-amber-100' }
            ];

            const boxesHtml = sec.categories.map((cat, idx) => {
                const placedHtml = state.boxes.placedItems[idx].map(item => 
                    `<div class="mt-2 p-3 rounded-lg text-sm md:text-base border ${colors[idx].itemBorder} ${colors[idx].itemBg} shadow-sm leading-snug animate-fadeIn">
                        ${item.text}
                    </div>`
                ).join('');

                return `
                <div onclick="${!isComplete ? `handleBoxClick(${idx})` : ''}" 
                     class="flex flex-col w-full p-4 rounded-xl border-2 ${colors[idx].border} ${colors[idx].bg} transition-all duration-300 ${!isComplete ? 'cursor-pointer hover:shadow-md hover:brightness-95 active:scale-[0.98]' : ''} min-h-[10rem]">
                    <h3 class="font-bold text-lg md:text-xl text-center ${colors[idx].text} border-b border-black/10 pb-3">${cat}</h3>
                    <div class="flex flex-col gap-1 flex-grow mt-1">
                        ${placedHtml}
                    </div>
                </div>`;
            }).join('');

            return `<div class="w-full max-w-3xl mx-auto flex flex-col gap-6 px-2">
                <div class="relative min-h-[12rem] bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center p-4 md:p-6 text-right transition-all duration-500">
                    ${currentItem ? `
                        <div id="box-card" class="relative w-full max-w-lg mx-auto bg-white rounded-xl shadow-lg border border-slate-200 p-6 md:p-8 text-center text-xl md:text-2xl font-bold text-slate-800 transition-all transform leading-snug">
                            <span class="block mb-4 text-slate-500 text-sm md:text-base font-normal">إلى أي صندوق تنتمي هذه الجملة؟ (انقر على الصندوق المناسب بالأسفل)</span>
                            ${currentItem.text}
                        </div>
                    ` : `<div class="text-3xl font-bold text-emerald-500 flex flex-col items-center gap-3 animate-fadeIn"><span class="text-5xl">🎉</span><span>اكتملت الخريطة الذهنية!</span></div>`}
                </div>
                
                <div id="box-feedback" class="grid-expand ${state.boxes.feedbackActive ? 'grid-1' : 'grid-0'} w-full">
                    <div class="overflow-hidden-inner">
                        <div class="p-4 bg-red-50 border border-red-200 rounded-xl text-center text-red-700 text-lg md:text-xl font-bold shadow-sm">
                            ⚠️ ${currentItem ? currentItem.explanation : ''}
                        </div>
                    </div>
                </div>
                ${!isComplete ? `<div class="text-center text-xl font-bold text-slate-500">الجملة ${toArabicNum(state.boxes.currentItemIdx + 1)} من ${toArabicNum(sec.items.length)}</div>` : ''}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">${boxesHtml}</div>
            </div>`;
        }

        function toggleSortHint() { 
            state.sort.hintActive = !state.sort.hintActive; 
            const hintEl = document.getElementById('sort-hint');
            if(hintEl) {
                if (state.sort.hintActive) {
                    hintEl.classList.replace('grid-0', 'grid-1');
                } else {
                    hintEl.classList.replace('grid-1', 'grid-0');
                }
            }
        }

        function handleSortClick(selectedOriginalIndex) {
            const currentItem = state.sort.shuffledItems[state.sort.currentItemIdx];
            if (selectedOriginalIndex === currentItem.correct) {
                state.sort.feedbackActive = false;
                const feedbackEl = document.getElementById('sort-feedback');
                if(feedbackEl) feedbackEl.classList.replace('grid-1', 'grid-0');
                
                const cardEl = document.getElementById('sort-card');
                if(cardEl) { 
                    cardEl.style.transform = 'translateY(-30px) scale(0.9)'; 
                    cardEl.style.opacity = '0'; 
                }
                
                setTimeout(() => { 
                    state.sort.currentItemIdx++; 
                    state.sort.hintActive = false; 
                    renderTabs(); 
                    renderContent(); 
                    updateFinalResultVisibility();
                }, 300);
            } else {
                state.sort.feedbackActive = true;
                const feedbackEl = document.getElementById('sort-feedback');
                if(feedbackEl) {
                    feedbackEl.innerHTML = `<div class="overflow-hidden-inner"><div class="p-4 bg-red-50 border border-red-200 rounded-xl text-center text-red-700 text-lg md:text-xl font-bold shadow-sm">⚠️ ${currentItem.explanation}</div></div>`;
                    feedbackEl.classList.replace('grid-0', 'grid-1');
                }
                
                const cardEl = document.getElementById('sort-card');
                if(cardEl) { 
                    cardEl.classList.remove('animate-shake'); 
                    void cardEl.offsetWidth; 
                    cardEl.classList.add('animate-shake'); 
                }
            }
        }

        function handleBoxClick(selectedBoxIndex) {
            const currentItem = state.boxes.shuffledItems[state.boxes.currentItemIdx];
            if (selectedBoxIndex === currentItem.correct) {
                state.boxes.feedbackActive = false;
                const feedbackEl = document.getElementById('box-feedback');
                if(feedbackEl) feedbackEl.classList.replace('grid-1', 'grid-0');
                
                state.boxes.placedItems[selectedBoxIndex].push(currentItem);

                const cardEl = document.getElementById('box-card');
                if(cardEl) { 
                    cardEl.style.transform = 'translateY(-30px) scale(0.9)'; 
                    cardEl.style.opacity = '0'; 
                }
                
                setTimeout(() => { 
                    state.boxes.currentItemIdx++; 
                    renderTabs(); 
                    renderContent(); 
                    updateFinalResultVisibility();
                }, 300);
            } else {
                state.boxes.feedbackActive = true;
                const feedbackEl = document.getElementById('box-feedback');
                if(feedbackEl) {
                    feedbackEl.innerHTML = `<div class="overflow-hidden-inner"><div class="p-4 bg-red-50 border border-red-200 rounded-xl text-center text-red-700 text-lg md:text-xl font-bold shadow-sm">⚠️ ${currentItem.explanation}</div></div>`;
                    feedbackEl.classList.replace('grid-0', 'grid-1');
                }
                
                const cardEl = document.getElementById('box-card');
                if(cardEl) { 
                    cardEl.classList.remove('animate-shake'); 
                    void cardEl.offsetWidth; 
                    cardEl.classList.add('animate-shake'); 
                }
            }
        }

        function renderMCQGame(sec) {
            return sec.questions.map((q, i) => {
                const isAnswered = state.mcq.answers[q.id] !== undefined;
                const isCorrect = state.mcq.answers[q.id] === q.correct;
                const optionsHtml = state.mcq.shuffled[sec.id][q.id].map((opt, idx) => {
                    const isSelected = state.mcq.answers[q.id] === opt.originalIndex;
                    let cls = 'bg-white border-slate-200 text-slate-700 hover:border-blue-400', numCls = 'bg-slate-100 text-slate-600';
                    if (isAnswered) {
                        if (isSelected) { cls = isCorrect ? 'bg-pastel-success border-pastel-successDark text-pastel-successDark shadow-inner' : 'bg-pastel-danger border-pastel-dangerDark text-pastel-dangerDark shadow-inner'; numCls = isCorrect ? 'bg-pastel-successDark text-white' : 'bg-pastel-dangerDark text-white'; }
                        else if (opt.originalIndex === q.correct) { cls = 'bg-white border-pastel-successDark text-pastel-successDark border-dashed'; numCls = 'bg-pastel-success text-pastel-successDark'; }
                        else { cls = 'bg-slate-50 border-slate-200 text-slate-400 opacity-50 cursor-not-allowed'; numCls = 'bg-slate-200 text-slate-400'; }
                    }
                    return `<button onclick="handleMCQClick('${sec.id}', '${q.id}', ${opt.originalIndex})" class="w-full p-4 rounded-xl border-2 transition-colors text-xl font-medium mb-2 flex items-center gap-3 text-right outline-none ${cls}"><div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg font-bold text-xl ${numCls}">${toArabicNum(idx+1)}</div><span class="leading-snug">${opt.text}</span></button>`;
                }).join('');
                return `<div class="w-full max-w-2xl mx-auto py-2 px-2"><div class="flex justify-between items-center mb-1 px-2"><span class="text-slate-500 font-bold text-xl">السؤال ${toArabicNum(i+1)}</span><button onclick="toggleMCQHint('${q.id}')" class="flex items-center gap-2 text-amber-500 font-bold px-3 py-1 bg-amber-50 rounded-lg outline-none text-lg"><span>💡</span><span>تلميح</span></button></div><h3 class="text-2xl font-bold text-slate-800 leading-snug px-2 text-right">${q.text}</h3><div class="grid-expand ${state.mcq.hints[q.id] ? 'grid-1' : 'grid-0'} w-full mt-2"><div class="overflow-hidden-inner"><div class="bg-amber-50 border border-amber-300 p-3 rounded-xl text-lg leading-snug text-right mb-2 text-amber-900"><span class="font-bold text-amber-700">💡 تلميح: </span>${q.hint}</div></div></div><div class="w-full flex flex-col mt-3">${optionsHtml}</div><div class="grid-expand ${isAnswered ? 'grid-1' : 'grid-0'} w-full mt-2"><div class="overflow-hidden-inner"><div class="p-4 rounded-xl border flex items-start gap-3 ${isCorrect ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-red-700 bg-red-50 border-red-200'}"><div class="text-2xl">${isCorrect ? '✅' : '❌'}</div><div><h4 class="font-bold text-xl mb-1">${isCorrect ? 'إجابة صحيحة!' : 'إجابة خاطئة!'}</h4><p class="text-lg leading-snug opacity-90">${q.explanation}</p></div></div></div></div></div><div class="w-full max-w-2xl mx-auto h-px bg-slate-200 my-4 border-0"></div>`;
            }).join('');
        }

        function toggleMCQHint(qId) { state.mcq.hints[qId] = !state.mcq.hints[qId]; renderContent(); }

        function handleMCQClick(secId, qId, val) {
            if (state.mcq.answers[qId] !== undefined) return;
            state.mcq.answers[qId] = val; updateProgressBar();
            if (checkSectionComplete(secId)) renderTabs(); renderContent(); updateFinalResultVisibility();
        }

        function renderInfoSection() {
            return `<div class="w-full max-w-2xl mx-auto bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col gap-6 px-4"><p class="text-xl text-slate-700 leading-relaxed text-right">تتنوع معاني حروف الجر في لغتنا الجميلة حسب السياق. دعنا نتعرف على أبرزها بأسلوبٍ ممتعٍ:</p><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2"><div class="bg-blue-50 rounded-2xl p-5 flex flex-col items-center text-center gap-3 border border-blue-100"><div class="text-4xl">🧭</div><h3 class="font-bold text-blue-900 text-xl">المكان والاتجاه</h3><p class="text-slate-600 text-lg">مِن (البداية)، إلَى (النهاية)، فِي (الظرفية)، عَلَى (الاستعلاء).</p></div><div class="bg-emerald-50 rounded-2xl p-5 flex flex-col items-center text-center gap-3 border border-emerald-100"><div class="text-4xl">⏱️</div><h3 class="font-bold text-emerald-900 text-2xl">الزمان</h3><p class="text-slate-600 text-lg">مِن، وإلَى، وفِي تُستخدم أيضًا للدلالة على الأوقات.</p></div><div class="bg-amber-50 rounded-2xl p-5 flex flex-col items-center text-center gap-3 border border-amber-100"><div class="text-4xl">⚙️</div><h3 class="font-bold text-amber-900 text-xl">الآلة والوسيلة</h3><p class="text-slate-600 text-lg">الباء تفيد <b>الآلة</b> (ماديًّا)، أو <b>الوسيلة</b> (معنويًّا كالعلم).</p></div><div class="bg-purple-50 rounded-2xl p-5 flex flex-col items-center text-center gap-3 border border-purple-100"><div class="text-4xl">🔍</div><h3 class="font-bold text-purple-900 text-xl">التشبيه والتفصيل</h3><p class="text-slate-600 text-lg">الكاف تُستخدم للتشبيه وتأتي لضرب الأمثلة (التفصيل).</p></div></div><button onclick="switchSection(1, true)" class="w-full bg-pastel-primaryDark text-white py-4 rounded-2xl font-bold text-2xl hover:bg-blue-700 transition-colors shadow-md mt-2 outline-none">ابدأ التحديات الآن!</button></div>`;
        }

        function renderSectionEndButtons(secId) {
            const isLast = activeSectionIndex === appData.sections.length - 1;
            return `<div class="flex gap-3 w-full max-w-2xl mx-auto mt-4 px-2"><button onclick="resetSection('${secId}')" class="flex-1 bg-white border-2 border-slate-300 text-slate-700 py-3 rounded-xl font-bold text-lg md:text-xl hover:bg-slate-50 outline-none transition-colors">إعادة المحاولة</button>${!isLast ? `<button onclick="switchSection(${activeSectionIndex + 1}, true)" class="flex-1 bg-pastel-primaryDark text-white py-3 rounded-xl font-bold text-lg md:text-xl hover:bg-blue-700 outline-none shadow-sm transition-colors">القسم التالي</button>` : ''}</div>`;
        }

        function updateFinalResultVisibility() {
            const wrapper = document.getElementById('global-res-wrapper');
            if (!wrapper) return;
            
            if (isAllComplete()) {
                let s = 0, q = 0;
                appData.sections.filter(x => x.type !== 'info').forEach(x => { s += calculateScore(x.id); q += (x.questions?x.questions.length:x.items.length); });
                
                let ratio = s / q;
                let globalTitle = ratio >= 0.8 ? 'أكملت التحديات بتفوقٍ ونجاحٍ!' : (ratio >= 0.5 ? 'أكملت التحديات بنجاحٍ!' : 'أنهيت التدريبات، لكن راجع أخطاءك!');
                
                document.getElementById('global-final-title').textContent = globalTitle;
                document.getElementById('global-final-score').textContent = `${toArabicNum(s)} / ${toArabicNum(q)}`;
                wrapper.classList.replace('grid-0', 'grid-1');
            } else {
                wrapper.classList.replace('grid-1', 'grid-0');
            }
        }

        function resetSection(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if(sectionId === 'sort') state.sort = { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false };
            else if(sectionId === 'boxes') state.boxes = { currentItemIdx: 0, shuffledItems: null, feedbackActive: false, placedItems: [[], [], [], []] };
            else { 
                sec.questions.forEach(q => { delete state.mcq.answers[q.id]; delete state.mcq.hints[q.id]; });
                state.mcq.shuffled[sectionId] = null;
            }
            initSectionShuffle(sectionId); renderTabs(false); renderContent(); updateFinalResultVisibility(); 
            requestAnimationFrame(() => {
                setTimeout(() => {
                    scrollToTabs();
                    const activeTab = document.getElementById(`tab-btn-${sectionId}`);
                    centerTabHorizontal(activeTab, activeSectionIndex === 0);
                }, 50);
            });
        }

        function startOver() {
            const wrapper = document.getElementById('global-res-wrapper');
            if(wrapper) {
                wrapper.style.transition = 'none';
                wrapper.classList.replace('grid-1', 'grid-0');
                void wrapper.offsetWidth;
                wrapper.style.transition = '';
            }

            state.mcq = { answers: {}, hints: {}, shuffled: {} };
            state.sort = { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false };
            state.boxes = { currentItemIdx: 0, shuffledItems: null, feedbackActive: false, placedItems: [[], [], [], []] };
            
            activeSectionIndex = 0;
            initSectionShuffle(appData.sections[0].id);
            renderTabs(false);
            renderContent();
            updateFinalResultVisibility();

            requestAnimationFrame(() => {
                setTimeout(() => {
                    scrollToTabs(); 
                    const activeTab = document.getElementById(`tab-btn-${appData.sections[0].id}`);
                    centerTabHorizontal(activeTab, true);
                }, 50);
            });
        }

        function shuffleArray(a) { let n = [...a]; for (let i = n.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [n[i], n[j]] = [n[j], n[i]]; } return n; }

        window.onload = () => switchSection(0, false);
    </script>
</body>
</html>
