<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العربية السهلة - معاني حروف الجر</title>
    <!-- Google Fonts: Readex Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Readex Pro"', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            bg: '#F8FAFC',
                            card: '#FFFFFF',
                            primary: '#E0F2FE',
                            primaryDark: '#0284C7',
                            success: '#D1FAE5',
                            successDark: '#059669',
                            danger: '#FEE2E2',
                            dangerDark: '#DC2626',
                            warning: '#FEF3C7',
                            warningDark: '#D97706',
                        }
                    },
                    animation: {
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* التمدد السلس للعناصر */
        .grid-expand { display: grid; transition: grid-template-rows 0.4s ease-out, opacity 0.4s ease-out; }
        .grid-0 { grid-template-rows: 0fr; opacity: 0; pointer-events: none; }
        .grid-1 { grid-template-rows: 1fr; opacity: 1; pointer-events: auto; }
        .overflow-hidden-inner { overflow: hidden; }

        /* Fallback للتمرير في حال فشل JS أو للتحميل المباشر للمقاطع */
        main { scroll-margin-top: 5rem; }
    </style>
</head>
<body class="bg-pastel-bg text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-200">

    <!-- Header (غير مثبت) -->
    <header id="page-header" class="w-full bg-pastel-bg">
        <div class="max-w-3xl mx-auto pt-6 pb-4 text-center">
            <h1 class="flex items-center justify-center">

                    <span class="text-3xl font-bold text-slate-900">العربية السهلة</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#FF0000" class="w-8 h-8 flex-shrink-0">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </a>
            </h1>
            <p class="text-xl font-bold text-slate-500 mt-2">محمود صلاح</p>
        </div>
    </header>

    <!-- Tabs Container (Sticky) -->
    <div id="tabs-wrapper" class="sticky top-0 z-50 w-full bg-pastel-bg/95 backdrop-blur shadow-sm border-b border-slate-200">
        <div class="relative w-full max-w-3xl mx-auto pt-1">
            <div id="tabs-container" class="flex overflow-x-auto no-scrollbar mx-auto w-max max-w-full px-4 py-1 gap-2 items-center">

            </div>
            <!-- Progress Bar - يبدأ من اليمين -->
            <div class="absolute bottom-0 right-0 h-1.5 bg-pastel-primaryDark transition-all duration-500 ease-out w-0 origin-right" id="progress-bar"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="flex-grow w-full max-w-3xl mx-auto p-4 md:p-6 flex flex-col pb-8">
        <!-- يتم التوليد هنا عبر JS -->
    </main>

    <!-- حاوية النتيجة النهائية -->
    <div class="w-full max-w-3xl mx-auto px-4 md:px-6 pb-12">
        <div id="global-res-wrapper" class="grid-expand grid-0 w-full max-w-lg mx-auto">
            <div class="overflow-hidden-inner">
                <div class="bg-gradient-to-br from-pastel-primaryDark to-blue-900 text-white p-8 rounded-2xl text-center shadow-xl mt-6">

                    <h2 class="text-4xl font-bold mb-4">أكملت جميع التحديات بنجاحٍ!</h2>
                    <p class="text-2xl text-blue-100 mb-8">حصيلتك الإجمالية: <span id="global-final-score" class="font-bold text-white text-4xl">٠ / ٠</span></p>

    </div>

    <!-- Footer -->

            جميع الحقوق محفوظة لقناة العربية السهلة

    </footer>

    <script>
        // منع استعادة التمرير التلقائي للمتصفح عند التحميل
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }

        const toArabicNum = (num) => String(num).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

        // بيانات التطبيق - مرتبة تعليميًا
        const appData = {
            sections: [
                { id: 'intro', title: 'مقدمة', type: 'info' },
                {
                    id: 'fill',
                    title: 'الكلمة المفقودة',
                    type: 'mcq',
                    description: 'اختر حرف الجر المناسب لملء الفراغِ، بحيث يؤدي الحرف المعنى المطلوب بين القوسين تمامًا.',
                    questions: [
                        { id: 'q_f1', text: 'خاتم أمي مصنوعٌ [ ... ] ذهبٍ خالصٍ.', options: ['مِنْ', 'بـِ', 'فِي'], correct: 0, hint: 'نحتاج حرفًا يبين المادة الخام التي صُنع منها الخاتم.', explanation: '(مِنْ) تستخدم لبيان النوع والمادة المصنوع منها الشيء.' },
                        { id: 'q_f2', text: 'السفر الطويل أحب [ ... ] من الإقامة بلا عملٍ.', options: ['إلَيَّ', 'عَلَيَّ', 'فِيَّ'], correct: 0, hint: 'نحتاج حرفًا يفيد معنى (عندي) أو القرب النفسي.', explanation: '(إلَى) تستخدم أحيانًا بمعنى (عند).' },
                        { id: 'q_f3', text: 'أخذتُ هذا الخبر اليقين [ ... ] صديقي.', options: ['عَنْ', 'فِي', 'مِنْ'], correct: 0, hint: 'هذا الحرف يدل على الأصل والمصدر الذي صدر منه الخبر.', explanation: '(عَنْ) تُستخدم لتدل على مصدر الشيء وأصله.' },
                        { id: 'q_f4', text: 'فاق صالحٌ أقرانه بالدراسة [ ... ] صغر سنه.', options: ['عَلَى', 'مِنْ', 'البَاء'], correct: 0, hint: 'نحتاج حرفًا يفيد تجاوز العائق (بالرغم من).', explanation: '(عَلَى) تأتي أحيانًا لتفيد معنى (الرغم).' },
                        { id: 'q_f5', text: 'غادرت بعثتنا الرياضية المدينة [ ... ] مهمةٍ وطنيةٍ.', options: ['فِي', 'لِـ', 'إلَى'], correct: 0, hint: 'الحرف هنا يدل على الهدف الذي تم من أجله السفر.', explanation: '(فِي) تأتي للدلالة على الغرض الذي تم من أجله الفعل.' },
                        { id: 'q_f6', text: 'استمعتُ لشرح الأستاذ [ ... ] انتباهٍ شديدٍ.', options: ['بـِ', 'فِي', 'كـَ'], correct: 0, hint: 'نحتاج حرفًا يصف هيئة المستمع (أي: استمعتُ مُنتبهًا).', explanation: '(الباء) هنا دخلت لتفيد وصف الحال.' },
                        { id: 'q_f7', text: 'أحب الفواكه الصيفية [ ... ] العنب والبطيخ.', options: ['كـَ', 'لِـ', 'بـِ'], correct: 0, hint: 'نحتاج حرفًا نستخدمه لتقديم أمثلةٍ توضيحيةٍ.', explanation: '(الكاف) تُستخدم لضرب الأمثلة والتفصيل.' },
                        { id: 'q_f8', text: 'أنفقتُ [ ... ] مالي في مساعدة الفقراءِ.', options: ['مِنْ', 'فِي', 'البَاء'], correct: 0, hint: 'المال المنفق هو (جزءٌ) فقط من إجمالي المال.', explanation: '(مِنْ) تُستخدم للدلالة على التبعيض.' },
                        { id: 'q_f9', text: 'تحدثنا طويلاً [ ... ] أهمية الوقتِ.', options: ['عَنْ', 'فِي', 'مِنْ'], correct: 0, hint: 'هذا الحرف يدل على المحور الذي دار حوله النقاش.', explanation: '(عَنْ) تُستخدم لتدل على موضوع الحديث.' },
                        { id: 'q_f10', text: 'ينقسم الاسم [ ... ] نكرة ومعرفة.', options: ['إلَى', 'اللَّام', 'فِي'], correct: 0, hint: 'نحتاج حرفًا يجزئ الشيء لمكوناته.', explanation: '(إلَى) تستخدم للتفصيل والتقسيم.' }
                    ]
                },
                {
                    id: 'sort',
                    title: 'فرز البطاقات',
                    type: 'sort',
                    description: 'اقرأ الجملة التي تظهر في البطاقة، ثم انقر على الصندوق المناسب للمعنى الذي يؤديه الحرف الملون فيها.',
                    items: [
                        { id: 'srt1', text: 'شرعت في العمل <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">من</span> الأسبوع الماضي', options: ['زمان الابتداء', 'التبعيض', 'بيان النوع'], correct: 0, hint: 'الحرف يحدد متى بدأ زمن الفعل.', explanation: '(مِنْ) هنا حددت نقطة انطلاق الزمن.' },
                        { id: 'srt2', text: 'وصلت <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">إلى</span> المدرسة باكرًا', options: ['النهاية في المكان', 'النهاية في الزمان', 'معنى القرب'], correct: 0, hint: 'المدرسة هي المحطة الأخيرة للحركة.', explanation: '(إلى) تفيد انتهاء الغاية المكانية.' },
                        { id: 'srt3', text: 'شرّبت الأم ولدها الدواء <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">على</span> أنه ماء', options: ['الاستعلاء المكان', 'معنى الوهم', 'الشرط'], correct: 1, hint: 'الأم صورت الدواء بشيءٍ غير حقيقيٍ لتشجع ابنها.', explanation: '(عَلَى) هنا صورت شيئًا متوهمًا غير حقيقيٍ.' },
                        { id: 'srt12', text: '<span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">بـ</span>سم الله الرحمن الرحيم', options: ['السبب والعلة', 'الوسيلة (الاستعانة)', 'القسم واليمين'], correct: 1, hint: 'الباء هنا للطلب والاستغاثة باسم الله لإنجاز العمل.', explanation: 'الباء هنا معنوية وتفيد الاستعانة أو الوسيلة.' },
                        { id: 'srt13', text: 'فرح محمد <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">بـ</span>قدوم أخيه', options: ['الوسيلة (الآلة)', 'التعويض والثمن', 'السبب والعلة'], correct: 2, hint: 'القدوم هو الدافع والعلة وراء شعور الفرح.', explanation: 'الباء هنا سببية، أي (بسبب) قدوم أخيه.' },
                        { id: 'srt6', text: 'اشتريت هذا الكتاب القيم <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">بـ</span>دينارٍ', options: ['التعويض والثمن', 'الوسيلة (معنوي)', 'الآلة (مادي)'], correct: 0, hint: 'تمت مبادلة الكتاب بمبلغٍ ماديٍ.', explanation: 'الباء تدخل على الثمن لتفيد التعويض.' },
                        { id: 'srt4', text: 'جلسنا <span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">على</span> المائدة لنتناول الطعام', options: ['الاستعلاء المكان', 'القرب من الشيء', 'الشرط'], correct: 1, hint: 'نحن نجلس بجوار المائدة وقربها لا فوقها.', explanation: '(على) تأتي أحيانًا بمعنى (عند) أو القرب.' }
                    ]
                },
                {
                    id: 'mcq2',
                    title: 'أسرار المعاني',
                    type: 'mcq',
                    description: 'هذا القسم يختبر المعاني الدقيقة والعميقة لحروف الجر. اقرأ بتمعنٍ ثم اختر الإجابة الصحيحة.',
                    questions: [
                        { id: 'q_m1', text: 'ماذا أفاد حرف الجر (من) في قولنا: "ما على الشجرة من طائرٍ."؟', options: ['تأكيد النفي', 'مكان الابتداء', 'التبعيض'], correct: 0, hint: 'الجملة منفية بـ(ما)، والحرف زائدٌ للتوكيد.', explanation: 'تفيد (من) هنا تأكيد النفي.' },
                        { id: 'q_m4', text: 'ما الدلالة المستفادة من (على) في قولنا: "على أبي مائة دينارٍ."؟', options: ['الشيء الذي لا رغبة فيه', 'الوجوب والإلزام', 'الدعاء بالشر'], correct: 0, hint: 'الدَّين حملٌ ثقيلٌ لا يرغب فيه الإنسان.', explanation: 'تفيد (على) هنا الشيء الذي لا رغبة فيه كالدين.' },
                        { id: 'q_m5', text: 'ماذا يفيد حرف (على) في جملة: "دعا جدي على مَن ظلمه."؟', options: ['الدعاء بالشر', 'الاستعلاء', 'معنى الرَّغم'], correct: 0, hint: 'هذا دعاءٌ سلبيٌ ضد شخصٍ ظالمٍ.', explanation: 'تفيد (على) هنا الدعاء بالشر.' },
                        { id: 'q_m6', text: 'ماذا تفيد الباء في قولنا: "ليس الكسول بناجحٍ."؟', options: ['تأكيد النفي', 'الآلة', 'الحال'], correct: 0, hint: 'الباء هنا دخلت على خبر (ليس) لزيادة قوة المعنى.', explanation: 'تفيد (الباء) هنا تأكيد وتقوية النفي.' },
                        { id: 'q_m7', text: 'حدد دلالة الحرف في قولنا: "باللهِ لأجتهدنَّ في دروسي."؟', options: ['القسم واليمين', 'السبب', 'الوسيلة'], correct: 0, hint: 'تستخدم الباء هنا كحرفٍ يسبق لفظ الجلالة للحلف.', explanation: 'تفيد (الباء) هنا القسم واليمين.' }
                    ]
                },
                {
                    id: 'search',
                    title: 'البحث الدقيق',
                    type: 'mcq',
                    noShuffle: true, 
                    description: 'في هذا التحدي الختامي، سنقارن بين المعاني (الحسية والمعنوية). حدد المعنى الدقيق في كل جملةٍ.',
                    questions: [
                        { id: 'pair_1a', text: 'قال تعالى: "لِـلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ". اللام تفيد:', options: ['الملكية المادية', 'الملكية المعنوية', 'الغرض والتعليل'], correct: 0, hint: 'الخالق يملك الكون ملكيةً حقيقيةً شاملةً.', explanation: 'تفيد اللام هنا الملكية المادية (الحقيقية).' },
                        { id: 'pair_1b', text: 'لـلصادقِ مكانةٌ رفيعةٌ في المجتمعِ. ماذا تفيد اللام؟', options: ['الملكية المادية', 'الملكية المعنوية (الاختصاص)', 'السبب والعلة'], correct: 1, hint: 'المكانة شيءٌ معنويٌ يختص به الصادق.', explanation: 'تفيد اللام هنا الملكية المعنوية أو الاختصاص.' },
                        { id: 'pair_2a', text: 'سافرَ السائحُ إلى مدينةِ "القاهرةِ" بالقطارِ. "إلى" تفيد:', options: ['الاتجاه حسًّا', 'الاتجاه معنًى', 'الزمان'], correct: 0, hint: 'القاهرة مكانٌ ماديٌ ننتقل إليه بالأجساد.', explanation: 'تفيد "إلى" هنا الاتجاه حسًّا.' },
                        { id: 'pair_2b', text: 'هدتني نصيحةُ المعلمِ إلى الصوابِ والنجاحِ. "إلى" تفيد:', options: ['الاتجاه حسًّا', 'الاتجاه معنًى', 'الملكية'], correct: 1, hint: 'الصواب طريقٌ فكريٌ معنويٌ.', explanation: 'تفيد "إلى" هنا الاتجاه معنًى.' },
                        { id: 'pair_3a', text: 'أزاحَ العاملُ الأذى عن الطريقِ لسلامةِ الناسِ. "عن" تفيد:', options: ['البعد والفصل حسًّا', 'البعد والفصل معنًى', 'موضوع الكلام'], correct: 0, hint: 'إبعاد شيءٍ ماديٍ عن مكانٍ ماديٍ.', explanation: 'تفيد "عن" هنا البعد والفصل حسًّا.' },
                        { id: 'pair_3b', text: 'أعرضَ الحكيمُ عن لغوِ الحديثِ والكذبِ. "عن" تفيد:', options: ['البعد والفصل حسًّا', 'البعد والفصل معنًى', 'مصدر الشيء'], correct: 1, hint: 'اللغو والكذب أمورٌ معنويةٌ نبتعد عنها سلوكيًا.', explanation: 'تفيد "عن" هنا البعد والفصل معنًى.' },
                        { id: 'q_s10', text: '<span class="text-pastel-primaryDark font-black bg-blue-50 px-2 rounded">على</span> المريضِ في المستشفى أن يعملَ بنصائحِ الطبيبِ.', options: ['الوجوب والإلزام', 'معنى الوهم', 'الاستعلاء'], correct: 0, hint: 'أمرٌ يتطلب التنفيذ الصارم ولا خيار فيه.', explanation: 'تفيد (على) هنا الوجوب والإلزام.' }
                    ]
                }
            ]
        };

        let activeSectionIndex = 0;
        let state = {
            mcq: { answers: {}, hints: {}, shuffled: {} },
            sort: { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false }
        };

        // --- نظام التمرير الذكي (Vertical & Horizontal) ---

        function scrollToTabs() {
            requestAnimationFrame(() => {
                const header = document.getElementById('page-header');
                const targetY = header ? header.offsetHeight : 0;
                window.scrollTo({ top: targetY, behavior: 'smooth' });
            });
        }

        function centerTabHorizontal(tabEl) {
            if (!tabEl) return;
            const container = document.getElementById('tabs-container');
            if (!container) return;

            requestAnimationFrame(() => {
                const tabRect = tabEl.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                
                const tabCenter = tabRect.left + tabRect.width / 2;
                const containerCenter = containerRect.left + containerRect.width / 2;
                const diff = tabCenter - containerCenter;
                
                container.scrollBy({ left: diff, behavior: 'smooth' });
            });
        }

        // --- دوال منطق التطبيق ---

        function initSectionShuffle(sectionId) {
            const section = appData.sections.find(s => s.id === sectionId);
            if (!section || section.type === 'info') return;
            
            if (section.type === 'mcq' && !state.mcq.shuffled[sectionId]) {
                state.mcq.shuffled[sectionId] = {};
                section.questions.forEach(q => {
                    const opts = q.options.map((text, i) => ({ text, originalIndex: i }));
                    state.mcq.shuffled[sectionId][q.id] = (section.noShuffle) ? opts : shuffleArray(opts);
                });
            }

            if (section.type === 'sort') {
                if (!state.sort.shuffledItems) state.sort.shuffledItems = shuffleArray(section.items);
                if (!state.sort.shuffledOptions) {
                    state.sort.shuffledOptions = {};
                    section.items.forEach(item => {
                        const opts = item.options.map((text, i) => ({ text, originalIndex: i }));
                        state.sort.shuffledOptions[item.id] = shuffleArray(opts);
                    });
                }
            }
        }

        function renderTabs(shouldCenter = false) {
            const container = document.getElementById('tabs-container');
            if (container.children.length === 0) {
                appData.sections.forEach((sec, idx) => {
                    const btn = document.createElement('button');
                    btn.id = `tab-btn-${sec.id}`;
                    btn.onclick = () => switchSection(idx, true); // التمرير عند الضغط فقط
                    btn.innerHTML = `<span class="whitespace-nowrap font-bold">${sec.title}</span>` + 
                        (sec.type !== 'info' ? `<svg id="tab-check-${sec.id}" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-pastel-successDark transition-opacity duration-300 opacity-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>` : '');
                    container.appendChild(btn);
                });
            }

            appData.sections.forEach((sec, idx) => {
                const btn = document.getElementById(`tab-btn-${sec.id}`);
                const isComplete = checkSectionComplete(sec.id);
                const isActive = activeSectionIndex === idx;
                btn.className = `flex-shrink-0 flex items-center gap-2 px-5 py-4 rounded-t-xl transition-colors font-bold text-xl relative outline-none ${isActive ? 'text-pastel-primaryDark bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]' : 'text-slate-500 hover:text-slate-700'}`;
                if (sec.type !== 'info') {
                    const check = document.getElementById(`tab-check-${sec.id}`);
                    if (check) { check.classList.toggle('opacity-100', isComplete); check.classList.toggle('opacity-0', !isComplete); }
                }
                if (isActive && shouldCenter) centerTabHorizontal(btn);
            });
            updateProgressBar();
        }

        function updateProgressBar() {
            const bar = document.getElementById('progress-bar');
            if (!bar) return;
            const sec = appData.sections[activeSectionIndex];
            let percent = (sec.type === 'info') ? 100 : (sec.type === 'mcq' ? (sec.questions.filter(q => state.mcq.answers[q.id] !== undefined).length / sec.questions.length) * 100 : (state.sort.currentItemIdx / sec.items.length) * 100);
            bar.style.width = `${percent}%`;
        }

        function switchSection(idx, shouldScroll = false) {
            if (idx < 0 || idx >= appData.sections.length) return;
            activeSectionIndex = idx;
            initSectionShuffle(appData.sections[idx].id);
            renderTabs(true); 
            renderContent();
            updateFinalResultVisibility();
            if (shouldScroll) {
                setTimeout(scrollToTabs, 50); 
            }
        }

        function checkSectionComplete(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if (!sec || sec.type === 'info') return false;
            return (sec.type === 'mcq') ? sec.questions.every(q => state.mcq.answers[q.id] !== undefined) : state.sort.currentItemIdx === sec.items.length;
        }

        function isAllComplete() { return appData.sections.filter(s => s.type !== 'info').every(s => checkSectionComplete(s.id)); }

        function calculateScore(sectionId) {
            const sec = appData.sections.find(s => s.id === sectionId);
            if (sec.type === 'mcq') return sec.questions.filter(q => state.mcq.answers[q.id] === q.correct).length;
            return sec.items.length;
        }

        function getTotalQuestionsCount(sec) { return (sec.type === 'mcq') ? sec.questions.length : sec.items.length; }

        function renderContent() {
            const main = document.getElementById('main-content');
            const sec = appData.sections[activeSectionIndex];
            
            let contentHtml = `<div class="text-center mb-8 pt-6"><h2 class="text-4xl md:text-5xl font-bold text-slate-800 mb-4">معاني حروف الجر</h2>${sec.description ? `<p class="text-2xl text-slate-600 mt-6 leading-snug max-w-2xl mx-auto">${sec.description}</p>` : ''}</div>`;
            
            if (sec.type === 'info') contentHtml += renderInfoSection();
            else if (sec.type === 'sort') contentHtml += renderSortGame(sec);
            else contentHtml += renderMCQGame(sec);

            if (sec.type !== 'info') {
                const isSecComplete = checkSectionComplete(sec.id);
                contentHtml += `
                    <div id="sec-res-wrapper-${sec.id}" class="grid-expand ${isSecComplete ? 'grid-1' : 'grid-0'} w-full max-w-lg mx-auto">
                        <div class="overflow-hidden-inner">
                            <div class="bg-slate-800 text-white p-8 rounded-2xl text-center shadow-lg mt-8">
                                <div class="text-6xl mb-4">🏆</div>
                                <h3 id="sec-res-score-${sec.id}" class="text-3xl font-bold mb-2">أحسنت! النتيجة: ${toArabicNum(calculateScore(sec.id))} / ${toArabicNum(getTotalQuestionsCount(sec))}</h3>
                                <p class="text-2xl text-slate-300 mt-4">لقد أنهيت هذا التحدي بنجاحٍ.</p>
                            </div>
                        </div>
                    </div>
                    ${renderSectionEndButtons(sec.id)}
                `;
            }
            main.innerHTML = contentHtml;
        }

        function renderSortGame(sec) {
            const isComplete = checkSectionComplete(sec.id);
            const currentItem = isComplete ? null : state.sort.shuffledItems[state.sort.currentItemIdx];
            let categoriesHtml = '';
            if (currentItem) {
                const shuffledOpts = state.sort.shuffledOptions[currentItem.id];
                const colorClasses = ['bg-emerald-100 text-emerald-800 hover:bg-emerald-200 border-emerald-300', 'bg-purple-100 text-purple-800 hover:bg-purple-200 border-purple-300', 'bg-amber-100 text-amber-800 hover:bg-amber-200 border-amber-300'];
                categoriesHtml = shuffledOpts.map((opt, idx) => `<button onclick="handleSortClick(${opt.originalIndex})" class="flex-1 py-4 px-2 rounded-xl font-bold text-lg md:text-xl text-center transition-transform hover:scale-105 active:scale-95 border-2 ${colorClasses[idx]} outline-none min-h-[5rem] flex items-center justify-center leading-snug">${opt.text}</button>`).join('');
            }
            return `<div class="w-full max-w-2xl mx-auto flex flex-col gap-6"><div class="flex gap-3 w-full justify-between">${categoriesHtml}</div><div class="relative w-full min-h-[14rem] md:min-h-[16rem] bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center p-6 text-right">${currentItem ? `<div class="absolute top-4 left-4 z-10"><button onclick="toggleSortHint()" class="w-10 h-10 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center shadow-sm hover:bg-amber-200 transition-colors">💡</button></div><div id="sort-card" class="w-full bg-white rounded-xl shadow-md border border-slate-200 flex flex-col items-center justify-center p-8 text-center text-2xl md:text-3xl font-bold text-slate-800 transition-all duration-300 transform leading-snug"><div>${currentItem.text}</div><div id="sort-hint-wrapper" class="grid-expand ${state.sort.hintActive ? 'grid-1' : 'grid-0'} w-full mt-4"><div class="overflow-hidden-inner"><div class="p-3 bg-amber-50 border border-amber-200 rounded-lg text-lg md:text-xl text-amber-800 font-normal"><span class="font-bold">تلميح:</span> ${currentItem.hint}</div></div></div></div>` : `<div class="text-3xl font-bold text-emerald-500">تم فرز جميع البطاقات بنجاحٍ!</div>`}</div><div id="sort-feedback-wrapper" class="grid-expand ${state.sort.feedbackActive ? 'grid-1' : 'grid-0'} w-full"><div class="overflow-hidden-inner"><div class="p-4 bg-red-50 border border-red-200 rounded-xl text-center text-red-700 text-xl md:text-2xl font-bold">⚠️ ${currentItem ? currentItem.explanation : ''}</div></div></div>${!isComplete ? `<div class="text-center text-2xl font-bold text-slate-500">البطاقة ${toArabicNum(state.sort.currentItemIdx + 1)} من ${toArabicNum(sec.items.length)}</div>` : ''}</div>`;
        }

        function toggleSortHint() { state.sort.hintActive = !state.sort.hintActive; renderContent(); }

        function handleSortClick(selectedOriginalIndex) {
            if (checkSectionComplete('sort')) return;
            const currentItem = state.sort.shuffledItems[state.sort.currentItemIdx];
            if (selectedOriginalIndex === currentItem.correct) {
                state.sort.currentItemIdx++; state.sort.hintActive = false; state.sort.feedbackActive = false;
                const cardEl = document.getElementById('sort-card');
                if(cardEl) { cardEl.style.transform = 'translateY(-50px) scale(0.9)'; cardEl.style.opacity = '0'; }
                setTimeout(() => { renderTabs(); renderContent(); }, 300);
            } else {
                state.sort.feedbackActive = true;
                const cardEl = document.getElementById('sort-card');
                if(cardEl) { cardEl.classList.remove('animate-shake'); void cardEl.offsetWidth; cardEl.classList.add('animate-shake'); }
                renderContent();
            }
        }

        function renderMCQGame(sec) {
            return sec.questions.map((q, i) => {
                const qNum = toArabicNum(i + 1);
                const isAnswered = state.mcq.answers[q.id] !== undefined;
                const isCorrect = state.mcq.answers[q.id] === q.correct;
                const optionsHtml = state.mcq.shuffled[sec.id][q.id].map((opt, optIndex) => {
                    const isSelected = state.mcq.answers[q.id] === opt.originalIndex;
                    let btnClass = 'bg-white border-slate-200 text-slate-700 hover:border-blue-400', numClass = 'bg-slate-100 text-slate-600';
                    if (isAnswered) {
                        if (isSelected) { btnClass = isCorrect ? 'bg-pastel-success border-pastel-successDark text-pastel-successDark shadow-inner' : 'bg-pastel-danger border-pastel-dangerDark text-pastel-dangerDark shadow-inner'; numClass = isCorrect ? 'bg-pastel-successDark text-white' : 'bg-pastel-dangerDark text-white'; }
                        else if (opt.originalIndex === q.correct) { btnClass = 'bg-white border-pastel-successDark text-pastel-successDark border-dashed'; numClass = 'bg-pastel-success text-pastel-successDark'; }
                        else { btnClass = 'bg-slate-50 border-slate-200 text-slate-400 opacity-50 cursor-not-allowed'; numClass = 'bg-slate-200 text-slate-400'; }
                    }
                    return `<button id="mcq-btn-${q.id}-${optIndex}" onclick="handleMCQClick('${sec.id}', '${q.id}', ${opt.originalIndex})" class="w-full p-5 rounded-xl border-2 transition-colors text-2xl font-medium mb-4 flex items-center gap-4 text-right outline-none ${btnClass}"><div id="mcq-num-${q.id}-${optIndex}" class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-lg font-bold text-2xl transition-colors ${numClass}">${toArabicNum(optIndex + 1)}</div><span class="leading-snug">${opt.text}</span></button>`;
                }).join('');
                return `<div class="w-full max-w-2xl mx-auto py-4"><div class="flex justify-between items-center mb-2 px-2"><span class="text-slate-500 font-bold text-2xl">السؤال ${qNum}</span><button onclick="toggleMCQHint('${q.id}')" class="flex items-center gap-2 text-amber-500 hover:text-amber-600 font-bold px-4 py-2 bg-amber-50 rounded-xl transition-colors outline-none text-xl relative"><span>💡</span><span>تلميح</span></button></div><h3 class="text-3xl font-bold text-slate-800 leading-snug px-2 text-right">${q.text}</h3><div id="mcq-hint-wrapper-${q.id}" class="grid-expand ${state.mcq.hints[q.id] ? 'grid-1' : 'grid-0'} w-full mt-3"><div class="overflow-hidden-inner"><div class="bg-amber-50 border border-amber-300 text-amber-900 p-5 rounded-xl shadow-sm text-xl leading-snug text-right mb-2"><span class="font-bold mb-2 block text-amber-700">💡 تلميح ذكي:</span>${q.hint}</div></div></div><div class="w-full flex flex-col gap-4 mt-6">${optionsHtml}</div><div id="mcq-fb-wrapper-${q.id}" class="grid-expand ${isAnswered ? 'grid-1' : 'grid-0'} w-full mt-4"><div class="overflow-hidden-inner"><div id="mcq-fb-box-${q.id}" class="p-6 rounded-xl border flex items-start gap-4 ${isAnswered ? (isCorrect ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-red-700 bg-red-50 border-red-200') : ''}"><div class="text-3xl">${isCorrect ? '✅' : '❌'}</div><div><h4 class="font-bold text-2xl mb-2">${isCorrect ? 'إجابة صحيحة!' : 'إجابة خاطئة!'}</h4><p class="text-xl leading-snug opacity-90">${q.explanation}</p></div></div></div></div></div><div class="w-full max-w-2xl mx-auto h-px bg-slate-200 my-6 border-0"></div>`;
            }).join('');
        }

        function toggleMCQHint(qId) { state.mcq.hints[qId] = !state.mcq.hints[qId]; renderContent(); }

        function handleMCQClick(secId, qId, val) {
            if (state.mcq.answers[qId] !== undefined) return;
            state.mcq.answers[qId] = val; updateProgressBar();
            if (checkSectionComplete(secId)) { renderTabs(); updateFinalResultVisibility(); }
            renderContent();
        }

        function renderInfoSection() {
            return `<div class="w-full max-w-2xl mx-auto bg-white rounded-3xl p-8 shadow-sm border border-slate-100 flex flex-col gap-8"><p class="text-2xl text-slate-700 leading-relaxed text-right">تتنوع معاني حروف الجر في لغتنا الجميلة حسب السياق. دعنا نتعرف على أبرزها بأسلوبٍ ممتعٍ:</p><div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-2"><div class="bg-blue-50 rounded-2xl p-6 flex flex-col items-center text-center gap-4 border border-blue-100"><div class="text-5xl">🧭</div><div><h3 class="font-bold text-blue-900 text-2xl">المكان والاتجاه</h3><p class="text-slate-600 text-xl mt-2">من (البداية)، وإلى (النهاية)، في (الظرفية)، على (الاستعلاء).</p></div></div><div class="bg-emerald-50 rounded-2xl p-6 flex flex-col items-center text-center gap-4 border border-emerald-100"><div class="text-5xl">⏱️</div><div><h3 class="font-bold text-emerald-900 text-2xl">الزمان</h3><p class="text-slate-600 text-xl mt-2">من، وإلى، وفي تُستخدم أيضًا للدلالة على الأوقات.</p></div></div><div class="bg-amber-50 rounded-2xl p-6 flex flex-col items-center text-center gap-4 border border-amber-100"><div class="text-5xl">⚙️</div><div><h3 class="font-bold text-amber-900 text-2xl">الآلة والوسيلة</h3><p class="text-slate-600 text-xl mt-2">الباء تفيد <b>الآلة</b> (للشيء المادي)، أو <b>الوسيلة</b> (للمعنوي كالعلم والاستعانة).</p></div></div><div class="bg-purple-50 rounded-2xl p-6 flex flex-col items-center text-center gap-4 border border-purple-100"><div class="text-5xl">🔍</div><div><h3 class="font-bold text-purple-900 text-2xl">التشبيه والتفصيل</h3><p class="text-slate-600 text-xl mt-2">الكاف تُستخدم للتشبيه وتأتي لضرب الأمثلة (التفصيل).</p></div></div></div><button onclick="switchSection(1, true)" class="w-full bg-pastel-primaryDark text-white py-5 rounded-2xl font-bold text-3xl hover:bg-blue-700 transition-colors shadow-md mt-4 outline-none">ابدأ التحديات الآن!</button></div>`;
        }

        function renderSectionEndButtons(secId) {
            const isLast = activeSectionIndex === appData.sections.length - 1;
            return `<div class="flex gap-4 w-full max-w-lg mx-auto mt-8"><button onclick="resetSection('${secId}')" class="flex-1 bg-white border-2 border-slate-300 text-slate-700 py-4 rounded-xl font-bold text-2xl hover:bg-slate-50 transition-colors outline-none">إعادة المحاولة</button>${!isLast ? `<button onclick="switchSection(${activeSectionIndex + 1}, true)" class="flex-1 bg-pastel-primaryDark text-white py-4 rounded-xl font-bold text-2xl hover:bg-blue-700 transition-colors shadow-sm outline-none">القسم التالي</button>` : ''}</div>`;
        }

        function updateFinalResultVisibility() {
            const globalResWrapper = document.getElementById('global-res-wrapper');
            if (!globalResWrapper) return;
            if (isAllComplete()) {
                let totalScore = 0, totalQs = 0;
                appData.sections.filter(s => s.type !== 'info').forEach(s => { totalScore += calculateScore(s.id); totalQs += getTotalQuestionsCount(s); });
                document.getElementById('global-final-score').textContent = `${toArabicNum(totalScore)} / ${toArabicNum(totalQs)}`;
                globalResWrapper.classList.replace('grid-0', 'grid-1');
            } else { globalResWrapper.classList.replace('grid-1', 'grid-0'); }
        }

        function resetSection(sectionId) {
            if(sectionId === 'sort') state.sort = { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false };
            else { 
                const sec = appData.sections.find(s => s.id === sectionId);
                sec.questions.forEach(q => { delete state.mcq.answers[q.id]; delete state.mcq.hints[q.id]; });
                state.mcq.shuffled[sectionId] = null;
            }
            initSectionShuffle(sectionId); 
            renderTabs(); 
            renderContent(); 
            updateFinalResultVisibility(); 
            setTimeout(scrollToTabs, 50);
        }

        function startOver() {
            state.mcq = { answers: {}, hints: {}, shuffled: {} };
            state.sort = { currentItemIdx: 0, sorted: {}, shuffledItems: null, shuffledOptions: null, hintActive: false, feedbackActive: false };
            switchSection(0, true);
        }

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [newArr[i], newArr[j]] = [newArr[j], newArr[i]]; }
            return newArr;
        }

        window.onload = () => { switchSection(0, false); }; // التحميل الأول صامت بدون تمرير
    </script>
</body>
</html>
